<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Planejador de Encontros — Catequese</title>
<style>
:root{--roxo:#7c3aed;--roxo-esc:#5b21b6;--bg:#f6f4fb;--card:#fff;--txt:#1f2937;--mut:#6b7280;--verde:#059669;--ambar:#d97706;--borda:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
header.app{background:linear-gradient(135deg,var(--roxo),var(--roxo-esc));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.app .bar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.app h1{font-size:1.05rem;font-weight:700;flex:1;min-width:180px}
header.app .user{font-size:.8rem;opacity:.9;display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{background:var(--roxo);color:#fff;padding:9px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--roxo);border:1.5px solid var(--roxo)}
.btn.mini{padding:5px 10px;font-size:.8rem;border-radius:8px}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.progress{display:flex;gap:8px;align-items:center;margin-top:8px}
.pbar{flex:1;height:10px;background:#e9e5f6;border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.search{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:140px;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--borda);border-left:5px solid var(--roxo);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .1s}
.item:active{transform:scale(.99)}
.item.festa{border-left-color:var(--ambar)}
.item.done{border-left-color:var(--verde);opacity:.85}
.item.sessao{cursor:pointer;border-left-color:var(--roxo)}
.item.sessao .del{background:none;color:var(--mut);font-size:.9rem;padding:2px 6px}
.item .num{min-width:42px;height:42px;border-radius:50%;background:#ede9fe;color:var(--roxo-esc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.item.festa .num{background:#fef3c7;color:var(--ambar)}
.item.done .num{background:#d1fae5;color:var(--verde)}
.item h3{font-size:.95rem}
.item .sub{font-size:.8rem;color:var(--mut)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.p{background:#dbeafe;color:#1d4ed8}.badge.r{background:#d1fae5;color:var(--verde)}
.badge.a{background:#e5e7eb;color:#374151}
.item.arq{opacity:.6;border-left-color:#9ca3af}
.sw{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut);background:#fff;border:1.5px solid var(--borda);border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px;accent-color:var(--roxo)}
#modal{display:none;position:fixed;inset:0;z-index:50}
.m-back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.m-box{position:relative;max-width:480px;margin:8vh auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.m-box .item{margin-bottom:8px}
@media(max-width:520px){.m-box{margin:4vh 12px}}
.tag{display:inline-block;font-size:.72rem;background:#ede9fe;color:var(--roxo-esc);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
.roteiro h2{font-size:1.15rem;margin-bottom:2px}
.roteiro .when{color:var(--mut);font-size:.85rem;margin-bottom:12px}
.roteiro p{margin:10px 0;text-align:justify}
.roteiro .sec-t{font-weight:700;color:var(--roxo-esc);margin-top:18px;display:block}
.roteiro em{color:#374151}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--borda)}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--verde)}
.check label.done{text-decoration:line-through;color:var(--mut)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.status-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:99px;border:1.5px solid var(--borda);background:#fff;font-size:.85rem;font-weight:600}
.pill.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.pill.on.r{background:var(--verde);border-color:var(--verde)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.back{color:#fff;background:rgba(255,255,255,.15);padding:7px 12px;font-size:.85rem}
.login-wrap{max-width:420px;margin:10vh auto;padding:0 16px}
.login-wrap .card{text-align:center;padding:28px 22px}
.logo{font-size:2.6rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.lk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--borda)}
.lk:last-child{border-bottom:none}
.lk a{color:var(--roxo);word-break:break-all;font-size:.88rem;flex:1;text-decoration:none}
.lk a:hover{text-decoration:underline}
.lk-b{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-musica{background:#ede9fe;color:var(--roxo-esc)}
.t-video{background:#dbeafe;color:#1d4ed8}
.t-atividade{background:#d1fae5;color:var(--verde)}
.t-outro{background:#f3f4f6;color:var(--mut)}
.lk .del{background:none;color:var(--mut);font-size:.9rem;padding:2px 6px}
@media(min-width:700px){.item h3{font-size:1rem}}
.aluno{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--borda)}
.aluno:last-child{border-bottom:none}
.aluno .nome{flex:1;font-size:.92rem}
.aluno .nome.inativo{color:var(--mut);text-decoration:line-through}
.aluno input[type=checkbox]{width:22px;height:22px;accent-color:var(--verde)}
.aluno .del{background:none;color:var(--mut);font-size:.9rem;padding:2px 6px}
.resumo-presenca{display:flex;gap:12px;font-size:.8rem;color:var(--mut);margin-top:8px}
.resumo-presenca b{color:var(--txt)}
.conteudo p{margin:10px 0;text-align:justify}
.conteudo h4{font-size:1rem;font-weight:700;color:var(--roxo-esc);margin-top:18px}
.conteudo p>strong:first-child{color:var(--roxo-esc)}
.conteudo ul,.conteudo ol{margin:8px 0 8px 22px}
.conteudo li{margin:4px 0}
.conteudo li p{margin:0;text-align:left}
.conteudo table{border-collapse:collapse;width:100%;font-size:.8rem;margin:10px 0;display:block;overflow-x:auto}
.conteudo td,.conteudo th{border:1px solid var(--borda);padding:4px 6px}
.conteudo.prep{font-size:.92rem;margin-top:6px}
.conteudo.prep p{margin:4px 0}
.m-box .aluno{flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zykvhpheswpfdcwytlyy.supabase.co';
const SUPABASE_KEY='sb_publishable_2zWxpY122ArXbPZaGyiIGA_YXkUCupc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let perfil=null, turmaAtual=null, minhasTurmas=[], turmasIgreja=[], etapas=[];
let user=null, state={}, view={screen:'list', id:null, q:'', filtro:'todos', mostrarArq:false, turmasArq:false};

const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),ms||2200);}
const hoje=()=>new Date().toISOString().slice(0,10);

// ---- conteúdo: encontros da etapa da turma (tabela `encontros`) ----
let encontros=[], encontrosCache={}, linksGlobais={}, alunos=[], materiais=[], materiaisCache={};
function turmaObj(){return minhasTurmas.find(t=>t.id===turmaAtual)||null;}
function etapaDaTurma(){const t=turmaObj();return t?t.etapa:null;}
function turmasAtivas(){return minhasTurmas.filter(t=>t.status!=='arquivada');}
async function carregarEtapas(){
  if(etapas.length)return;
  const {data,error}=await sb.from('etapas').select('id,numero,nome,descricao').order('numero');
  if(error){toast('Erro ao ler etapas: '+error.message);return;}
  etapas=data||[];
}
async function carregarEncontros(etapaId){
  if(encontrosCache[etapaId])return encontrosCache[etapaId];
  const {data,error}=await sb.from('encontros').select('*').eq('etapa_id',etapaId).order('ordem');
  if(error)throw error;
  const lista=(data||[]).map(e=>{
    // conteúdo em HTML; textos antigos (marcação simples) são convertidos na hora
    const html=/^\s*</.test(e.conteudo_html||'')?e.conteudo_html:textoParaHTML(e.conteudo_html||'');
    return {...e,html,busca:(e.titulo+' '+(e.leitura_biblica||'')+' '+html.replace(/<[^>]+>/g,' ')).toLowerCase()};
  });
  encontrosCache[etapaId]=lista;
  return lista;
}
// material de referência da etapa (apresentação, anexos…) — só leitura
async function carregarMateriais(etapaId){
  if(materiaisCache[etapaId])return materiaisCache[etapaId];
  const {data,error}=await sb.from('etapa_materiais').select('id,titulo,conteudo_html,ordem').eq('etapa_id',etapaId).order('ordem');
  materiaisCache[etapaId]=error?[]:(data||[]); // tabela ainda inexistente: sem material
  return materiaisCache[etapaId];
}
// ---- checklist: itens padrão (turma_id nulo) + itens da turma, menos os ocultados pela turma ----
const CHECK_BASE=['Toalha da cor do Tempo Litúrgico no ambão','Vela acesa','Bíblia na Mesa da Palavra','Leitor escalado e passagem combinada','Flores / ornamento (escala da semana)','Materiais da dinâmica separados','História do encontro revisada','Imagem de Nossa Senhora / padroeiro (quem leva?)'];
let checkItens=[], checkOcultos=new Set(), checkPadraoIds=[], checkEditavel=false;
async function carregarChecklist(){
  checkOcultos=new Set();
  const {data,error}=await sb.from('checklist_itens').select('id,texto,ordem,turma_id').or(`turma_id.is.null,turma_id.eq.${turmaAtual}`).order('ordem').order('criado_em');
  if(error){
    // tabela ainda não criada no banco: usa a lista fixa (mesmas posições do formato antigo)
    checkItens=CHECK_BASE.map((t,i)=>({id:String(i),texto:t,turma_id:null}));
    checkPadraoIds=checkItens.map(i=>i.id);checkEditavel=false;return;
  }
  checkItens=data||[];checkEditavel=true;
  checkPadraoIds=checkItens.filter(i=>!i.turma_id).map(i=>i.id);
  const {data:oc}=await sb.from('turma_checklist_ocultos').select('item_id').eq('turma_id',turmaAtual);
  (oc||[]).forEach(o=>checkOcultos.add(o.item_id));
}
function itensVisiveis(){return checkItens.filter(i=>!checkOcultos.has(i.id));}
function normalizarChecklist(v){
  let o=v;
  if(typeof o==='string'){try{o=JSON.parse(o)}catch(e){o={}}}
  if(!o||typeof o!=='object')return {};
  const r={};
  for(const [k,val] of Object.entries(o)){
    if(!val)continue;
    // formato antigo: chave = posição do item na lista padrão
    if(/^\d+$/.test(k)){if(checkPadraoIds[+k])r[checkPadraoIds[+k]]=true;}
    else r[k]=true;
  }
  return r;
}
// ---- estado por turma (vem do banco) ----
function st(id){
  if(!state[id])state[id]={status:'a_planejar',data:'',notas:'',check:{},links:[],te_id:null};
  return state[id];
}
let carregando=false;
async function carregarTurma(){
  if(!turmaAtual)return;
  carregando=true;
  state={};encontros=[];materiais=[];linksGlobais={};alunos=[];presencasCache={};
  render();
  try{
    const et=etapaDaTurma();
    if(et){encontros=await carregarEncontros(et.id);materiais=await carregarMateriais(et.id);}
    await carregarChecklist();
    const {data:als,error:ea}=await sb.from('alunos').select('id,nome,data_nascimento,data_batismo,data_entrada,data_saida,motivo_saida,ativo,observacoes').eq('turma_id',turmaAtual).order('nome');
    if(ea)throw ea;
    alunos=als||[];
    const {data:tes,error:e1}=await sb.from('turma_encontros').select('*').eq('turma_id',turmaAtual);
    if(e1)throw e1;
    for(const te of (tes||[])){
      state[te.encontro_id]={status:te.status,data:te.data||'',notas:te.notas||'',check:normalizarChecklist(te.checklist),links:[],te_id:te.id};
    }
    const {data:tls,error:e2}=await sb.from('turma_links').select('*').eq('turma_id',turmaAtual);
    if(e2)throw e2;
    for(const l of (tls||[]))st(l.encontro_id).links.push({url:l.url,tipo:l.tipo,id:l.id});
    // links pré-fixados pelo admin (globais, só leitura)
    if(encontros.length){
      const {data:gls,error:e3}=await sb.from('encontro_links').select('encontro_id,url,tipo,titulo').in('encontro_id',encontros.map(e=>e.id));
      if(e3)throw e3;
      for(const l of (gls||[]))(linksGlobais[l.encontro_id]=linksGlobais[l.encontro_id]||[]).push({url:l.url,tipo:l.tipo,titulo:l.titulo});
    }
  }catch(e){toast('Erro ao carregar: '+e.message);}
  carregando=false;render();
}
async function upsertTE(id){
  if(!turmaAtual){toast('Nenhuma turma aberta — crie ou abra uma em ▼ Turmas…');return null;}
  const s=st(id);
  if(s.te_id)return s.te_id;
  const {data,error}=await sb.from('turma_encontros').insert({turma_id:turmaAtual,encontro_id:id,status:s.status,data:s.data||null,notas:s.notas||null,checklist:s.check||{}}).select().single();
  if(error){toast('Erro: '+error.message);return null;}
  s.te_id=data.id;return data.id;
}
async function salvarTE(id){
  const s=st(id);
  const te=await upsertTE(id);if(!te)return;
  const {error}=await sb.from('turma_encontros').update({status:s.status,data:s.data||null,notas:s.notas||null,checklist:s.check||{}}).eq('id',te);
  if(error)toast('Erro ao salvar: '+error.message);
}
async function addLinkDB(id,url,tipo){
  const te=await upsertTE(id);if(!te)return;
  const {data,error}=await sb.from('turma_links').insert({turma_id:turmaAtual,encontro_id:id,url,tipo,criado_por:perfil.id}).select().single();
  if(error){toast('Erro: '+error.message);return;}
  st(id).links.push({url,tipo,id:data.id});render();
}
async function delLinkDB(id,i){
  const l=st(id).links[i];
  if(l.id){const {error}=await sb.from('turma_links').delete().eq('id',l.id);if(error){toast('Erro: '+error.message);return;}}
  st(id).links.splice(i,1);render();
}

let ultimoDetalhe=null;
function render(){
  const app=$('#app');
  if(!user){app.innerHTML=loginHTML();document.title='Planejador de Encontros — Catequese';return;}
  const et=etapaDaTurma();
  document.title='Planejador de Encontros'+(et?' — '+et.nome:'');
  if(view.screen==='detail'&&encontros.some(e=>e.id===view.id)){
    app.innerHTML=detailHTML();
    if(ultimoDetalhe!==view.id){window.scrollTo(0,0);ultimoDetalhe=view.id;}
    return;
  }
  if(view.screen==='material'&&materiais.length){app.innerHTML=materialHTML();window.scrollTo(0,0);return;}
  view.screen='list';ultimoDetalhe=null;
  app.innerHTML=listHTML();
  const q=$('#q'),f=$('#filtro');
  if(q){q.value=view.q;q.oninput=e=>{view.q=e.target.value;renderListItems();};}
  if(f){f.value=view.filtro;f.onchange=e=>{view.filtro=e.target.value;renderListItems();};}
  renderListItems();
}
function loginHTML(){
  return `<div class="login-wrap"><div class="card">
    <div class="logo">📖</div>
    <h2 style="margin:8px 0 4px">Planejador de Encontros</h2>
    <p style="color:var(--mut);font-size:.9rem;margin-bottom:18px">Catequese — planejamento dos encontros e registro de presença</p>
    <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%" id="btn-entrar" onclick="entrar()">Entrar</button>
    <p style="font-size:.75rem;color:var(--mut);margin-top:12px">Acesso exclusivo de catequistas cadastrados. Solicite sua conta ao coordenador.</p>
  </div></div>`;
}
async function entrar(){
  const email=$('#email').value.trim(), senha=$('#senha').value;
  if(!email||!senha){toast('Informe e-mail e senha');return;}
  const b=$('#btn-entrar');b.disabled=true;b.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:senha});
  b.disabled=false;b.textContent='Entrar';
  if(error){toast('Login inválido: '+error.message);return;}
  await posLogin();
}
async function posLogin(){
  const {data:{user:u}}=await sb.auth.getUser();
  if(!u)return;
  const {data:c,error:e}=await sb.from('catequistas').select('id,nome,igreja_id,ativo,igrejas(nome)').eq('auth_uid',u.id).maybeSingle();
  if(e){toast('Erro no perfil: '+e.message);return;}
  if(!c||c.ativo===false){
    // o cadastro do catequista e a associação à igreja são feitos pelo administrador
    await sb.auth.signOut();user=null;render();
    toast(c?'Sua conta está desativada — procure o coordenador da catequese':'Sua conta ainda não foi configurada — procure o coordenador da catequese',7000);
    return;
  }
  perfil={...c,igreja_nome:c.igrejas?c.igrejas.nome:''};
  await carregarEtapas();
  await carregarMinhasTurmas();
  const ativas=turmasAtivas();
  if(!ativas.some(t=>t.id===turmaAtual))turmaAtual=ativas.length?ativas[0].id:null;
  user=perfil.nome;
  if(turmaAtual)await carregarTurma();
  else{render();toast('Bem-vindo(a)! Crie uma turma ou entre em uma turma já existente da sua igreja.',6000);gerenciarTurmas();}
}
async function sair(){
  await sb.auth.signOut();
  user=null;perfil=null;turmaAtual=null;minhasTurmas=[];state={};encontros=[];encontrosCache={};
  view.screen='list';render();
}

// ---- turmas ----
async function carregarMinhasTurmas(){
  const {data,error}=await sb.from('turma_catequista').select('turma_id,turmas(id,nome,ano_inicio,status,igrejas(nome),turma_etapas(etapa_id,data_inicio,data_fim))').eq('catequista_id',perfil.id);
  if(error){toast('Erro ao ler turmas: '+error.message);minhasTurmas=[];return;}
  minhasTurmas=(data||[]).filter(x=>x.turmas).map(x=>{
    const t=x.turmas;
    // etapa em curso: a sem data_fim (ou a mais recente)
    const tes=(t.turma_etapas||[]).slice().sort((a,b)=>(a.data_fim?1:0)-(b.data_fim?1:0)||String(b.data_inicio).localeCompare(String(a.data_inicio)));
    const et=tes.length?etapas.find(e=>e.id===tes[0].etapa_id)||null:null;
    return {id:t.id,nome:t.nome,ano:t.ano_inicio,status:t.status,igreja:t.igrejas?t.igrejas.nome:'',etapa:et};
  }).sort((a,b)=>(b.ano-a.ano)||a.nome.localeCompare(b.nome));
  const {data:tI}=await sb.from('turmas').select('id,nome,ano_inicio,status').eq('igreja_id',perfil.igreja_id).order('nome');
  turmasIgreja=(tI||[]).filter(t=>t.status!=='arquivada'&&!minhasTurmas.some(m=>m.id===t.id));
}
const rotuloEtapa=e=>e?e.numero+'ª etapa':'sem etapa';
async function gerenciarTurmas(){
  await carregarMinhasTurmas();
  const nArq=minhasTurmas.filter(t=>t.status==='arquivada').length;
  const lista=minhasTurmas.filter(t=>view.turmasArq||t.status!=='arquivada');
  const htmlMinhas=lista.length?lista.map(t=>{
    const arq=t.status==='arquivada';
    return `<div class="aluno">
      <span class="nome ${arq?'inativo':''}">${esc(t.nome)} <span style="color:var(--mut);font-size:.75rem">· ${esc(t.ano)} · ${rotuloEtapa(t.etapa)}${arq?' · arquivada':''}</span></span>
      ${arq?`<button class="btn mini sec" onclick="arquivarTurma('${t.id}',false)">Desarquivar</button>`
           :`<button class="btn mini" onclick="abrirTurma('${t.id}')">Abrir</button><button class="btn mini sec" onclick="arquivarTurma('${t.id}',true)">Arquivar</button>`}
      <button class="btn mini" style="background:#b91c1c" onclick="sairTurma('${t.id}')">Sair</button></div>`;
  }).join(''):'<p style="font-size:.85rem;color:var(--mut)">Você não tem turmas ativas.</p>';
  const htmlOutras=turmasIgreja.length?`<p style="font-size:.8rem;font-weight:700;margin:14px 0 6px">Turmas da sua igreja — adira a uma:</p>`+
    turmasIgreja.map(t=>`<div class="aluno"><span class="nome">${esc(t.nome)} <span style="color:var(--mut);font-size:.75rem">· ${esc(t.ano_inicio)}</span></span>
      <button class="btn mini" onclick="aderirTurma('${t.id}')">Aderir</button></div>`).join(''):'';
  const optEtapas=etapas.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('');
  const optOrigem=minhasTurmas.map(t=>`<option value="${t.id}">${esc(t.nome)} · ${esc(t.ano)} · ${rotuloEtapa(t.etapa)}</option>`).join('');
  modal(`<h3 style="margin-bottom:4px">▼ Turmas</h3>
    <p style="font-size:.8rem;color:var(--mut);margin-bottom:10px">Igreja: <b>${esc(perfil.igreja_nome||'')}</b></p>
    ${htmlMinhas}
    ${nArq?`<label class="sw" style="margin-top:8px;display:inline-flex"><input type="checkbox" ${view.turmasArq?'checked':''} onchange="view.turmasArq=this.checked;gerenciarTurmas()"> Mostrar arquivadas (${nArq})</label>`:''}
    ${htmlOutras}
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--borda)">
      <b style="font-size:.9rem">Criar nova turma</b>
      <div class="row" style="margin-top:8px">
        <div class="field" style="flex:2"><label>Nome</label><input id="nt-nome" placeholder="Ex.: Turma São José"></div>
        <div class="field" style="flex:1"><label>Ano de início</label><input id="nt-ano" type="number" value="${new Date().getFullYear()}"></div>
      </div>
      <div class="field"><label>Etapa</label><select id="nt-etapa"><option value="">Escolha a etapa…</option>${optEtapas}</select></div>
      ${minhasTurmas.length?`<div class="field"><label>Importar alunos de outra turma (opcional)</label><select id="nt-origem"><option value="">Não importar</option>${optOrigem}</select></div>`:''}
      <div style="text-align:right"><button class="btn" id="btn-criar" onclick="criarTurma()">Criar turma</button></div>
      <p style="font-size:.75rem;color:var(--mut)">Ao avançar de etapa, crie uma nova turma e importe os alunos da anterior. Turmas antigas continuam acessíveis até serem arquivadas.</p>
    </div>
    <div style="text-align:right;margin-top:10px"><button class="btn sec mini" onclick="fecharModal()">Fechar</button></div>`);
}
async function abrirTurma(tid){
  turmaAtual=tid;fecharModal();view.screen='list';await carregarTurma();
}
async function aderirTurma(tid){
  const {error}=await sb.from('turma_catequista').insert({turma_id:tid,catequista_id:perfil.id,papel:'catequista'});
  if(error){toast('Erro: '+error.message);return;}
  toast('Você entrou na turma ✓');
  await carregarMinhasTurmas();await abrirTurma(tid);
}
async function sairTurma(tid){
  if(!confirm('Sair desta turma? Seu planejamento nela será mantido no banco, mas você deixará de vê-la.'))return;
  const {error}=await sb.from('turma_catequista').delete().eq('turma_id',tid).eq('catequista_id',perfil.id);
  if(error){toast('Erro: '+error.message);return;}
  await carregarMinhasTurmas();
  await aposMudarTurmas(tid);
}
async function arquivarTurma(tid,arquivar){
  if(arquivar&&!confirm('Arquivar esta turma? Ela deixa de aparecer para todos os catequistas da turma. Os dados são mantidos e ela pode ser desarquivada depois.'))return;
  const {data,error}=await sb.from('turmas').update({status:arquivar?'arquivada':'ativa'}).eq('id',tid).select('id');
  if(error){toast('Erro: '+error.message);return;}
  if(!data||!data.length){toast('Sem permissão para alterar a turma — verifique a atualização do banco (script SQL)');return;}
  toast(arquivar?'Turma arquivada 📦':'Turma reativada ✓');
  await carregarMinhasTurmas();
  if(arquivar)await aposMudarTurmas(tid);else render();
  gerenciarTurmas();
}
// se a turma aberta deixou de estar disponível, abre outra
async function aposMudarTurmas(tid){
  if(turmaAtual!==tid){render();return;}
  const ativas=turmasAtivas();
  turmaAtual=ativas.length?ativas[0].id:null;view.screen='list';
  if(turmaAtual)await carregarTurma();else{state={};encontros=[];render();}
}
async function criarTurma(){
  const nome=$('#nt-nome').value.trim(), ano=parseInt($('#nt-ano').value)||new Date().getFullYear();
  const etapaId=$('#nt-etapa').value, origem=$('#nt-origem')?$('#nt-origem').value:'';
  if(!nome){toast('Digite o nome da turma');return;}
  if(!etapaId){toast('Escolha a etapa da turma');return;}
  const b=$('#btn-criar');b.disabled=true;
  try{
    const {data:t,error:e1}=await sb.from('turmas').insert({igreja_id:perfil.igreja_id,nome,ano_inicio:ano}).select().single();
    if(e1){toast(e1.code==='23505'?'Já existe uma turma com esse nome e ano nesta igreja — use outro nome':'Erro: '+e1.message,5000);return;}
    // associar o criador ANTES da etapa: a regra de acesso de turma_etapas exige que a turma já seja do catequista
    const {error:e2}=await sb.from('turma_catequista').insert({turma_id:t.id,catequista_id:perfil.id,papel:'titular'});
    if(e2){toast('Erro ao associar você à turma: '+e2.message,5000);return;}
    const {error:e3}=await sb.from('turma_etapas').insert({turma_id:t.id,etapa_id:etapaId,data_inicio:hoje()});
    if(e3){toast('Erro ao definir a etapa: '+e3.message,5000);return;}
    let importados=0;
    if(origem){
      const {data:als,error:e4}=await sb.from('alunos').select('nome,data_nascimento,data_batismo,observacoes').eq('turma_id',origem).eq('ativo',true);
      if(!e4&&als&&als.length){
        const {error:e5}=await sb.from('alunos').insert(als.map(a=>({...a,turma_id:t.id})));
        if(e5)toast('Turma criada, mas houve erro ao importar alunos: '+e5.message,5000);else importados=als.length;
      }
    }
    toast('Turma criada ✓'+(importados?` — ${importados} aluno(s) importado(s)`:''),4000);
    await carregarMinhasTurmas();await abrirTurma(t.id);
  }finally{if(b)b.disabled=false;}
}

function renderListItems(){
  const el=$('#lista');if(!el)return;
  if(carregando){el.innerHTML='<div class="empty">Carregando…</div>';return;}
  if(!encontros.length){el.innerHTML='<div class="empty">O conteúdo desta etapa ainda não foi cadastrado.</div>';return;}
  const q=view.q.toLowerCase(), f=view.filtro;
  const list=encontros.filter(d=>{
    const s=st(d.id);
    if(!view.mostrarArq&&s.status==='arquivado')return false;
    if(f==='celebracao'){if(d.tipo!=='celebracao')return false;}
    else if(f!=='todos'&&s.status!==f)return false;
    if(q&&!d.busca.includes(q))return false;
    return true;
  });
  el.innerHTML=list.length?list.map(d=>{
    const s=st(d.id);
    const badge=s.status==='planejado'?'<span class="badge p">Planejado</span>':s.status==='realizado'?'<span class="badge r">Realizado</span>':s.status==='arquivado'?'<span class="badge a">Arquivado</span>':'';
    const num=d.numero?`<div class="num">${d.numero}º</div>`:`<div class="num">✨</div>`;
    return `<div class="item ${d.tipo==='celebracao'?'festa':''} ${s.status==='realizado'?'done':''} ${s.status==='arquivado'?'arq':''}" onclick="abrir('${d.id}')">

      <div class="sub">${esc(d.tempo_liturgico||'')}${d.leitura_biblica?' · 📖 '+esc(d.leitura_biblica):''}</div>

  }).join(''):'<div class="empty">Nenhum encontro encontrado com esse filtro.</div>';
}

// converte o formato antigo (texto com marcação simples) em HTML — usado só enquanto
// o conteúdo do banco não estiver gravado em HTML
function textoParaHTML(t){
  return t.replace(/\r\n/g,'\n').split(/\n\n+/).map(p=>{
    p=p.trim();if(!p||/^\*+$/.test(p))return '';
    p=esc(p);
    if(/^#{2,4} /.test(p))return '<h4>'+p.replace(/^#+ /,'').replace(/\*+/g,'')+'</h4>';
    for(const h of ['Palavra inicial','Preparando o ambiente','Preparar o ambiente','Acolhida','Recordação da vida','Oração inicial','Leitura do texto bíblico','Leitura texto bíblico','Leitura bíblica','Dinâmica','Conclusão','Oração final','Material de apoio','Lembretes','Observação','Dica']){
      if(p.startsWith(h+':')){p='<strong>'+h+':</strong>'+p.slice(h.length+1);break;}
    }
    return '<p>'+p
      .replace(/\*\*\*(.+?)\*\*\*/g,'<b><em>$1</em></b>')
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/(^|\s)\*(?=\s|$)/g,'$1')+'</p>';
  }).join('');
}

function editarChecklist(){

                 :`<button class="btn mini sec" onclick="alternarItemCk('${i.id}',${!oculto})">${oculto?'Mostrar':'Ocultar'}</button>`)+`</div>`;
  }).join('');
  modal(`<h3 style="margin-bottom:4px">✅ Itens do checklist</h3>
    <p style="font-size:.8rem;color:var(--mut);margin-bottom:10px">Valem para todos os encontros desta turma. Itens padrão podem ser ocultados; itens criados para a turma podem ser excluídos.</p>

async function addItemCk(){
  const texto=$('#ck-novo').value.trim();
  if(!texto){toast('Digite o texto do item');return;}
  const ordem=Math.max(0,...checkItens.map(i=>i.ordem||0))+1;
  const {data,error}=await sb.from('checklist_itens').insert({turma_id:turmaAtual,texto,ordem}).select('id,texto,ordem,turma_id').single();
  if(error){toast('Erro: '+error.message);return;}
  checkItens.push(data);editarChecklist();render();
}
async function excluirItemCk(id){
  if(!confirm('Excluir este item do checklist da turma?'))return;
  const {error}=await sb.from('checklist_itens').delete().eq('id',id);
  if(error){toast('Erro: '+error.message);return;}
  checkItens=checkItens.filter(i=>i.id!==id);editarChecklist();render();
}
async function alternarItemCk(id,ocultar){
  const {error}=ocultar
    ?await sb.from('turma_checklist_ocultos').insert({turma_id:turmaAtual,item_id:id})
    :await sb.from('turma_checklist_ocultos').delete().eq('turma_id',turmaAtual).eq('item_id',id);
  if(error){toast('Erro: '+error.message);return;}
  if(ocultar)checkOcultos.add(id);else checkOcultos.delete(id);
  editarChecklist();render();
}
function chamadaHTML(id){
  const ativos=alunos.filter(a=>a.ativo);
  const inativos=alunos.filter(a=>!a.ativo);
  const linha=(a,inas)=>{
    const marcada=presencaDe(id,a.id);
    return `<div class="aluno"><input type="checkbox" ${marcada?'checked':''} onchange="setPresenca('${id}','${a.id}',this.checked)"><span class="nome ${inas?'inativo':''}">${esc(a.nome)}${inas?' <span style="font-size:.7rem">(saiu)</span>':''}</span>${inas?'':`<button class="del" title="Registrar saída" onclick="saidaAluno('${a.id}')">🚪</button>`}</div>`;
  };
  const p=ativos.filter(a=>presencaDe(id,a.id)).length;
  return (ativos.length||inativos.length)?
    ativos.map(a=>linha(a,false)).join('')+
    (inativos.length?`<p style="font-size:.75rem;color:var(--mut);margin:8px 0 2px">Alunos que saíram (histórico):</p>`+inativos.map(a=>linha(a,true)).join(''):'')+
    `<div class="resumo-presenca"><span>Presentes: <b>${p}</b>/${ativos.length}</span></div>`
    :'<p style="font-size:.85rem;color:var(--mut)">Nenhum aluno cadastrado nesta turma ainda.</p>';
}
function teDe(id){return st(id).te_id;}
function presencaDe(id,alunoId){
  const te=teDe(id);
  return te&&presencasCache[te]&&presencasCache[te][alunoId]===true;
}
let presencasCache={};
async function carregarPresencas(id){
  const te=teDe(id);if(!te)return;
  if(presencasCache[te])return;
  const {data,error}=await sb.from('presencas').select('aluno_id,presente').eq('turma_encontro_id',te);
  if(error){toast('Erro ao ler presenças: '+error.message);return;}
  presencasCache[te]={};
  (data||[]).forEach(p=>{if(p.presente)presencasCache[te][p.aluno_id]=true;});
}
async function setPresenca(id,alunoId,v){
  const te=teDe(id);if(!te){toast('Salve o planejamento do encontro primeiro (mude o status)');render();return;}
  if(!presencasCache[te])presencasCache[te]={};
  if(v){
    const {error}=await sb.from('presencas').upsert({turma_encontro_id:te,aluno_id:alunoId,presente:true},{onConflict:'turma_encontro_id,aluno_id'});
    if(error){toast('Erro: '+error.message);return;}
    presencasCache[te][alunoId]=true;
  }else{
    const {error}=await sb.from('presencas').delete().eq('turma_encontro_id',te).eq('aluno_id',alunoId);
    if(error){toast('Erro ao desmarcar: '+error.message);return;}
    delete presencasCache[te][alunoId];
  }
  render();
}
async function addAluno(){
  const nome=$('#al-nome').value.trim();
  if(!nome){toast('Digite o nome do aluno');return;}
  const {data,error}=await sb.from('alunos').insert({turma_id:turmaAtual,nome}).select().single();
  if(error){toast('Erro: '+error.message);return;}
  alunos.push(data);alunos.sort((a,b)=>a.nome.localeCompare(b.nome));
  render();toast('Aluno cadastrado ✓');
}
async function saidaAluno(alunoId){
  const a=alunos.find(x=>x.id===alunoId);if(!a)return;
  const data=prompt('Data de saída (AAAA-MM-DD) — Enter para hoje:',hoje());
  if(data===null)return;
  const motivo=prompt('Motivo da saída (opcional):')||null;
  const {error}=await sb.from('alunos').update({ativo:false,data_saida:data||hoje(),motivo_saida:motivo}).eq('id',alunoId);
  if(error){toast('Erro: '+error.message);return;}
  a.ativo=false;a.data_saida=data;a.motivo_saida=motivo;
  render();toast('Saída registrada — histórico preservado');
}
function setStatus(id,v){st(id).status=v;salvarTE(id);toast(v==='realizado'?'Marcado como realizado ✓':v==='planejado'?'Marcado como planejado':v==='arquivado'?'Encontro arquivado — não aparece na lista (ative “Arquivados” para vê-lo)':'Voltou para “a planejar”');render();}
const TIPO_L={musica:'🎵 Música',video:'🎬 Vídeo',atividade:'✂️ Atividade',outro:'📄 Outro'};
function tituloDoLink(u){
  try{const p=new URL(u);return p.hostname.replace(/^www\./,'');}catch(e){return u;}
}
function linksHTML(id){
  const lks=st(id).links||[];
  if(!lks.length)return '<p style="font-size:.85rem;color:var(--mut)">Nenhum link ainda. Adicione músicas, vídeos ou atividades abaixo.</p>';
  return lks.map((l,i)=>`<div class="lk"><span class="lk-b t-${esc(l.tipo)}">${TIPO_L[l.tipo]||TIPO_L.outro}</span><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><button class="del" title="Remover" onclick="delLink('${id}',${i})">✕</button></div>`).join('');
}
async function addLink(id){
  const url=$('#lk-url').value.trim(),tipo=$('#lk-tipo').value;
  if(!url){toast('Cole o endereço do link');return;}
  let u=url;if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){toast('Endereço inválido');return;}
  await addLinkDB(id,u,tipo);
}
async function delLink(id,i){await delLinkDB(id,i);}
function setF(id,k,v){st(id)[k]=v;salvarTE(id);}
function setCk(id,itemId,v){const c=st(id).check;if(v)c[itemId]=true;else delete c[itemId];salvarTE(id);render();}
(async function init(){
  const {data:{user:u}}=await sb.auth.getUser();
  if(u)await posLogin();else render();
})();
</script>
</body>
