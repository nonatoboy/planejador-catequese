a Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nRelembrar com os catequizandos a história do santo padroeiro da paróquia ou comunidade.\n\nPerguntar aos catequizandos quem fez a pesquisa sobre a vida de um santo conforme foi solicitado no encontro anterior. Criar um clima de confiança e tranquilidade para que cada catequizando possa expor para a turma a sua pesquisa sem nervosismo.\n\nNesse momento deverá ser pego o painel (bloco de isopor), e, à medida que cada catequizando for apresentar o seu santo, deverá pregar com alfinete ou com fita adesiva no isopor ou cartolina a imagem do santo que pesquisou. Após afixar a foto, o catequizando deverá contar tudo o que descobriu sobre a vida do santo e o que mais lhe chamou a atenção.\n\nO catequista deverá indagar aos demais catequizandos se eles querem acrescentar ou perguntar algo para o expositor. Também deverá complementar a história do santo, caso tenha ficado esquecido algum relato importante sobre a sua vida (fazer isso ao final de cada apresentação).\n\nConclusão: O catequista deverá colocar no ambão o painel junto com as imagens dos santos. Pedir para que os catequizandos olhem para imagem e vejam ali, retratadas, imagens de pessoas que tiveram uma vida de doação ao próximo, sendo obedientes à Palavra de Deus. Depois o catequista pode pedir para cada catequizando escolher o santo que mais lhe chamou atenção e anota o seu nome, para que, a partir deste encontro, o santo escolhido seja o seu santo de devoção, e, sempre nos momentos pessoais de oração, o catequizando possa pedir sua intercessão.\n\nNo final, o catequista orienta os catequizandos a colarem ou desenharem a foto do santo que escolheram como modelo e intercessor no Diário Catequético e Espiritual.\n\nOração final: Na Santa Missa, durante a celebração o padre faz um pedido. Ele pede que nós sejamos uma oferenda perfeita ao Pai. Vamos repetir juntos essa parte da Liturgia Eucarística (o catequista reza e os catequizandos repetem):\n\n\"Fazei de nós/ uma oferenda perfeita/ para alcançarmos a vida eterna/ com os vossos santos/ A virgem Maria mãe de Deus/ os vossos apóstolos e mártires/ e todos os santos/ que não cessam/ de interceder por nós/ na vossa presença\".\n\nLogo após o catequista reza o Pai-nosso e conclui com a oração:\n\nDeus Pai bondoso, olhai pelos vossos filhos e filhas que aqui hoje se reúnem e aspiram à santidade. Fazei que, a exemplo de tantos homens e mulheres, possamos chegar um dia à vida eterna. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n\"...N..., sede santo. Vai em paz, e que o Senhor te acompanhe! Amém\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e flores. Painel onde serão afixadas as fotos de todos os santos pesquisados pelos catequizandos (poderá ser feito com uma placa de isopor ou cartolina)."}, {"id": "e27", "num": 27, "kind": "encontro", "title": "Na remissão dos pecados", "when": "Tempo comum", "biblia": "Lc 24,45-48", "body": "Na remissão dos pecados\n\nPalavra inicial: Prezados catequistas, neste encontro buscaremos refletir com os catequizandos sobre o décimo artigo da Profissão de Fé. Cristo conferiu à Igreja o poder de perdoar os pecados.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores e quadro com imagem do Pai misericordioso (*Lc 15,11-24*) e estola roxa, jarro com água e bacia, lembrando o batismo, veste branca e toalha para os catequizandos enxugarem as mãos.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os para dentro da sala: \"...N..., a Igreja te chama à reconciliação, seja bem-vindo!\" Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: De pé, ao redor da Mesa da Partilha ou da Mesa da Palavra, os catequizandos farão uma retrospectiva da semana, destacando os acontecimentos e fatos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: Em clima de oração e recolhimento o catequista inicia a oração invocando o Espírito Santo, rezando ou cantando. Poderá ser rezada, se oportuno, a Profissão de Fé, e aclamar o Evangelho com um canto.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico. Antes, porém, todos podem aclamar o Evangelho com um canto.\n\nLeitura do texto bíblico: *Lc 24,45-48*.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] em seu nome seria pregada a todas as nações a conversão para o perdão dos pecados...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir o texto bíblico. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Refletir com os catequizandos o texto bíblico, enfatizando que Jesus morreu na cruz por amor à humanidade, para salvar todo homem e mulher da morte do pecado. Por sua morte todos fomos lavados em seu sangue. Ele, não tendo pecado, assumiu os nossos pecados.\n\nO próprio Cristo deixou, antes de subir junto ao Pai, a missão e o poder à Igreja de perdoar os pecados.\n\nPedir aos catequizandos para que abram suas bíblias e procurem a passagem de *Jo 20,22-23*. Pedir para que um dos catequizandos a proclame.\n\n****\n\nDepois refletir com os catequizandos dizendo que foi transmitindo o Espírito Santo aos apóstolos que Cristo ressuscitado lhes conferiu seu próprio poder de perdoar os pecados (CIC 976). Portanto, a Igreja tem essa missão e poder de perdoar todos os pecados daqueles que com coração sincero e arrependido pedirem o perdão. Não há pecado algum que a Santa Igreja não possa perdoar.\n\nO primeiro e principal sacramento para a remissão dos pecados é o Batismo. Nele somos lavados e purificados (o catequista pode mostrar o jarro com água e a veste branca, fazendo menção a esse sacramento). Para os pecados cometidos depois do Batismo, Cristo instituiu o Sacramento da Reconciliação ou Penitência, por meio do qual o batizado se reconcilia com Deus e com a Igreja (podendo mostrar a estola roxa, fazendo menção a esse sacramento).\n\nOs padres e os sacramentos são meros instrumentos dos quais Cristo, único autor e dispensador de nossa salvação, se apraz em se servir para pagar nossas faltas e dar-nos a graça da justificação (CIC 987).\n\nApós expor o conteúdo, o catequista poderá propor aos catequizandos um momento de silêncio para que possam refletir sobre as suas faltas, naquilo que cada um poderia melhorar. No amor ao próximo, no respeito e obediência aos pais etc. Poderá ser colocada uma música instrumental para contribuir à reflexão.\n\nDepois de alguns minutos o catequista convida cada catequizando a se aproximar da bacia com água onde um catequizando lavará a mão do outro, simbolizando que, lavados pelo batismo, somos responsáveis por ajudar nossos irmãos e irmãs a viverem retamente. Enquanto isso poderá se ter um canto.\n\n**Conclusão:** O catequista reforça aos catequizandos a importância dos sacramentos, principalmente o Sacramento da Penitência, dizendo que é um momento por excelência para se reconciliar com Deus, pois, quando pecamos, dele nos distanciamos. Além disso, poderá ir preparando-os, dizendo que o ano que vem, na terceira etapa, eles serão convidados a fazer a experiência da confissão individual com o padre, onde o próprio Jesus estará de braços abertos a nos acolher.\n\n**Oração final:** Ao redor da Mesa da Palavra, o catequista motiva os catequizandos a formularem preces e pedidos de perdão. Poderá encerrar com o Pai-nosso e com a oração:\n\n\"Senhor nosso Deus, que olha com amor e com misericórdia para o ser humano. Tenha compaixão de cada um de nós e que, ao nos aproximarmos dos sacramentos da tua Igreja, sejamos acolhidos no amor. Por Cristo Nosso Senhor. Amém.\"\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n\"...N... vai em paz, e que o Senhor te acompanhe! Amém\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores e quadro com imagem do Pai misericordioso (*Lc 15,11-24*) e estola roxa, jarro com água e bacia, lembrando o batismo, veste branca e toalha para os catequizandos enxugarem as mãos."}, {"id": "e28", "num": 28, "kind": "encontro", "title": "Creio \"na ressurreição da carne, na vida eterna\"", "when": "Tempo comum", "biblia": "Rm 8,9-11", "body": "**Palavra inicial:** Amado catequista, no encontro de hoje queremos refletir sobre os dois últimos artigos da Profissão de Fé. Acreditar na ressurreição da carne e na vida eterna.\n\n**Preparar o ambiente:** Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Fotos ou imagens de uma lagarta, casulo e de uma borboleta.\n\n**Acolhida:** À medida que os catequizandos vão chegando, o catequista os acolhe, saudando-os com a frase: \"...N..., nós cremos na vida eterna, seja bem-vindo!\", e convida-os a entrarem para o local do encontro.\n\n**Recordação da vida:** Ao redor da Mesa da Partilha ou da Mesa da Palavra o catequista motiva os catequizandos a fazer um momento de recordação da vida, onde lembrarão fatos e acontecimentos que marcaram a vida de cada um, de suas famílias, comunidade e da sociedade.\n\nNA MESA DA PALAVRA\n\n**Oração inicial:** Após o momento de recordação da vida, o catequista inicia um momento de oração pedindo o Espírito Santo sobre todos os catequizandos e sobre toda a Igreja. Poderá rezar o Credo.\n\nAinda em clima de oração, o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\n**Leitura do texto bíblico:** Rm 8,9-11.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] se o Espírito daquele que ressuscitou Jesus dos mortos habita em vós, quem ressuscitou Jesus Cristo dos mortos também dará a vida a vossos corpos mortais pelo seu Espírito que habita em vós.\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista incentiva os catequizandos a reconstruírem o texto bíblico. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após conta a história \"Um até breve, Padre Pedro\".\n\nUm até breve, Padre Pedro\n\nMuitos anos haviam se passado desde que os gêmeos Otávio e Leandro, e Isabel, haviam viajado no tempo indo parar na época de Jesus. E a mesma viagem haviam feito o Padre Pedro, Fernando e Amanda. Vocês se lembram que Fernando era aquele menino cego que, ao crescer, se casou e teve dois filhos, os gêmeos? Ah e claro, que era músico e que integrava um grupo que fazia a animação das missas dominicais à noite? E também de Amanda, mãe de Isabel, e do Padre Pedro, que no primeiro ano de catequese o chamávamos de Pedrinho, não é mesmo?\n\nEntão, os três já estavam bem velhinhos. Os gêmeos estavam casados, tinham filhos, e Isabel havia se tornado freira. Depois de uns sete anos sem se encontrarem eles estavam juntos, só que por um motivo não muito bom. Eles estavam no velório do Padre Pedro.\n\nApesar de ser um momento de muita saudade e tristeza, eles sabiam que o padre estava bem, aliás, bem melhor do que ali. Ele também tinha a certeza de que não era o fim da vida do padre, mas o recomeço de uma nova vida.\n\nE Otávio explicava para seus filhos, Augusto e Miriam, que assim como Jesus morreu e ressuscitou, nós todos também morreremos e ressuscitaremos com Ele por meio do Espírito Santo.\n\n- Ah papai, mas é ruim ficar com saudade das pessoas que morrem - disse Miriam.\n\n- Sentir saudades não é legal mesmo, mas é assim que acontece e todos vamos nos reencontrar com aqueles que já morreram; então, esse sentimento chato não vai durar para sempre.\n\n- Ah que bom! - respondeu Miriam, que foi brincar com o irmão Augusto e outras crianças.\n\nAntes do enterro, Isabel, que agora era a irmã Isabel, rezou o terço, e Fernando cantou e tocou a seguinte música:\n\n- Se as águas, do mar da vida, quiserem te afogar... Segura na mão de Deus e vai! Segura na mão de Deus, segura na mão de Deus. Pois ela, ela te sustentará. Não temas, segue adiante e não olhes para trás. Segura na mão de Deus e vai!\n\nE na hora do enterro, no final da tarde, fez-se um belíssimo pôr do sol. Borboletas enfeitaram o céu naquele momento que não era de despedida, mas um até breve.\n\nNo final da história perguntar aos catequizandos o que eles sabem sobre o que acontece com a lagarta depois de um tempo (mostrar a foto da lagarta). Deixar os catequizandos falarem.\n\nDepois mostra-lhes a foto do casulo e da borboleta, dizendo que o que a lagarta nela experimenta é a morte, quando ela se transforma em casulo e dele sai uma linda borboleta. Entretanto, a sua morte não é o fim, mas transformação, através da qual aparece um ser qualitativamente novo, a borboleta (Renold J. Blank, 2000). Ou seja, nós somos essa lagartinha que caminha neste mundo, feia muitas vezes por causa de nossos pecados, mas após um tempo precisamos partir, morremos, fazemos nossa páscoa (passagem para junto de Deus) e nos transformamos em lindas borboletas, coloridas, sem pecado, a estar eternamente junto de Deus. O casulo que fica é o nosso corpo corruptível, sinal da nossa peregrinação terrestre, sinal da nossa passagem para a vida eterna. No céu seremos únicos e viveremos junto de Deus, num lugar sem dor, sem violência, sem tristeza. Só Deus nos bastará.\n\nE no final dos tempos, após o juízo final, quando Deus inaugurar os “novos céus” e a “nova terra” (2Pd 3,13), onde Deus será tudo em todos, os nossos corpos mortais readquirirão a vida. O nosso estado definitivo não será apenas a alma espiritual separada do corpo. Como Cristo ressurgiu verdadeiramente dos mortos e vive para sempre, assim também ressuscitará a todos no último dia, com um corpo incorruptível.\n\nO catequista, se oportuno, poderá deixar claro que a fé da Igreja é na ressurreição e NÃO na encarnação.\n\n**Conclusão:** O catequista poderá perguntar aos catequizandos sobre o que eles entenderam sobre o que é a vida eterna. Depois encerrar dizendo que nossa vida neste mundo é passageira, somos apenas peregrinos e que nosso lugar é estar junto de Deus. Como gesto concreto, no decorrer da semana rezar a Deus, pedindo que Ele nos perdoe de todos os pecados e um dia nos conduza junto dele. Poderá ser pedido, ainda, que os catequizandos lembrem e rezem durante a semana, para membros de sua família e amigos que já faleceram e já estão junto de Deus.\n\n**Oração final:** O catequista convida a todos a se colocarem ao redor da Mesa da Palavra onde estimula os catequizandos a formularem preces e orações principalmente por aquelas pessoas que não acreditam em Deus, na salvação de Jesus e para que Deus tenha misericórdia e compaixão de todo o mundo. Conclui com o Pai-nosso e com a oração:\n\n\"Deus de Misericórdia, que enviaste seu Filho ao mundo para a remissão dos pecados, olhe com ternura a cada um de nós, e nos conduza um dia à morada celeste, onde viveremos eternamente gozando de sua Luz. Por Cristo Nosso Senhor. Amém.\"\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n\"...N... você é um cidadão do céu, vai em paz, e que o Senhor te acompanhe!\"", "prep": "** Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Fotos ou imagens de uma lagarta, casulo e de uma borboleta."}, {"id": "e29", "num": 29, "kind": "encontro", "title": "A Profissão de Fé", "when": "Tempo comum", "biblia": "At 2,22-24.32-33.36", "body": "**Palavra inicial:** No encontro de hoje, onde encerramos toda uma reflexão sobre a fé que professamos, queremos não mais ver apenas partes, mas olhar para todo o conjunto da oração. Queremos ver o que os catequizandos assimilaram sobre tudo o que foi falado no decorrer do ano.\n\n**Preparar o ambiente:** Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Cartaz contendo os 12 artigos da Profissão de Fé.\n\n**Acolhida:** O catequista acolhe carinhosamente os catequizandos com a frase: \"Professai a cada dia a fé... N..., seja bem-vindo!\", e os conduz para a sala de encontro.\n\n**Recordação da vida:** Ao redor da Mesa da Partilha ou da Mesa da Palavra o catequista motiva os catequizandos a fazer um momento de recordação da vida, onde lembrarão fatos e acontecimentos que marcaram a vida de cada um, de suas famílias, comunidade e da sociedade.\n\nNA MESA DA PALAVRA\n\n**Oração inicial:** Após o momento de recordação da vida, o catequista inicia um momento de oração pedindo o Espírito Santo sobre todos os catequizandos e sobre toda a Igreja.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\n**Leitura do texto bíblico:** At 2,22-24.32-33.36.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"Israelitas, escutai estas palavras [...] Todos de Israel saibam, portanto, com a maior certeza, que este Jesus, por vós crucificado, Deus o constituiu Senhor e Cristo.\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista incentiva os catequizandos a reconstruírem o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrir suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nO catequista poderá perguntar aos catequizandos o que é professar a fé e como eles podem fazer isso no dia a dia. Deixar os catequizandos falarem.\n\nDepois mostra-lhes o cartaz com os doze artigos do Credo e pede para que leiam todos juntos artigo por artigo e, à medida que forem lendo, o catequista os estimula a recapitularem tudo o que aprenderam ao longo do ano, o que lembram e sabem sobre cada artigo. No final, o catequista poderá pedir para que os catequizandos resumam numa frase o que é crer e o que é a fé no Cristo. Essas frases poderão ser reunidas em uma cartolina e afixada na Mesa da Palavra.\n\n[Nota lateral cortada/ilegível na imagem: aparecem fragmentos como \"Fazer...\", \"deixar...\", \"cantar...\", \"Concl...\", \"um ge...\", \"um co...\", \"necess...\", \"Explica...\", \"através...\", \"Oração...\", \"os cate...\", \"e estão...\", \"De...\", \"vive...\", \"e c...\", \"No fina...\", \"da cru...\" e \"...\".]\n\n****\n\nFazer esse momento de recordação de todo conteúdo refletido no decorrer do ano com muita calma, deixando realmente os catequizandos participarem. Depois poderá ser rezado o Credo todo e ao final cantar um canto.\n\n**Conclusão:** O catequista convida a cada catequizando a ficar alguns minutos em silêncio e formular um gesto concreto, uma atitude para que possa, como os discípulos, anunciar e testemunhar a fé. É um compromisso pessoal e cada um deverá formular e assumir o seu pelo tempo que cada um achar necessário.\n\nExplicar que no próximo encontro será preparada a celebração onde todos eles irão \"professar a fé\", através da recitação do Credo, diante de toda a comunidade. Explicar a importância desse ato.\n\n**Oração final:** O catequista convida a todos a se colocarem ao redor da Mesa da Palavra onde estimula os catequizandos a formularem preces e orações principalmente por todos que estão abraçando a fé e estão espalhados pelo mundo. Conclui com o Pai-nosso e com a oração:\n\n\"Deus Pai criador, que conhece o coração de cada um de nós, ajudai-nos a testemunhar a fé e a vivê-la a cada dia. Que nosso testemunho e exemplo seja sinal para esse mundo sem esperança e cheio de guerra. Por Cristo Nosso Senhor. Amém\"\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n“...N... professai a fé com a vida, vai em paz, e que o Senhor te acompanhe!”\n\n****", "prep": "** Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Cartaz contendo os 12 artigos da Profissão de Fé."}, {"id": "e30", "num": 30, "kind": "encontro", "title": "Preparando a celebração da Recitação da Profissão de Fé", "when": "Tempo comum", "biblia": "Mt 25,31-40", "body": "**Palavra inicial:** Caríssimo catequista, estamos encerrando a segunda etapa da catequese. Nesse encontro queremos preparar os catequizandos para a celebração de Recitação da Profissão de Fé. Seria importante já ter lido o roteiro celebrativo e ter em mente todo o desenrolar da celebração.\n\n**Preparando o ambiente:** Ambão com toalha verde, Bíblia, vela e flores. Na Mesa da Partilha, folha com a “Profissão de Fé” que os catequizandos receberam no início da segunda etapa.\n\n**Acolhida:** O catequista acolhe os catequizandos traçando-lhes o sinal da cruz em sua fronte e dizendo: “...N..., Jesus hoje te pergunta: Você crê em mim? Seja bom discípulo e testemunha de Cristo!”\n\n**Recordação da vida:** Quando todos estiverem ao redor da Mesa da Partilha ou da Mesa da Palavra, o catequista os incentiva a trazer presente fatos e acontecimentos que marcaram a semana.\n\nNA MESA DA PALAVRA\n\n**Oração inicial:** O catequista invoca o Espírito Santo com uma oração ou canto à escolha. Logo convida a todos a aclamarem o Evangelho e em seguida dirige-se à Mesa da Palavra e proclama o texto indicado.\n\n**Leitura do texto bíblico:** Mt 25,31-40.\n\nO próprio catequista lê o texto indicado e em seguida lê novamente, desta vez pausadamente, destacando alguns pontos do texto:\n\n“[...] Tomai posse do Reino preparado para vós desde a criação do mundo. [...] todas as vezes que vocês fizestes isso a um desses meus irmãos menores, a mim o fizestes”.\n\nApós a leitura todos dirigem-se para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir o texto junto aos catequizandos dizendo que professar a fé é reconhecer Cristo como Rei do Universo e colocar em prática os seus mandamentos, principalmente com os mais pobres e pequeninos deste mundo.\n\nO catequista deverá também explicar um pouco a liturgia da Solenidade de Nosso Senhor Jesus Cristo, Rei do Universo, se a celebração acontecer neste dia. Por motivos pastorais a celebração pode ocorrer num outro dia.\n\nExplicar passo a passo aos catequizandos a celebração de Recitação da Profissão de Fé, bem como sua importância e seu significado.\n\nNa celebração de Recitação da Profissão de Fé vamos ser convidados a dar o nosso sim, mais uma vez, a Jesus, testemunhando e professando a nossa fé perante a comunidade, mostrando o caminho de amadurecimento na fé que temos percorrido.\n\nPoderá também fazer um rápido ensaio: procissão de entrada, onde vão sentar, o que vão responder, mostrar a folha com o Credo que já receberam e o qual agora professarão publicamente.\n\n****\n\nAinda poderá realizar ou marcar um ensaio para os cantos.\n\nLembrar que o encontro da próxima semana é uma reunião com os pais e padrinhos de Batismo. Nesta reunião deverá ser refletido sobre a importância e significado da celebração. Explicar passo a passo o desenrolar dos ritos e distribuir algumas funções como veremos nas orientações do próximo encontro (a reunião com os pais e padrinhos poderá ser agendada em dia e horário que facilite a participação de todos, principalmente dos que trabalham e moram longe).\n\n**Conclusão:** No decorrer da semana lembrar os pais e padrinhos de Batismo da reunião da próxima semana, comparecer aos ensaios e convidar os amigos e parentes para participarem da celebração.\n\n**Oração final:** Ao redor da Mesa da Palavra de mãos dadas rezar o Pai-nosso. O catequista conclui com a oração:\n\n\"Deus, Pai de bondade, concedei-nos a graça de testemunhar e professar a fé até o final de nossos dias. Que saibamos reconhecê-lo nos pobres e pequenos. Por Cristo Nosso Senhor. Amém.\"\n\nNo final da oração o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n\"...N... testemunhe o Cristo, vai em paz, e que o Senhor te acompanhe! Amém.\"\n\n****", "prep": "** Ambão com toalha verde, Bíblia, vela e flores. Na Mesa da Partilha, folha com a “Profissão de Fé” que os catequizandos receberam no início da segunda etapa."}, {"id": "e31", "num": 31, "kind": "encontro", "title": "Preparando a celebração — com os pais e padrinhos de Batismo", "when": "Tempo comum", "biblia": "", "body": "Preparando a celebração de “Recitação da Profissão de Fé”\n\nCom os pais e padrinhos de Batismo\n\n*(Encontro a ser realizado na semana que antecede a celebração de Recitação da Profissão de Fé)*\n\n**Palavra inicial:** Prezados catequistas, nesta reunião queremos apresentar aos pais e padrinhos de Batismo uma visão geral de como será a celebração de Recitação da Profissão de Fé. Primeiramente uma reflexão sobre a importância e significado, e depois o desenrolar dos ritos.\n\n**Preparando o ambiente:** O espaço para a reunião poderá ser outra sala, mais ampla para acomodar todos os participantes. Nesta sala providenciar: ambão com toalha verde, Bíblia, vela e flores. Folhas com o roteiro da celebração.\n\n**Acolhida:** O catequista acolhe os pais e padrinhos, dando-lhes boas-vindas e explicando o motivo da reunião. Logo após convida a todos a ficarem de pé e fazerem uma breve oração (se o tempo permitir poderá ser feita a “leitura orante” de um texto bíblico que poderá ser o mesmo usado na preparação dos catequizandos, do encontro 30).\n\n**Oração inicial:** Pode-se invocar o Espírito Santo com a oração “Vinde, Espírito Santo, enchei...”, e fazer a leitura de um texto bíblico.\n\n**Orientações para a reunião:**\n\n* Primeiramente agradecer a presença dos pais e padrinhos e pedir para que se apresentem e digam se são pais ou padrinhos.\n* Introduzir com uma breve explicação sobre o Tempo Litúrgico, principalmente o significado da solenidade de “Cristo Rei” (se a celebração acontecer nessa data).\n* O catequista faz uma breve reflexão sobre a importância e significado da celebração.\n* Depois distribui o roteiro da celebração e explica passo a passo todo o desenrolar dos ritos.\n* Orientá-los da importância de se rezar em família e de incentivar a leitura bíblica com os filhos.\n* Poderá distribuir algumas funções como leitores dos textos bíblicos, oração da assembleia, apresentação das oferendas.\n* Orientar para que as fotos e filmagens sejam discretas e não atrapalhem a participação da assembleia.\n* Hora e local, chegar com antecedência.\n\n**Oração final:** O catequista convida a todos a rezar o Pai-nosso e logo depois de braços abertos conclui com a oração:\n\n\"Deus Pai criador, fazei que estes pais e padrinhos possam ajudar seus filhos e afilhados a professarem a fé a cada dia no Cristo e na Igreja, através do seu exemplo e testemunho. Que eles sejam amparados com sua força e iluminados por teu Espírito na orientação daqueles que lhes foram confiados. Por Cristo Nosso Senhor. Amém.\"\n\n\"Ide em paz, e que o Senhor vos acompanhe!\"\n\n****", "prep": "** O espaço para a reunião poderá ser outra sala, mais ampla para acomodar todos os participantes. Nesta sala providenciar: ambão com toalha verde, Bíblia, vela e flores. Folhas com o roteiro da celebração."}, {"id": "cf", "num": null, "kind": "celebracao", "title": "Celebração de Recitação da Profissão de Fé", "when": "Solenidade de Cristo Rei (fim do Ano Litúrgico)", "biblia": "", "body": "### Celebração de Recitação da Profissão de Fé\n\n*(Aconselhamos que essa celebração aconteça na Solenidade de Nosso Senhor Jesus Cristo, Rei do Universo. Porém, por motivos pastorais, pode ocorrer num outro dia)*\n\n**Palavra inicial:** Esta celebração tem o objetivo de apresentar a toda a comunidade os catequizandos que concluíram a segunda etapa da catequese, chamando a atenção para a grandeza de importância desse processo para a vida da Igreja, bem como assistir os catequizandos que recitarão publicamente a \"Profissão de Fé\".\n\n**Preparando o ambiente:** Livro dos catequizandos onde foi registrado os nomes dos catequizandos ao final da primeira etapa. Reservar bancos para os catequizandos e padrinhos.\n\n**Procissão inicial:** Os catequizandos e padrinhos de batismo participam da procissão inicial. Pode-se levar ainda a imagem de Cristo Rei, livro grande com os nomes dos catequizandos.\n\n**Saudação inicial:** O presidente acolhe os catequizandos, familiares e padrinhos.\n\n*(tudo segue como de costume, até depois da homilia)*\n\n### Rita do \"Éfeta\" e Recitação do Símbolo³\n\n*(Após a proclamação do Evangelho e a homilia o diácono, ou, na falta dele, o catequista, pega o livro solenemente com os nomes dos catequizandos e chama-os cada um pelo nome.)*\n\n**Diácono:** Queiram aproximar-se os que estão com os nomes inscritos no livro dos catequizandos e que Recitarão o Símbolo: ...N..., ...N... *(lê-se do livro os nomes – se forem muitos pode-se omitir a leitura dos nomes)*\n\n**Cada um responde individualmente:** Presente! *(ou todos juntos se forem muitos)*\n\n**Presidente:** Queridos catequizandos, queiram aproximar-se para recitar as palavras de fé que lhes foram entregues e vocês desejam guardar com pureza de coração. Elas são o símbolo, isto é, um resumo de nossa fé. São poucas, mas contêm grandes mistérios.\n\n*(Quem preside convida à oração, dizendo:)*\n\n**Presidente:** Oremos, irmãos e irmãs, para que Deus conserve e faça crescer sempre a fé que foi semeada no coração destes eleitos.\n\n*(Depois de um tempo de silêncio, prossegue:)*\n\n**Presidente:** Concedei, Senhor, que estes catequizandos, tendo acolhido o vosso plano de amor e os mistérios da vida de vosso Cristo, possam sempre proclamá-lo com palavras e vivê-los pela fé, cumprindo em ações a vossa vontade. Por Cristo, Nosso Senhor.\n\n**Todos:** Amém.\n\n*(A seguir, quem preside prossegue com o rito do \"Éfeta\". Os catequizandos aproximam-se do presidente de cada vez e este, tocando com o polegar os ouvidos e os lábios de cada eleito, diz:)*\n\n**Presidente:** Éfeta, isto é, abre-te, a fim de proclamares o que ouviste, para louvor e glória de Deus.\n\nSe os catequizandos forem muitos, dir-se-á a fórmula inteira só para o primeiro; para os outros, apenas: Éfeta, isto é, abre-te. Ao final todos os catequizandos recitam o Símbolo e a missa prossegue com a \"Oração da Assembleia\".\n\n**Preces:** Na \"Oração da Assembleia\" podem-se acrescentar algumas das orações:\n\n* Para que esses catequizandos recebam o dom da fé, pela qual proclamem que Cristo é a ressurreição e a vida, roguemos ao Senhor.\n\n³ Adaptado do Ritual da Iniciação Cristã de Adultos – RICA.\n\n****\n\n* Para que, na esperança do Espírito vivificante, se disponham corajosamente a renovar sua vida, roguemos ao Senhor.\n* Para que a família desses catequizandos e seus padrinhos coloquem sua esperança em Cristo e nele encontrem paz e santidade, roguemos ao Senhor.\n* Para que toda nossa comunidade saiba acolher com alegria esses catequizandos e ajudá-los a viver a fé, roguemos ao Senhor.\n* Para que todos nós, vivendo uma nova vida, manifestemos ao mundo o poder da ressurreição de Cristo, roguemos ao Senhor.\n* Para que as famílias e os povos impedidos de abraçar a fé tenham a liberdade de crer no Evangelho, roguemos ao Senhor.\n\nA celebração prossegue como de costume até o seu final.\n\n(Nota: lista com marcadores; cada pedido de oração em item próprio.)\n\n****\n\n### II Parte", "prep": "** Livro dos catequizandos onde foi registrado os nomes dos catequizandos ao final da primeira etapa. Reservar bancos para os catequizandos e padrinhos."}];
const LS_USER='pc_user', LS_STATE='pc_state_', LS_SESSOES='pc_sessoes';
let user=null, state={}, view={screen:'list', id:null, q:'', filtro:'todos'};

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function loadState(){try{state=JSON.parse(localStorage.getItem(LS_STATE+user)||'{}')}catch(e){state={}}}
function saveState(){localStorage.setItem(LS_STATE+user,JSON.stringify(state));}
function st(id){if(!state[id])state[id]={status:'a_planejar',data:'',notas:'',check:{},links:[]};return state[id];}
function sessoes(){try{return JSON.parse(localStorage.getItem(LS_SESSOES)||'[]')}catch(e){return[]}}
function addSessao(u){const s=sessoes();if(!s.includes(u)){s.push(u);localStorage.setItem(LS_SESSOES,JSON.stringify(s));}}
function delSessao(i,ev){ev.stopPropagation();const s=sessoes();const u=s[i];s.splice(i,1);localStorage.setItem(LS_SESSOES,JSON.stringify(s));if(localStorage.getItem(LS_USER)===u)localStorage.removeItem(LS_USER);render();}

const CHECK_BASE=['Toalha da cor do Tempo Litúrgico no ambão','Vela acesa','Bíblia na Mesa da Palavra','Leitor escalado e passagem combinada','Flores / ornamento (escala da semana)','Materiais da dinâmica separados','História do encontro revisada','Imagem de Nossa Senhora / padroeiro (quem leva?)'];

function render(){
  const app=$('#app');
  if(!user){app.innerHTML=loginHTML();return;}
  if(view.screen==='detail'){app.innerHTML=detailHTML();window.scrollTo(0,0);return;}
  app.innerHTML=listHTML();
  const q=$('#q'),f=$('#filtro');
  if(q){q.value=view.q;q.oninput=e=>{view.q=e.target.value;renderListItems();};}
  if(f){f.value=view.filtro;f.onchange=e=>{view.filtro=e.target.value;renderListItems();};}
  renderListItems();
}

    <div class="field"><label>${ss.length?'Nova sessão — seu nome (catequista)':'Seu nome (catequista)'}</label><input id="nome" placeholder="Ex.: Maria" autofocus></div>
    <div class="field"><label>Comunidade / turma (opcional)</label><input id="com" placeholder="Ex.: Turma B — sábado 9h"></div>
    <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
    <p style="font-size:.75rem;color:var(--mut);margin-top:12px">Cada sessão tem seu próprio planejamento, salvo neste aparelho. Toque numa sessão salva para entrar nela.</p>
  </div></div>`;
}
function entrar(){
  const n=$('#nome').value.trim();
  if(!n){toast('Digite seu nome para entrar');return;}
  user=n+'|'+($('#com').value.trim()||'—');
  addSessao(user);
  localStorage.setItem(LS_USER,user);loadState();render();
}
function entrarSessao(i){
  user=sessoes()[i];
  localStorage.setItem(LS_USER,user);loadState();render();
}
function sair(){localStorage.removeItem(LS_USER);user=null;render();}

function listHTML(){
  const ids=DATA.map(d=>d.id);
  const planejados=ids.filter(i=>st(i).status==='planejado').length;
  const realizados=ids.filter(i=>st(i).status==='realizado').length;
  const total=DATA.length;
  const pct=Math.round((planejados+realizados)/total*100);
  const [,com]=user.split('|');
  return `<header class="app"><div class="bar">
    <h1>📖 Planejador — Catequese 2ª Etapa</h1>
    <div class="user"><span>${esc(user.split('|')[0])} · ${esc(com)}</span>
      <button class="btn mini" style="background:rgba(255,255,255,.15)" onclick="sair()">Sair</button></div>
  </div></header>
  <main>
    <div class="card">
      <b>Progresso do ano catequético</b>
      <div class="progress"><div class="pbar"><div style="width:${pct}%"></div></div><span style="font-size:.85rem;color:var(--mut)">${planejados+realizados}/${total}</span></div>
      <div style="display:flex;gap:14px;margin-top:8px;font-size:.8rem;color:var(--mut)">
        <span>🟣 A planejar: ${total-planejados-realizados}</span><span>🔵 Planejados: ${planejados}</span><span>🟢 Realizados: ${realizados}</span>
      </div>
      <div class="actions">
        <button class="btn sec mini" onclick="exportar()">⬇️ Exportar backup</button>
        <button class="btn sec mini" onclick="$('#imp').click()">⬆️ Importar backup</button>
        <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(this)">
      </div>
    </div>
    <div class="search">
      <input id="q" placeholder="🔍 Buscar tema, artigo do Credo, leitura…">
      <select id="filtro">
        <option value="todos">Todos</option>
        <option value="a_planejar">A planejar</option>
        <option value="planejado">Planejados</option>
        <option value="realizado">Realizados</option>
        <option value="celebracao">Celebrações</option>
      </select>
    </div>
    <div id="lista"></div>
  </main>`;
}
function renderListItems(){
  const q=view.q.toLowerCase(), f=view.filtro;
  const list=DATA.filter(d=>{
    if(f==='celebracao'){if(d.kind!=='celebracao')return false;}
    else if(f!=='todos'&&st(d.id).status!==f)return false;
    if(q&&!(d.title+' '+(d.biblia||'')+' '+d.body).toLowerCase().includes(q))return false;
    return true;
  });
  $('#lista').innerHTML=list.length?list.map(d=>{
    const s=st(d.id);
    const badge=s.status==='planejado'?'<span class="badge p">Planejado</span>':s.status==='realizado'?'<span class="badge r">Realizado</span>':'';
    const num=d.num?`<div class="num">${d.num}º</div>`:`<div class="num">✨</div>`;
    return `<div class="item ${d.kind==='celebracao'?'festa':''} ${s.status==='realizado'?'done':''}" onclick="abrir('${d.id}')">
      ${num}<div style="flex:1"><h3>${esc(d.title)} ${badge}</h3>
      <div class="sub">${esc(d.when||'')}${d.biblia?' · 📖 '+esc(d.biblia):''}</div>
      ${s.data?`<div class="sub">📅 marcado para ${esc(s.data)}</div>`:''}</div></div>`;
  }).join(''):'<div class="empty">Nenhum encontro encontrado com esse filtro.</div>';
}
function abrir(id){view.screen='detail';view.id=id;render();}
function voltar(){view.screen='list';render();}

function detailHTML(){
  const d=DATA.find(x=>x.id===view.id);const s=st(d.id);
  const checks=[...CHECK_BASE];
  const bodyHTML=fmtBody(d.body);
  return `<header class="app"><div class="bar">
    <button class="back" onclick="voltar()">← Voltar</button>
    <h1>${d.num?d.num+'º Encontro':'Celebração'}</h1></div></header>
  <main class="roteiro">
    <div class="card">
      <h2>${esc(d.title)}</h2>
      <div class="when">${esc(d.when||'')}${d.biblia?' · Leitura bíblica: <b>'+esc(d.biblia)+'</b>':''}</div>
      <div class="field"><label>Status</label>
        <div class="status-pills">
          <button class="pill ${s.status==='a_planejar'?'on':''}" onclick="setStatus('${d.id}','a_planejar')">A planejar</button>
          <button class="pill ${s.status==='planejado'?'on':''}" onclick="setStatus('${d.id}','planejado')">Planejado</button>
          <button class="pill r ${s.status==='realizado'?'on':''}" onclick="setStatus('${d.id}','realizado')">Realizado ✓</button>
        </div></div>
      <div class="row">
        <div class="field"><label>Data planejada</label><input type="date" value="${esc(s.data)}" onchange="setF('${d.id}','data',this.value)"></div>
      </div>
      <div class="field"><label>Anotações do catequista (adaptações, quem leva o quê…)</label>
        <textarea placeholder="Ex.: João fará a leitura; levar cartolina…" oninput="setF('${d.id}','notas',this.value)">${esc(s.notas)}</textarea></div>
    </div>
    <div class="card">
      <b>✅ Checklist de preparação</b>
      <div style="margin-top:6px">${checks.map((c,i)=>`<div class="check"><input type="checkbox" id="ck${i}" ${s.check[i]?'checked':''} onchange="setCk('${d.id}',${i},this.checked)"><label for="ck${i}" class="${s.check[i]?'done':''}">${esc(c)}</label></div>`).join('')}</div>
    </div>
    ${d.prep?`<div class="card"><b>🕯️ Preparando o ambiente (subsídio)</b><p style="margin-top:6px;font-size:.92rem">${esc(d.prep)}</p></div>`:''}
    <div class="card">
      <b>🔗 Links do encontro</b>
      <div id="links" style="margin-top:6px">${linksHTML(d.id)}</div>
      <div class="row" style="margin-top:10px;align-items:flex-end">
        <div class="field" style="flex:2"><label>Endereço (URL)</label><input id="lk-url" placeholder="https://…"></div>
        <div class="field" style="flex:1"><label>Tipo</label>
          <select id="lk-tipo">
            <option value="musica">🎵 Música</option>
            <option value="video">🎬 Vídeo</option>
            <option value="atividade">✂️ Atividade</option>
            <option value="outro">📄 Outro</option>
          </select></div>
        <div class="field" style="flex:0"><button class="btn" onclick="addLink('${d.id}')">+ Adicionar</button></div>
      </div>
    </div>
    <div class="card"><b>📜 Roteiro completo do subsídio</b><div class="roteiro" style="margin-top:6px">${bodyHTML}</div></div>
  </main>`;
}
function fmtBody(t){
  return t.split(/\n\n+/).map(p=>{
    p=p.trim();if(!p)return '';
    p=esc(p)
      .replace(/^Palavra inicial:/,'<span class="sec-t">Palavra inicial</span>')
      .replace(/^Preparando o ambiente:/,'<span class="sec-t">Preparando o ambiente</span>')
      .replace(/^Preparar o ambiente:/,'<span class="sec-t">Preparando o ambiente</span>')
      .replace(/^Acolhida:/,'<span class="sec-t">Acolhida</span>')
      .replace(/^Recordação da vida:/,'<span class="sec-t">Recordação da vida</span>')
      .replace(/^Na Mesa da Palavra:?/,'<span class="sec-t">Na Mesa da Palavra</span>')
      .replace(/^NA MESA DA PALAVRA:?/,'<span class="sec-t">Na Mesa da Palavra</span>')
      .replace(/^Oração inicial:/,'<span class="sec-t">Oração inicial</span>')
      .replace(/^Leitura (do texto bíblico|texto bíblico|bíblica):?/,'<span class="sec-t">Leitura bíblica</span>')
      .replace(/^Na Mesa da Partilha:?/,'<span class="sec-t">Na Mesa da Partilha</span>')
      .replace(/^NA MESA DA PARTILHA:?/,'<span class="sec-t">Na Mesa da Partilha</span>')
      .replace(/^Dinâmica:/,'<span class="sec-t">Dinâmica</span>')
      .replace(/^Conclusão:/,'<span class="sec-t">Conclusão</span>')
      .replace(/^Oração final:/,'<span class="sec-t">Oração final</span>')
      .replace(/^Material de [Aa]poio:?/,'<span class="sec-t">Material de apoio</span>')
      .replace(/^Lembretes:?/,'<span class="sec-t">Lembretes</span>')
      .replace(/^Observação:?/,'<span class="sec-t">Observação</span>')
      .replace(/^Dica:?/,'<span class="sec-t">Dica</span>')
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    return '<p>'+p+'</p>';
  }).join('');
}
function setStatus(id,v){st(id).status=v;saveState();toast(v==='realizado'?'Marcado como realizado ✓':v==='planejado'?'Marcado como planejado':'Voltou para “a planejar”');render();}
const TIPO_L={musica:'🎵 Música',video:'🎬 Vídeo',atividade:'✂️ Atividade',outro:'📄 Outro'};
function linksHTML(id){
  const lks=st(id).links||[];
  if(!lks.length)return '<p style="font-size:.85rem;color:var(--mut)">Nenhum link ainda. Adicione músicas, vídeos ou atividades abaixo.</p>';
  return lks.map((l,i)=>`<div class="lk"><span class="lk-b t-${l.tipo}">${TIPO_L[l.tipo]||TIPO_L.outro}</span><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><button class="del" title="Remover" onclick="delLink('${id}',${i})">✕</button></div>`).join('');
}
function addLink(id){
  const url=$('#lk-url').value.trim(),tipo=$('#lk-tipo').value;
  if(!url){toast('Cole o endereço do link');return;}
  let u=url;if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){toast('Endereço inválido');return;}
  st(id).links=st(id).links||[];st(id).links.push({url:u,tipo});saveState();render();
}
function delLink(id,i){st(id).links.splice(i,1);saveState();render();}
function setF(id,k,v){st(id)[k]=v;saveState();}
function setCk(id,i,v){st(id).check[i]=v;saveState();render();}
function exportar(){
  const blob=new Blob([JSON.stringify({user,exportado_em:new Date().toISOString(),state},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='planejamento-catequese-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup exportado');
}
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.state)throw 0;state=j.state;saveState();render();toast('Backup importado ✓');}catch(e){toast('Arquivo inválido');}};
  r.readAsText(f);
}
(function init(){
  const u=localStorage.getItem(LS_USER);
  if(u){user=u;loadState();}
  render();
})();
</script>
</body>
</html>
