<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Planejador de Encontros — Catequese 2ª Etapa</title>
<style>
:root{--roxo:#7c3aed;--roxo-esc:#5b21b6;--bg:#f6f4fb;--card:#fff;--txt:#1f2937;--mut:#6b7280;--verde:#059669;--ambar:#d97706;--borda:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
header.app{background:linear-gradient(135deg,var(--roxo),var(--roxo-esc));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.app .bar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.app h1{font-size:1.05rem;font-weight:700;flex:1;min-width:180px}
header.app .user{font-size:.8rem;opacity:.9;display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{background:var(--roxo);color:#fff;padding:9px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--roxo);border:1.5px solid var(--roxo)}
.btn.mini{padding:5px 10px;font-size:.8rem;border-radius:8px}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.progress{display:flex;gap:8px;align-items:center;margin-top:8px}
.pbar{flex:1;height:10px;background:#e9e5f6;border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.search{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:140px;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--borda);border-left:5px solid var(--roxo);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .1s}
.item:active{transform:scale(.99)}
.item.festa{border-left-color:var(--ambar)}
.item.done{border-left-color:var(--verde);opacity:.85}
.item.sessao{cursor:pointer;border-left-color:var(--roxo)}
.item.sessao .del{background:none;color:var(--mut);font-size:.9rem;padding:2px 6px}
.item .num{min-width:42px;height:42px;border-radius:50%;background:#ede9fe;color:var(--roxo-esc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.item.festa .num{background:#fef3c7;color:var(--ambar)}
.item.done .num{background:#d1fae5;color:var(--verde)}
.item h3{font-size:.95rem}
.item .sub{font-size:.8rem;color:var(--mut)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.p{background:#dbeafe;color:#1d4ed8}.badge.r{background:#d1fae5;color:var(--verde)}
.tag{display:inline-block;font-size:.72rem;background:#ede9fe;color:var(--roxo-esc);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
.roteiro h2{font-size:1.15rem;margin-bottom:2px}
.roteiro .when{color:var(--mut);font-size:.85rem;margin-bottom:12px}
.roteiro p{margin:10px 0;text-align:justify}
.roteiro .sec-t{font-weight:700;color:var(--roxo-esc);margin-top:18px;display:block}
.roteiro em{color:#374151}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--borda)}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--verde)}
.check label.done{text-decoration:line-through;color:var(--mut)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.status-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:99px;border:1.5px solid var(--borda);background:#fff;font-size:.85rem;font-weight:600}
.pill.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.pill.on.r{background:var(--verde);border-color:var(--verde)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.back{color:#fff;background:rgba(255,255,255,.15);padding:7px 12px;font-size:.85rem}
.login-wrap{max-width:420px;margin:10vh auto;padding:0 16px}
.login-wrap .card{text-align:center;padding:28px 22px}
.logo{font-size:2.6rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.lk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--borda)}
.lk:last-child{border-bottom:none}
.lk a{color:var(--roxo);word-break:break-all;font-size:.88rem;flex:1;text-decoration:none}
.lk a:hover{text-decoration:underline}
.lk-b{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-musica{background:#ede9fe;color:var(--roxo-esc)}
.t-video{background:#dbeafe;color:#1d4ed8}
.t-atividade{background:#d1fae5;color:var(--verde)}
.t-outro{background:#f3f4f6;color:var(--mut)}
.lk .del{background:none;color:var(--mut);font-size:.9rem;padding:2px 6px}
@media(min-width:700px){.item h3{font-size:1rem}}
</style>
</head>

<script>
const DATA = [{"id": "c0", "num": null, "kind": "celebracao", "title": "Celebração de Apresentação e Envio dos Catequistas", "when": "1º Domingo do Advento", "biblia": "", "body": "### Celebração de Apresentação e Envio dos Catequistas\n\nPalavra inicial: O objetivo da celebração é apresentar a toda a comunidade os catequistas que exercerão o ministério da catequese, destacando a grande importância desse serviço para a vida da Igreja. Aconselhamos que essa celebração aconteça no 1º Domingo do Advento seguindo a liturgia do dia. Por motivos pastorais pode ocorrer num outro dia da semana.\n\nPreparando o ambiente: Cartaz ou banner com o Calendário Litúrgico que poderá entrar na procissão inicial e ser colocado em lugar de destaque. Bíblia para ser entregue uma para cada catequista, em sinal da missão por eles assumida como anunciadores do Reino. Reservar bancos para os catequistas. Acrescente-se na monição inicial a apresentação e envio dos catequistas.\n\nProcissão inicial: Os catequistas participam da procissão inicial.\n\nSaudação inicial: O presidente acolhe os catequistas. (Tudo segue como de costume, até a homilia).\n\nRito de apresentação e envio dos catequistas\n\nApós a proclamação do Evangelho e a homilia, o diácono, ou na falta dele o coordenador da catequese, chama cada um dos catequistas pelo nome.\n\nDiácono: Queiram aproximar-se os que exercerão o ministério da catequese: ...N..., ...N..., ...\n\nCada um responde individualmente: *Presente!* (ou todos juntos, se forem muitos).\n\nOs catequistas proferem seu compromisso catequético e recebem o Livro Sagrado, a Bíblia, sinal do seu ministério. Todos os catequistas de pé e a uma só voz fazem seu compromisso:\n\n\"Nós, catequistas, viemos, perante esta assembleia congregada pelo Senhor, manifestar o desejo de participarmos do ministério da catequese. O Senhor que nos chamou a formar parte do seu povo, pelo Batismo, convida-nos a sermos testemunhas, mestres e educadores da fé. Ao assumirmos este serviço, estamos conscientes de participarmos da grande missão que Jesus Cristo confiou à sua Igreja: 'Ide por todo o mundo e anunciai a todos a mensagem da salvação'.\"\n\nPresidente: Caros catequistas, quereis viver o vosso ministério de catequistas na fidelidade a Deus e na atenção aos irmãos?\n\nCatequistas: Sim, queremos.\n\nPresidente: Estais dispostos a desempenhar a vossa missão, sendo testemunhas da Boa-Nova de Jesus?\n\nCatequistas: Sim, estamos.\n\nPresidente: Quereis viver o vosso serviço de catequistas, em espírito de serviço à comunidade?\n\nCatequistas: Sim, queremos.\n\n*(Impõe as mãos).*\n\nPresidente: \"Dignai-vos, Senhor, confirmar em seu propósito, com a vossa bênção † paterna,\n\n### Celebração de Apresentação e Envio dos Catequistas (Continuação)\n\nestes vossos filhos e filhas que anseiam por entregar-se ao trabalho da catequese, para que se esforcem por instruir os seus irmãos em tudo que aprenderem com a meditação da vossa Palavra de acordo com a doutrina da Igreja\"¹.\n\nR. Amém.\n\nLogo após se aproximam, um de cada vez, ou, se forem muitos, fazem uma fila um do lado do outro, e o presidente entrega a Palavra de Deus a cada um, dizendo:\n\nPresidente: ...N..., recebe o Livro Sagrado, instrumento e sinal de seu ministério, exerça-o com solicitude, transmitindo com fidelidade a sua Palavra, para que ela frutifique cada vez mais no coração das pessoas.\n\nCatequista: Amém.\n\n*(se forem muitos, o padre diz a fórmula somente uma vez, e depois prossegue com a entrega da Bíblia, enquanto se entoa um canto. Todos retornam aos seus lugares e a missa prossegue como de costume).*\n\nPreces: No momento da Oração da Assembleia, pode-se acrescentar algumas das orações pelos catequistas e catequizandos. Se for oportuno, após a oração Pós-Comunhão, apresentam-se os catequizandos que ingressarão na catequese. No final o padre dá a bênção de envio aos catequistas.\n\nOremos:\n\nDeus de infinita sabedoria, que chamastes o Apóstolo Paulo para anunciar às nações o vosso Filho, nós vos imploramos em favor de vossos servos e servas, catequistas de nossas comunidades, que vivem com dedicação e fidelidade sua vocação: concedei-lhes imitar o apóstolo dos gentios, abrindo-se a vossa graça, e considerando todas as coisas como perda comparada ao bem supremo do conhecimento de Cristo, vosso Filho, a fim de que permaneçam fiéis ao anúncio da Palavra e no testemunho da caridade. Amém.\n\nABENÇOE-VOS DEUS TODO-PODEROSO, PAI...\n\n¹ Oração extraída do livro *Presbiteral* (Petrópolis: Vozes, 2007), \"Bênçãos Referentes à Catequese e à Oração Comum\", p. 671.", "prep": "Cartaz ou banner com o Calendário Litúrgico que poderá entrar na procissão inicial e ser colocado em lugar de destaque. Bíblia para ser entregue uma para cada catequista, em sinal da missão por eles assumida como anunciadores do Reino. Reservar bancos para os catequistas. Acrescente-se na monição inicial a apresentação e envio dos catequistas."}, {"id": "c1", "num": null, "kind": "encontro", "title": "Encontro de preparação para a entrega do Símbolo — com os pais e padrinhos", "when": "Semana que antecede a entrega do Símbolo", "biblia": "", "body": "### Encontro de Preparação para a Celebração de Entrega do Símbolo – Com os Pais e Padrinhos de Batismo\n\n*(Encontro a ser realizado na semana que antecede a celebração de entrega da Profissão de Fé).*\n\nPalavra inicial: Prezados catequistas, nesta reunião queremos apresentar aos pais e padrinhos de Batismo uma visão geral de como será a celebração de entrega da Profissão de Fé. Primeiramente uma reflexão sobre a importância e significado e depois o desenrolar dos ritos.\n\nPreparando o ambiente: Prever sala mais ampla para acomodar todos os participantes. Nesta sala providenciar: ambão com toalha da cor do Tempo Litúrgico, Bíblia, vela e flores. Em uma mesa: folhas com o credo que serão entregues aos catequizandos (sugerimos colocar as duas versões do Credo, uma paralela a outra: O Credo dos apóstolos e o niceno-constantinopolitano) e cópias com o roteiro da celebração.\n\nAcolhida: O catequista acolhe os pais e padrinhos, dando-lhes boas-vindas e explicando o motivo da reunião. Logo após convida a todos a ficarem de pé e fazerem uma breve oração (se o tempo permitir poderá ser feita a \"leitura orante\" de um texto bíblico).\n\nOração inicial: Pode-se invocar o Espírito Santo com a oração \"Vinde, Espírito Santo, enchei...\", e fazer a leitura de um texto bíblico.\n\nOrientações para a reunião\n\n* Primeiramente agradecer a presença dos pais e padrinhos e pedir para que se apresentem e digam se são pais ou padrinhos;\n* Introduzir com uma breve explicação sobre o Tempo Litúrgico, principalmente o significado do Tempo do Advento (se a celebração acontecer nessa data);\n* O catequista faz uma breve reflexão sobre a importância e significado da celebração dizendo que nela os catequizandos receberão os fundamentos da fé cristã, e, a partir de cada artigo impresso no Credo, irão meditar e aprofundar a fé que a Igreja nos dá;\n* Mostrar a folha com o Credo impresso, o qual os catequizandos receberão, e mostrar que tem as duas versões mais usadas pela Igreja uma paralela a outra, e explicar que Símbolo dos Apóstolos foi uma das primeiras redações do Credo, é uma versão mais resumida. Com a necessidade, devido ao aumento das heresias, a Igreja o completou nos concílios de Niceia (325) e Constantinopla I (381), sendo assim conhecida a segunda versão como Credo niceno-constantinopolitano;\n* Poderá rapidamente trabalhar o texto de São Cirilo de Jerusalém: \"O símbolo da fé\", disponível no Material de Apoio;\n* Depois distribuir o roteiro da celebração e explicar passo a passo todo o desenrolar dos ritos;\n* Orientá-los da importância de se rezar em família e de incentivar a leitura bíblica com os filhos;\n* Poderá distribuir algumas funções: leitores dos textos bíblicos, oração da assembleia, apresentação das oferendas;\n* Orientar para que as fotos e filmagens sejam discretas e não atrapalhem a participação da assembleia;\n* Apresentar a hora e local da celebração e orientar para que procurem chegar com antecedência.\n\n### Encontro de Preparação para a Celebração de Entrega do Símbolo (Continuação)\n\nOração final: O catequista convida a todos a rezar a oração do Pai-nosso e logo depois, de braços abertos, conclui com a oração:\n\nDeus Pai de bondade, fazei que estes pais e padrinhos possam ser verdadeiros exemplos de sua Palavra aos seus filhos e afilhados. Que eles sejam um suporte no amadurecimento cristão daqueles que lhes foram confiados. Que tenham êxito na sua missão de introduzir as crianças na fé cristã através do testemunho, diálogo e vivência comunitária. Tudo isto te pedimos por Cristo Nosso Senhor. Amém.\n\nIde em paz, que o Senhor vos acompanhe!\n\n### Material de Apoio\n\nO símbolo da fé\n\n*Das catequeses de São Cirilo de Jerusalém, Bispo. Séc. IV. (Cat. 5, De fide et symboli, 12-13: PG 33,519-523).*\n\nAbraça, cuidadoso, unicamente a fé que agora a Igreja te entrega para aprendê-la e confessá-la, protegida pelos muros de toda a Escritura. Já que nem todos podem ler as Escrituras, uns por falta de preparo, outros por qualquer ocupação que os impede de conhecê-la, para que não pereçam por ignorância encerramos nos poucos versículos do símbolo todo o dogma da fé. Exorto-te a tê-lo como viático durante a vida inteira e não admitir nenhum outro mais. Nem se nós próprios, tendo mudado, dissermos algo contrário ao que ensinamos agora, nem mesmo se um anjo adverso, transfigurado em um anjo de luz, te quiser arrastar ao erro. Pois ainda que nós ou um anjo do céu vos anuncie coisa diferente do que agora recebestes, seja anátema (Gl 1,8).\n\nOuves neste momento apenas simples palavras, mas guarda na memória o símbolo da fé. Em tempo oportuno receberás a confirmação de cada versículo tirado das Sagradas Escrituras. Porque não foi a bel-prazer dos homens que este resumo da fé foi composto, mas selecionados dentre toda a Escritura, os tópicos mais importantes perfazem e abraçam a única doutrina da fé. Da forma como a semente de mostarda num pequenino grão contém muitos ramos, assim este símbolo em poucas palavras encerra como num seio materno o conhecimento de toda a religião contida no Antigo e no Novo testamentos.\n\nConsiderai, portanto, irmãos, e mantende as tradições que recebestes agora e gravai-as no fundo de vosso coração. Observai-as religiosamente, não aconteça que o inimigo em qualquer lugar venha a espoliar os covardes e negligentes, ou um herege alterar algo do que vos foi entregue. A fé é depositar no banco o dinheiro que vos confiamos. Mas Deus vos pedirá contas do depósito.\n\nPeço-vos, assim diz o Apóstolo, diante de Deus, que tudo vivifica, e de Cristo Jesus, que deu seu belo testemunho sob Pôncio Pilatos (1Tm 6,13), que conserveis imaculada esta fé entregue a vós, até que apareça nosso Senhor Jesus Cristo. Agora te foi dado o tesouro da vida. O Senhor exigirá seu depósito por ocasião de seu aparecimento, que no tempo preestabelecido o bem-aventurado e único Soberano, o Rei dos reis e Senhor dos senhores, manifestará. Ele, o único a possuir a imortalidade, que habita em luz inacessível, a quem ninguém jamais viu nem pode ver (1Tm 6,15-16). A Ele glória, honra e império pelos séculos dos séculos. Amém.", "prep": "Prever sala mais ampla para acomodar todos os participantes. Nesta sala providenciar: ambão com toalha da cor do Tempo Litúrgico, Bíblia, vela e flores. Em uma mesa: folhas com o credo que serão entregues aos catequizandos (sugerimos colocar as duas versões do Credo, uma paralela a outra: O Credo dos apóstolos e o niceno-constantinopolitano) e cópias com o roteiro da celebração."}, {"id": "c2", "num": null, "kind": "celebracao", "title": "Celebração de Entrega do Credo", "when": "Um dos domingos do Advento", "biblia": "", "body": "### Celebração de Entrega do Credo\n\n*(Celebração a ser realizada em um dos domingos do Tempo do Advento).*\n\nPalavra inicial: Esta celebração tem o objetivo de apresentar a toda a comunidade os catequizandos que estão iniciando a segunda etapa da catequese, chamando a atenção para a grande importância desse processo para a vida da Igreja, bem como entregar-lhes a \"Profissão de Fé\". (lê-se do livro apenas o primeiro nome – nome de Batismo – se forem muitos pode-se omitir a leitura dos nomes).\n\nPreparando o ambiente: Livro onde foi registrado os nomes dos catequizandos ao final da primeira etapa e envelopes com a folha contendo a Profissão de Fé (Credo), de preferência nas duas versões (dos apóstolos e o Credo niceno-constantinopolitano). Reservar bancos para os catequizandos e padrinhos. Preparar crachás para cada catequizando para que o padre saiba o nome de cada um na hora de entregar o Credo.\n\nProcissão inicial: Os catequizandos e padrinhos de Batismo participam da procissão inicial. Pode-se levar ainda o Livro de registro com os nomes dos catequizandos e os envelopes contendo a \"Profissão de Fé\".\n\nSaudação inicial: O presidente acolhe os catequizandos, familiares e padrinhos. (tudo segue como de costume, até a homilia).\n\nApós a homilia o presidente prossegue com a entrega da \"Profissão de Fé\", dirigindo-se aos catequizandos com estas palavras ou outras semelhantes:\n\nPresidente: Caríssimos catequizandos, agora vocês receberão e escutarão as palavras da fé pela qual vocês serão salvos. São poucas, mas contêm grandes mistérios. Recebam e guardem essas palavras com pureza de coração.\n\n*(Podem se aproximar um de cada vez, ou, se forem muitos, fazem uma fila um ao lado do outro e o presidente faz a entrega do Símbolo impresso. Pode ter apenas uma música instrumental. Depois que todos receberam o presidente convida toda a comunidade a ficar de pé e começa o Símbolo dizendo:)*\n\nCreio em Deus, (E continua sozinho ou com a comunidade dos fiéis) Pai todo-poderoso, criador do céu e da terra; e em Jesus Cristo, seu único Filho, nosso Senhor, que foi concebido pelo poder do Espírito Santo, nasceu da Virgem Maria, padeceu sob Pôncio Pilatos, foi crucificado, morto e sepultado; desceu à mansão dos mortos;\n\nRito de entrega da \"Profissão de Fé\"\n\nApós a proclamação do Evangelho o diácono, ou na falta dele o catequista, pega o livro solenemente com os nomes dos catequizandos e chama-os cada um pelo nome.\n\nDiácono: Queiram aproximar-se os que estão com os nomes inscritos no livro dos catequizandos e que receberão da Igreja o Símbolo da fé: ... N..., ... N...\n\nCada um responde individualmente: *Presente!* (ou todos juntos, se forem muitos).\n\nAdaptado do Ritual de Iniciação Cristã – RICA.\n\n### Celebração de Entrega do Credo (Continuação)\n\nA missa prossegue como de costume.\n\nPreces: Na \"Oração da Assembleia\" podem-se acrescentar algumas das orações:\n\n* Para que esses catequizandos meditem e professem a fé cada dia em seus corações, roguemos ao Senhor;\n* Para que os catequizandos, confiando e testemunhando a fé no Cristo e na Igreja, vivam na liberdade dos filhos de Deus, roguemos ao Senhor;\n* Para que esses catequizandos, contemplando a sabedoria da cruz, possam gloriar-se em Deus, que confunde a sabedoria deste mundo, roguemos ao Senhor;\n* Para que o Espírito Santo, que sonda os corações de todos, fortifique com sua força divina esses catequizandos e lhes ensine as coisas que são de Deus e a Ele agradam, roguemos ao Senhor;\n* Para que a família desses catequizandos coloque sua esperança em Cristo e nele encontrem paz e santidade, roguemos ao Senhor;\n* Para que as famílias e os povos impedidos de abraçar a fé tenham a liberdade de crer no Evangelho, roguemos ao Senhor;\n* Senhor, fortaleça e ilumine todos os padrinhos e madrinhas de Batismo em sua missão de introduzir seus afilhados na fé cristã, roguemos ao Senhor.\n\nPresidente: Senhor, fonte da luz e da verdade, imploramos vosso amor de Pai em favor destes vossos servos: Purificai-os e santificai-os; dai-lhes verdadeira ciência, firme esperança e santa doutrina para que se tornem dignos do teu Reino. Por Cristo, Nosso Senhor.\n\n*Todos rezam em silêncio. Quem preside continua com as mãos estendidas sobre os catequizandos:*\n\nPresidente: Oremos pelos nossos catequizandos: que o Senhor nosso Deus abra os seus corações e as portas da misericórdia para que assumam com amor a fé no Cristo e sejam verdadeiros discípulos missionários do seu Reino.\n\n*Quem preside diz, com estas palavras ou outras semelhantes:*\n\nDiácono: Prezados catequizandos, ajoelhem-se para a oração sobre vocês.\n\n*O diácono ou outro ministro ou ainda o próprio catequista convida os catequizandos a se ajoelharem, dizendo:*\n\nCreio no Espírito Santo, na santa Igreja Católica, na comunhão dos santos, na remissão dos pecados, na ressurreição da carne, na vida eterna. Amém.\n\nObservação\n\nAconselhamos que essa celebração aconteça em um dos domingos do Tempo do Advento. Porém, por motivos pastorais pode ocorrer num outro dia.\n\n## I Parte – Meus Encontros de Catequese\n\n*[Texto na margem lateral parcialmente cortado/ilegível — eco das preces da página 22 — não incluído]*", "prep": "Livro onde foi registrado os nomes dos catequizandos ao final da primeira etapa e envelopes com a folha contendo a Profissão de Fé (Credo), de preferência nas duas versões (dos apóstolos e o Credo niceno-constantinopolitano). Reservar bancos para os catequizandos e padrinhos. Preparar crachás para cada catequizando para que o padre saiba o nome de cada um na hora de entregar o Credo."}, {"id": "e1", "num": 1, "kind": "encontro", "title": "A história continua…", "when": "1ª semana do Advento", "biblia": "Ez 34,11-12.15-16a", "body": "*(Encontro a ser realizado na 1ª SEMANA DO ADVENTO).*\n\nPalavra inicial: Neste primeiro encontro o objetivo é fazer uma retrospectiva da temática central (querigma), abordado nos encontros da primeira etapa, além de fazer uma avaliação com catequizandos que os catequizandos percebam que estão vivendo numa nova etapa do processo catequético do qual lhes serão apresentados os conteúdos de nossa fé, professados no \"Símbolo da Fé\".\n\nPreparando o ambiente: Ambão com toalha roxa, vela, flores e Bíblia. Para a dinâmica: revistas velhas que possam ser recortadas, tesoura sem ponta, cola, cartolina e uma imagem pequena de Jesus (se possível do Bom Pastor).\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"Seja bem-vindo... N..., Cristo está contigo!\" Pede para que se assentem nas cadeiras ao redor da mesa. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas, que poderá ser com um canto.\n\nRecordação da vida: Logo após a acolhida, ao redor da Mesa da Partilha, ou em pé ao redor da Mesa da Palavra, em clima de oração que pode ser proporcionado por um refrão meditativo, convidar os catequizandos a fazer uma retrospectiva de como foi participar da primeira etapa da catequese. O que sentiram e como participaram da \"celebração de inscrição do nome e entrega do Livro\". Perguntar se todos estão lendo a Bíblia em casa e em família.\n\nNa Mesa da Palavra\n\nOração inicial: Após a recordação da vida, o catequista inicia a oração, colocando como intenção todos os fatos recordados pelos catequizandos. Poderá iniciar ou concluir com a oração sugerida, ou de preferência com uma oração espontânea:\n\nSenhor Jesus, novamente estamos aqui para conhecê-lo melhor e fazer uma experiência viva consigo. Queremos entender a mensagem de Amor do Pai que nos quer transmitir. Que sejamos firmes e perseverantes como seus discípulos no anúncio da sua Palavra.\n\nO catequista dirige-se até o ambão e proclama o texto indicado.\n\nLeitura do texto bíblico: Ez 34,11-12.15-16a.\n\nEm seguida, após alguns minutos de silêncio, lê-o novamente, desta vez pausadamente, destacando alguns pontos: *\"[...] eu mesmo buscarei minhas ovelhas e tomarei conta delas [...] procurarei a ovelha perdida...\"* Todos retornam para a Mesa da Partilha.\n\nNa Mesa da Partilha\n\nO catequista reconstrói o texto com os catequizandos. Deixar que os catequizandos falem sobre o texto que acabaram de ouvir. Caso seja necessário, algumas perguntas poderão incentivá-los a participar: O que o pastor vai fazer? Para onde irá levar o rebanho? Quem é o pastor para nós? Depois conta a história \"O livro dá hora\".\n\nAntes o catequista poderá fazer uma recordação dos personagens e do final da última história contada na 1ª etapa da catequese. Segue alguns dados para ajudar:\n\nPassados vinte anos, novamente na véspera de Natal, Amanda era casada com Leonardo e tinha uma filha, Isabel. Amanda naquele ano era catequista e responsável pela encenação do nascimento de Jesus. Fernando era casado com Dora, e tinha filhos gêmeos, Otávio e Leandro. Fernando havia se tornado músico e era vocalista de uma banda de música católica. E Pedrinho havia se tornado padre, agora Padre Pedro.\n\nNeste novo ciclo de histórias que se inicia, os filhos de Amanda e de Fernando e o Padre Pedro serão os personagens centrais. Como no início das histórias do Livro da 1ª etapa, as crianças iriam encenar na véspera de Natal o nascimento do Menino Jesus: Otávio seria José e Leandro o Anjo Gabriel e Isabel seria Maria, a mãe de Jesus. Antes do teatro começar, Padre Pedro foi levar as crianças para tomar água, e acabaram tropeçando em latas de tintas, com o susto que tiveram com os relâmpagos que faziam por causa da tempestade. Naquele ano a igreja estava passando apenas por uma pintura. Padre Pedro e as crianças caíram numa sala escura...\n\nO livro \"dá hora\"\n\nRelampejava muito e os trovões eram cada vez mais altos. Padre Pedro continuava desacordado.\n\n– Otávio! A gente precisa chamar alguém pra ajudar o padre! – disse Leandro, que estava vestido de anjinho.\n\n– Gente, olha só o tamanho daquele livro! – exclamou Otávio ao ver, com a ajuda dos relâmpagos, um livro muito grande, maior que eles, encostado à parede.\n\n– Nossa! Parece uma Bíblia gigante! – disse Isabel.\n\nOs três se aproximaram da Bíblia encostada à parede. Isabel chegou mais perto e foi logo querendo abri-la, mas Otávio segurou sua mão.\n\n– Não, Isabel!\n\n– Ah, por que não posso abrir? – e ela abriu a Bíblia. Um clarão saído da Bíblia iluminou todo aquele lugar. A figura que viam parecia ser tão real que do outro lado até viam um cachorrinho correndo.\n\n– Que livro \"dá hora\"! O desenho do cachorrinho até se mexe – disse Leandro.\n\n– Ele tá triste, parece perdido – disse Otávio. E o cachorrinho agora parecia que tinha os visto e vinha na direção deles. Otávio, que adorava bichos, logo tratou de ir ao encontro do cãozinho. Isabel e Leandro não acreditaram que Otávio tinha entrado naquela grande Bíblia.\n\n– Como que o meu irmão fez isso? – perguntou Leandro.\n\nIsabel apenas pegou sua mão e os dois foram para o outro lado também. O cãozinho que era de cor caramelo fazia a maior festa com a presença dos três ali. Quando lembraram que tinham entrado na Bíblia, já era tarde demais, pois não viam a sala escura do outro lado. Eles se apavoraram e corriam de um lado para o outro, mas em vão, não achavam um meio de retornar. Otávio começou a chorar agarrado ao cachorrinho.\n\n– Para de chorar, Otávio! Senão eu também vou chorar... – disse Leandro, ao irmão gêmeo.\n\n– Não vai adiantar a gente ficar aqui chorando. A gente tem que procurar ajuda pra voltar pra casa.\n\n– É mesmo, Isabel. Quem sabe o dono do cachorrinho perdido não ajude a gente.\n\n– Ah não! Eu quero ficar com ele pra mim.\n\n– Aí, vamos achar um jeito de sair logo daqui vai, depois a gente vê o que faz com esse cachorro.\n\nE os três saíram sem rumo. Andaram muito, assim como seus pais um dia também andaram, procurando o caminho de volta para casa. Otávio começou a chorar e Leandro o abraçou para consolar o irmão.\n\n– Pode parar de chorar, Otávio. Quem veio parar aqui primeiro foi você! E cadê a fé em Deus? Vai me falar que você não tá acreditando que uma hora a gente vai voltar pra casa.\n\n– Não sei... Não sei, Isabel – respondeu Otávio soluçando. O cãozinho, parecendo entender a tristeza de Otávio, lambeu sua bochecha.\n\n– A minha mãe, toda vez que tá com problema, que discute com o meu pai, quando fica triste porque alguma coisa que ela queria que não acontecesse aconteceu, ela escuta uma música da Adriana, que fala assim: por que tenho medo? Se nada é impossível para ti? Se nada é impossível para ti. Por que tenho medo, se nada é impossível para ti... Nada é impossível para ti. Então, não precisa ter medo, nem ficar triste, nem duvidar, porque Deus vai ajudar a gente. Uma hora vai aparecer alguém que vai ajudar a gente voltar pra casa.\n\nE Isabel abraçou os gêmeos.\n\n– Deus é bom que nem o nosso pai é pra gente, Otávio. Ele vai cuidar da gente e não vai deixar nenhum mal acontecer.\n\n– Eu sei que Deus tá sempre com a gente... Que Ele nos vê e nos ouve... Mas eu tenho medo de não voltar e não ver o papai e a mamãe nunca mais.\n\n– A gente não devia ter entrado na Bíblia. Agora a gente vai ter que aguentar e seguir em frente. Vai, vamos logo que tá começando a ficar escuro, e eu tenho medo de escuro.\n\n– Ahhhhh... aí, você também tem medo, viu? Medrosa!\n\n– Para de graça, Otávio! É um medo diferente!\n\nE os três seguiram em frente em busca de alguém que os ajudasse a voltar pra casa.\n\nApós a história, desenvolver o tema com os catequizandos, abordando a segurança que Jesus nos oferece. Que Ele nunca nos deixa sós. Pelo contrário, nós que nos desgarramos muitas vezes do rebanho. Como é bom termos essa certeza. Por mais difícil que seja o caminho, Jesus caminha conosco!\n\nDinâmica: Distribuir aos catequizandos várias revistas que possam ser recortadas. Pedir para recortarem imagens que representem pessoas (qualquer estilo). Após todos recortarem (poderá ser mais de uma imagem por catequizando), o catequista deverá colar essas imagens em uma cartolina, formando um círculo e deixando o centro livre.\n\nAvaliar com os catequizandos nas imagens recortadas: quem são as pessoas, como estão vestidas, o que representam. Nesse momento deixar os catequizandos falarem. Verificar a diversidade: são pessoas diferentes e que nem se conhecem. Porém, verificamos que o centro do desenho está vazio.\n\nExiste alguém que fez uma promessa: *\"cuidarei de minhas ovelhas e as resgatarei de todos os lugares [...] Eu mesmo apascentarei minhas ovelhas e as farei repousar\"* (Ez 34,12.15).\n\nPerguntar: Quem é essa pessoa?\n\nNesse momento o catequista cola no centro a imagem de Jesus.\n\nApós colar a imagem o catequista pergunta por que Jesus está no centro. Poderá dizer depois os comentários dos catequizandos que Jesus é o centro da nossa vida, sem Ele, por mais que estejamos juntos com outras pessoas, existirá um vazio que só Ele pode preencher. As pessoas diferentes nos\n\najudam a compreender a passagem bíblica lida, que Jesus reunirá ovelhas de \"todos os lugares\", sem distinção. Onde ninguém é maior ou melhor que o outro. Todos somos irmãos em Cristo, pertencemos ao mesmo rebanho, à mesma família.\n\nEm nossos encontros temos sempre essa certeza. Estamos reunidos, porém em seu nome. É Ele o motivo principal de estarmos aqui.\n\nConclusão: O encontro poderá ser concluído, pedindo para que os catequizandos levem essa mensagem a outras pessoas. Principalmente aos catequizandos que não vieram participar do primeiro encontro. Incentivá-los a irem visitá-los, dizendo que eles fazem parte deste rebanho e que estão fazendo muita falta. Também fazer o propósito de quando encontrarem alguém triste ou se sentindo sozinho, lembrar essa pessoa que Jesus está com ela, como Ele mesmo disse.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e incentiva-os a fazer preces pedindo pela família, comunidade e amigos. Todos respondem no final de cada invocação: \"Senhor, escuta a nossa prece\".\n\nConcluir com o Pai-nosso e com a oração:\n\nSenhor Deus, obrigado pela certeza de estares junto conosco e nos acompanhar. Pedimos por todos aqueles que ainda não te conhecem e por isso se sentem sozinhos. Que o Senhor ampare e conforte a todos. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... vai em paz, que o Senhor te acompanhe! Amém\".\n\nObservação\n\nNesta etapa, os catequizandos já tiveram contato com a Bíblia e já a receberam solenemente. Portanto, nos próximos encontros serão eles que farão as leituras bíblicas. Seria importante fazer uma escala e distribuir com antecedência a passagem a ser lida para que o catequizando possa \"treinar\" a sua leitura. Incentive-os a fazer desta preparação um momento de oração. Pedir para que cheguem com antecedência, para que possam marcar a leitura na Bíblia utilizada nos encontros. Pedir para que todos tragam a Bíblia que receberam na celebração de entrega do Livro.\n\nDica\n\nO catequista poderá propor fazer uma escala com os catequizandos, onde a cada encontro um ficará responsável de trazer flores para ornamentar o espaço da Palavra (poderá ser a mesma escala da leitura do texto bíblico).\n\nAlém disso, recordamos a sugestão dada na primeira etapa, onde a cada semana um catequizando levará para casa a imagem de Nossa Senhora ou padroeiro da comunidade, na qual será incentivado a rezar em família.", "prep": "Ambão com toalha roxa, vela, flores e Bíblia. Para a dinâmica: revistas velhas que possam ser recortadas, tesoura sem ponta, cola, cartolina e uma imagem pequena de Jesus (se possível do Bom Pastor)."}, {"id": "e2", "num": 2, "kind": "encontro", "title": "Creio em Deus Pai todo-poderoso", "when": "2ª semana do Advento", "biblia": "Êx 3,6-9", "body": "Creio em Deus Pai todo-poderoso\n\n*(Encontro a ser realizado na 2ª SEMANA DO ADVENTO)*\n\nPalavra inicial: Querido catequista, a partir deste encontro iremos apresentar aos catequizandos o Credo, do qual iremos refletir uma parte a cada encontro. Neste encontro começaremos com a frase: \"Creio em Deus Pai todo-poderoso\", mostrando que o ato de crer, de acreditar, nasce da fé em um Deus que é todo-poderoso, e que se revelou à humanidade.\n\nPreparando o ambiente: Ambão com toalha roxa, vela, flores, cartaz grande com a Profissão de Fé e cópias da oração para ser distribuída no final do encontro para cada catequizando.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., Deus conhece a cada um de nós!\", ou outra semelhante. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas e convida-os a se dirigirem até a Mesa da Partilha.\n\nRecordação da vida: Após serem acolhidos, farão uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista inicia a oração valorizando todas as coisas ditas na recordação da vida. Convida-os a juntos rezarem o Credo. No final pode-se rezar a oração:\n\nSenhor, obrigado(a) por estarmos novamente reunidos em vosso nome. Fazemos o propósito de conhecer-vos melhor para vos servir e louvar. Somos agradecidos ao Pai, que no seu plano de Amor vos enviou para que possamos conhecer a Boa-Nova.\n\nO catequista convida o catequizando escalado como leitor do encontro para se dirigir até o ambão e proclamar o texto indicado.\n\nLeitura texto bíblico: Êx 3,6-9.\n\nEm seguida, após uns minutos de silêncio, o catequista o lê novamente, desta vez pausadamente, destacando alguns pontos do texto.\n\n\"[...] Eu sou o Deus de teu pai [...]. Eu vi a opressão do meu povo no Egito, ouvi seus gritos [...] tomei conhecimento de seus sofrimentos\".\n\nApós a leitura, todos dirigem-se para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nPedir aos catequizandos para que reconstruam o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrir suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. É importante o catequista NÃO dizer a página em que se encontra a passagem bíblica, mas sim orientá-los como procurar as citações.\n\nLogo após contar a história \"Deus ouve nossa oração\".\n\nDeus ouve nossa oração\n\nAs crianças caminhavam com fome procurando alguém que as ajudasse a voltar para casa. O cachorrinho, que tinha recebido o nome de Totó, ia junto ao colo de Otávio. Eles estavam tão cansados e com tanta fome que Leandro sugeriu que se sentassem um pouco. Isabel disse que precisavam caminhar mais, pois já estava quase à noitinha e eles não tinham encontrado um lugar seguro para passarem a noite. Eles pararam embaixo de uma árvore de galhos grandes e grossos.\n\n– Bem que as asinhas do meu figurino podiam ser de verdade e, assim, eu poderia voar bem alto e ver onde é que têm pessoas para ajudar a gente – disse Leandro, que no Auto de Natal seria o Arcanjo Gabriel.\n\nE para surpresa das crianças as asinhas de Leandro começaram a bater e ele começou a subir sozinho pelo ar.\n\n– Uau! E não é que Deus ouviu o meu pedido e realizou esse milagre! – e Leandro voou bem alto e lá de cima ele via o sol se pôr no horizonte se escondendo em meio às montanhas.\n\n– Você tá vendo alguma casa ou alguma pessoa? – perguntou Otávio, que colocava Totó ao chão.\n\nLeandro não viu ninguém. Eles, então, se abrigaram numa pequena caverna ao pé de uma montanha, esperando que no dia seguinte pudessem voltar para casa. Isabel sugeriu que eles rezassem para agradecer a Deus pelo milagre, porque mesmo que naquele momento eles não tivessem encontrado alguém, no dia seguinte Leandro poderia voar e encontrar.\n\n– Eu lembro que a minha mãe disse um dia que Deus sempre ouve a nossa oração, e que a gente tem que saber esperar, porque na hora certa o milagre acontece!\n\nApós a história, interrogar os catequizandos sobre o significado da palavra CRER (Deixar falarem). Explicar que, segundo o Dicionário Aurélio (2. ed., 1988), crer significa: Acreditar; ter por certo ou verdadeiro. Aceitar como verdadeiras as palavras de. Ter fé, dar crédito. Crer, acreditar é algo que nasce da fé em um Deus que se apresenta como Pai e do qual nós não podemos ver, mas o sentimos. Esclarecer que na Profissão de Fé, iniciamos com essa frase: \"Creio em Deus Pai, todo-poderoso\". Nessa oração professamos que Deus é Pai e que possui poder. Contar aos catequizandos que Deus se apresenta a Moisés (o catequista poderá falar um pouco sobre quem foi Moisés), dizendo que ouve a aflição de seu povo. Quando falamos ao telefone com alguém que nós não o vemos, mas sabemos que ela existe, está nos ouvindo e fala conosco. É como quando nós rezamos. Nós não podemos ver a Deus, mas a Bíblia conta-nos que, quando falamos com Deus, Ele nos ouve cuidadosamente. Nós podemos contar-lhe todas as nossas coisas. Conversar sobre o fato de que acreditar, ter fé é um ato pessoal, onde o fiel submete completamente sua inteligência e vontade a Deus. É aceitar livremente toda a verdade que Deus revelou ao homem. E isso implica uma adesão pessoal, um comprometimento com Deus e a Igreja, a colocar em prática e a viver os seus mandamentos. Apesar disso, da fé ser um ato pessoal, de forma alguma é um ato isolado. Ninguém pode crer sozinho ou dar a si próprio a fé. Recebemos a fé da Igreja, a professamos e a transmitimos. Quando digo \"eu creio\", professo de maneira pessoal a fé recebida, ao passo que os fiéis reunidos numa mesma fé, em comunidade, dizem \"nós cremos\". Nos artigos 166 e 167 do Catecismo da Igreja Católica (CIC) podemos ler: \"A fé é um ato pessoal: a resposta livre do homem...\n\nà iniciativa de Deus que se revela à humanidade. Ela não é, porém, um ato isolado. Ninguém pode crer sozinho, assim como ninguém pode viver sozinho. Ninguém deu a fé a si mesmo, assim como ninguém deu a vida a si mesmo. Recebemos a fé de outros, e devemos anunciá-la a outros. Nosso amor por Jesus e pela Igreja nos impulsiona a falar a outros de nossa fé. Cada pessoa que crê é como um elo na grande corrente dos crentes. Não posso crer sem ser carregado pela fé dos outros, e pela minha fé contribuo para carregar e alimentar a fé dos outros. \"Eu creio\": esta é a fé da Igreja, professada pessoalmente por todo crente, principalmente pelo batismo. \"Nós cremos\": esta é a fé da Igreja professada pelos bispos reunidos em Concílio ou, mais comumente, pelos fiéis reunidos para celebrar a Eucaristia. \"Eu creio\": é também a nossa Mãe Igreja, que responde a Deus com sua fé e que nos ensina a dizer: \"eu creio\", \"nós cremos\".\n\nExplorar que \"Profissão de Fé\", \"Credo\" e \"Símbolo de Fé\", são os nomes conhecidos com que costumamos nos referir aos textos que resumem e traduzem o essencial daquilo que nós cristãos católicos acreditamos. \"Credo\" porque é uma palavra do latim que significa \"creio\", primeira palavra que recitamos na fórmula da fé. Orientar que a Igreja sempre pelos séculos procurou preservar e propagar a fé recebida. Na catequese somos convidados a refletir sobre o que acreditamos, sobre a nossa fé, somos convidados a alicerçá-la para que assim como aqueles que vieram antes de nós, a viveram e a propagaram, a ponto de chegar até os nossos dias, nós também, devemos vivê-la e anunciá-la às futuras gerações. Ajudar os catequizandos a compreender que, hoje, se estamos participando da catequese e das atividades de nossa Igreja é porque nossos pais acreditaram, e nós também, como filhos e filhas do único Deus, queremos professar e propagar a fé professada por toda a nossa Igreja. Por fim dizer que Deus é \"Pai\" e é \"todo-poderoso\" porque a sua paternidade e poder é caracterizado por uma liberdade amorosa e paterna. Deus é pai, pois em Jesus e com sua morte e ressurreição, nos adota como filhos e filhas, e com seu poder criador e salvador, respeita nossa liberdade e nos chama constantemente ao seu Reino (o céu). O seu poder é o amor e a misericórdia.\n\nConclusão: Hoje, aprendemos um pouco mais sobre o que é \"crer\". Vimos que a fé é algo pessoal, porém que deve ser vivida comunitariamente. E que Deus está sempre presente conosco e nos ouve. E nós, temos ouvido a Ele também? Estamos praticando a sua vontade? Temos ouvido as outras pessoas, ou só estamos preocupados conosco mesmos? Pois, como vimos, não podemos crer sem ser carregados pela fé dos outros. Quantas vezes ouvimos testemunhos belíssimos de nossos irmãos e de santos que nos alegram e nos animam e nos fortalecem na caminhada? Nosso compromisso é estarmos atentos às nossas ações, se elas estão sendo coerentes com a vontade do Pai, além de aprendermos a ouvir mais as pessoas, procurando entendê-las e enxergar as ações de Deus em suas vidas.\n\nO catequista orienta os catequizandos a levarem para casa a cópia da Profissão de Fé que receberam e a colar no Diário Catequético e Espiritual e a fazer as atividades propostas no diário.\n\nObservação\n\nSugerimos que os catequizandos recebessem o Credo impresso contendo as duas versões: O \"Símbolo dos Apóstolos\" e o Credo \"niceno-constantinopolitano\". Para os encontros de catequese usamos os artigos do Símbolo dos Apóstolos, por ser mais resumido e de mais fácil compreensão, porém o catequista poderá usar do Credo niceno-constantinopolitano para acrescentar e enriquecer os encontros, bem como a sua formação pessoal. No final de alguns encontros, colocamos no material de apoio, os artigos correspondentes do Credo niceno-constantinopolitano.\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 26 a 73 e 185 a 278 do Catecismo da Igreja Católica.\n* No Símbolo niceno-constantinopolitano: \"Creio em um só Deus, Pai todo-poderoso...\"\n\n\"Vai em paz, ...N..., filho amado do Pai!\" No final da oração o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\nÓ Deus, somos agradecidos por poder contar-lhe todas as coisas. Como Pai zeloso, sempre nos ouve e quer nos ajudar. Obrigado por ouvir-nos. Ajude-nos a ouvi-lo também. Por Cristo Nosso Senhor. Amém.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra. Incentiva os catequizandos a formularem orações e preces e conclui com a oração:", "prep": "Ambão com toalha roxa, vela, flores, cartaz grande com a Profissão de Fé e cópias da oração para ser distribuída no final do encontro para cada catequizando."}, {"id": "e3", "num": 3, "kind": "encontro", "title": "Criador do céu e da terra", "when": "3ª semana do Advento", "biblia": "Gn 2,4b-7", "body": "Criador do céu e da terra\n\n*(Encontro a ser realizado na 3ª SEMANA DO ADVENTO)*\n\nPalavra inicial: Prezado catequista, queremos neste encontro refletir com os catequizandos que Deus é o autor de toda criação. Não queremos ver o texto bíblico com um olhar literal, mas buscando a mensagem que o autor quis deixar ao escrever a história da criação: A intenção não foi escrever como o mundo foi criado, mas dizer que tudo o que existe é criação do único e verdadeiro Deus. Além disso, queremos ensinar os catequizandos a serem agradecidos por toda obra criadora, fazendo-os reconhecer em todas as coisas existentes a manifestação de Deus.\n\nPreparar o ambiente: Ambão com toalha roxa, vela e 2 cartazes representando a natureza. Um cartaz com imagem do céu, estrelas, lua, planetas (noite). Outro cartaz com imagem do céu, sol, nuvens, água, flores, animais e pessoas (dia). Para a dinâmica: folhas de sulfite e lápis de cor ou giz de cera.\n\nAcolhida: O catequista acolhe os catequizandos saudando-os e conduzindo-os para a sala de encontro: \"Seja bem-vindo ...N..., criação perfeita de Deus\".\n\nRecordação da vida: Após serem acolhidos, ao redor da Mesa da Partilha ou da Mesa da Palavra, em clima de oração, fazer uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, pedindo para que partilhem o que cada um experienciou. Poderão destacar ainda, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração inicial e por fim convida a todos a rezar o \"Credo\" e conclui com a oração:\n\nSenhor Nosso Pai, estamos aqui reunidos para conhecermos mais sobre ti e reconhecermos que tudo foi feito por ti, e sem ti nada do que foi criado poderia ser feito. Envia sobre nós o teu sopro criador, o Espírito Santo, para que possamos compreender todo o seu projeto de salvação. Amém.\n\nO catequizando escalado como leitor do encontro se aproxima do ambão e proclama o texto indicado.\n\nLeitura do texto bíblico: Gn 2,4b-7.\n\nApós um período de silêncio o catequista lê novamente o texto, desta vez pausadamente, destacando alguns pontos do texto.\n\n\"No dia em que o SENHOR Deus fez a terra e o céu [...] Deus formou o ser humano do pó da terra, soprou-lhe nas narinas o sopro de vida e ele tornou-se um ser vivo\".\n\nTodos se dirigem até a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir o texto bíblico com os catequizandos. Depois o catequista questiona-os: Quais as coisas que foram criadas por Deus? Deixar os catequizandos falarem. Depois pedir aos catequizandos para abrir suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa\n\nobservando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Depois contar a história \"Louvado seja Deus por todas as suas criaturas\", mostrando que tudo que existe é criação de Deus.\n\nLouvado seja Deus por todas as suas criaturas\n\nNo dia seguinte nossos amiguinhos, Isabel e os gêmeos Otávio e Leandro, acordaram com um pouco de dor nas costas por terem dormido no chão. Mas a vontade de voltar para casa era tão grande que logo se esqueceram das dores e saíram da caverna para acharem algo de comer. Eles entraram no meio de uma floresta e logo viram uma macieira. Isabel adorava comer maçã. Eles apanharam algumas e depois as lavaram num riacho que corria por ali de águas cristalinas.\n\n– Será que essa água tá limpa mesmo?\n\n– Claro que tá, Leandro! Não tá vendo o fundo do riacho? – disse Otávio.\n\n– Ah, mas sei lá... é difícil de acreditar que ainda tenha riachos, córregos e rios de água limpa.\n\n– O Leandro tem razão. Todo mundo, até mesmo a gente, polui o meio ambiente mesmo sem perceber. A gente descasca uma bala ou um chiclete e faz o que, se tá na rua? Joga no chão!\n\n– Nossa, é verdade! A gente faz isso mesmo sem perceber...\n\n– Pois é, Leandro! A gente esquece que, se chove, a enxurrada vai levar toda a sujeira que a gente joga na rua pro bueiro e depois pode ir parar num córrego, num riacho ou rio...\n\n– Imagina se um peixe ou outro bichinho que vive na água engolir um papel de bala... – disse Otávio – pode morrer.\n\n– Se a gente se lembrasse mais que tudo que existe na natureza foi criado por Deus com tanto amor, a gente ia cuidar mais do nosso planeta.\n\n– Um dia meu pai falou que esse monte de tempestade é a natureza que tá cansada de ser tão maltratada e por isso tá ficando nervosa e fazendo essas coisas.\n\n– Minha mãe disse a mesma coisa, Lê! – disse Isabel, mordendo uma maçã.\n\n– Seria tão legal se tivesse mais lugares assim como esse pra gente visitar, né? Olha quantas árvores... essa água doce limpinha. Olha lá do outro lado! Tem coelhinhos! – apontou Otávio.\n\n– E tem macacos nas árvores olhando pra gente também! – exclamou Isabel.\n\n– Louvado seja Deus por toda a sua criação e por ainda existir um lugar tão bonito e tão cheio de bichos como esse! – rezou Otávio, segurando Totó nos braços.\n\nApós a história, recolher os cartazes que estavam no ambão e apresentar aos catequizandos. Mostrar-lhes algumas obras criadas por Deus. Depois questioná-los se eles sabem como que tudo isso foi criado. Se realmente foi como está descrito na Bíblia, principalmente quanto à criação do homem. Deixar que eles falem. Depois, se possível aproveitando as falhas dos catequizandos, explicar-lhes que existem várias teorias da \"história da criação\", de como o mundo surgiu. Refletir que não sabemos ao certo como foi, pois nenhum de nós estava lá. Só podemos afirmar que a única certeza que temos é de que foi Deus quem criou tudo. Não sabemos como, se foi do barro, se foi pela palavra, ou de outra maneira. A história narrada na Bíblia, no Livro de Gênesis, não quer nos dizer como o mundo foi criado, mas\n\nquer transmitir uma mensagem para todos aqueles que não acreditavam no Deus único. Na época em que o Livro de Gênesis foi escrito havia várias pessoas que acreditavam que o sol, a lua, a terra, o trovão, eram deuses. Então o autor bíblico escreve essa história para dizer que tudo aquilo que o povo dizia que era deus, na verdade era criação do único Deus, nosso Pai. Deus criou o mundo, a natureza e a cada um de nós. Ao criar o mundo, Deus o confiou ao homem, para que dele usufruísse e cuidasse. O catequista, recordando a história, poderá questionar os catequizandos se eles têm cuidado em preservar a obra criadora de Deus.\n\nDinâmica: Distribuir folhas de sulfite para os catequizandos e pedir para que eles desenhem outras coisas que não estão nos cartazes e que foram criadas por Deus. Socializar os desenhos com todos os catequizandos. Enquanto a atividade é desenvolvida o catequista poderá colocar uma música com som de barulhos de água, pássaros...\n\nConclusão: Vimos que o Senhor Deus é o autor de todas as coisas. Ele é o princípio e o fim de toda a criação. Vamos refletir juntos: Será que damos o devido valor e gratidão a todas as coisas criadas por Ele? Ou será que ainda procuramos outros deuses que possam nos oferecer outras obras? (deus do dinheiro, deus do poder, ganância, drogas, entre outras coisas).\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra, onde inicia agradecendo a Deus por algumas coisas e pede aos catequizandos para que possam dar continuidade, fazendo outros agradecimentos.\n\n* Obrigado pelo dom da vida...\n* Obrigado por cada amanhecer...\n* Obrigado pela água que me despertou, pelo sabonete perfumado, pela pasta de dente refrescante...\n* Obrigado pela roupa que me veste, pelas cores que ela tem...\n* Obrigado pela comida que me sustenta e pelo copo-d'água que mata a minha sede.\n* Obrigado, Senhor...\n\nLogo após os agradecimentos espontâneos dos catequizandos o catequista conclui com a oração:\n\nSenhor, Deus Pai criador, nós agradecemos por ser o Senhor da Vida e autor de todas as coisas. Como filhos, prometemos ser obedientes e enxergar em cada criatura e criação o seu ato de amor por nós. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N..., criatura perfeita do Pai, vai em paz, e que o Senhor te acompanhe!\"\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 279 a 421 do Catecismo da Igreja Católica (CIC).\n* No Símbolo niceno-constantinopolitano: \"...criador de todas as coisas visíveis e invisíveis...\".", "prep": "Ambão com toalha roxa, vela e 2 cartazes representando a natureza. Um cartaz com imagem do céu, estrelas, lua, planetas (noite). Outro cartaz com imagem do céu, sol, nuvens, água, flores, animais e pessoas (dia). Para a dinâmica: folhas de sulfite e lápis de cor ou giz de cera."}, {"id": "e4", "num": 4, "kind": "encontro", "title": "Reconhecendo a criação", "when": "4ª semana do Advento", "biblia": "Gn 2,8-9", "body": "Reconhecendo a criação\n\n*(Encontro a ser realizado na 4ª SEMANA DO ADVENTO)*\n\nPalavra inicial: Neste encontro queremos proporcionar aos catequizandos fazer uma experiência de observação e contemplação da maravilha da criação reconhecendo nela a presença de Deus.\n\nPreparar o ambiente: Ambão com toalha roxa, vela e flores. Para a dinâmica: uma folha de sulfite para cada catequizando, giz de cera ou lápis de cor, tesouras sem ponta e o desenho do tronco de uma árvore que poderá estar desenhada em uma cartolina. Caso não tenha árvore próxima ao local da catequese, levar uma folha de árvore para cada catequizando. Se preferir e o tempo estiver bom, o catequista poderá propor que o encontro aconteça a céu aberto, numa praça ou jardim.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., seja bem-vindo para o encontro com o Criador\".\n\nRecordação da vida: Após serem acolhidos, ao redor da Mesa da Partilha ou da Mesa da Palavra, fazer uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração inicial. Poderá ser rezado o Credo e no final concluir com a oração:\n\nSenhor nosso Pai, estamos aqui reunidos para agradecê-lo por toda a obra e criação, nos propondo a conhecer melhor e cuidar de todas as coisas que nos deixastes, reconhecendo a sua face em todas elas.\n\nO catequizando, escalado como leitor do encontro, dirige-se até o ambão, de onde proclama o texto bíblico indicado.\n\nLeitura texto bíblico: Gn 2,8-9.\n\nDepois de um período de silêncio, o catequista lê o texto novamente, desta vez pausadamente, destacando alguns pontos.\n\n\"...Deus fez brotar da terra toda sorte de árvores de aspecto atraente e saborosas ao paladar...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir junto aos catequizandos o texto bíblico. Interrogá-los se já pararam para observar e contemplar as coisas criadas por Deus. Perguntar se, no dia de hoje, observaram os pássaros, árvores e plantas durante o caminho da escola ou do encontro de catequese. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convidar a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nDinâmica: Se não estiver chovendo, propor aos catequizandos que façam uma experiência de observação. A proposta é que todos saiam da sala de encontro e em silêncio observem nas suas imediações quais as obras criadas por Deus podem ser vistas por todos. Ao saírem os catequizandos deverão procurar sentir e observar a natureza ao seu redor: o calor do sol, o vento tocando sua pele, as nuvens, árvores e flores... Caso tenha alguma árvore próxima ao local, pedir para que cada catequizando recolha uma folha dessa árvore. Caso não tenha, o catequista deverá levar uma folha para cada catequizando. Após algum tempo, todos deverão entrar para a sala de encontro e compartilhar o que e como sentiram as obras de Deus em suas vidas.\n\nContar a história \"O jardim da criação\", enfocando que cada coisa foi feita por Deus de maneira única e singular para que o ser humano a desfrutasse com consciência e respeito.\n\nO jardim da criação\n\n– Que linda oração você fez, menino!\n\nNossos três amiguinhos e Totó viraram para trás num grande susto. Uma velha árvore parecia ter falado com eles. Seria possível isso? Os três se olharam sem saber o que fazer. A árvore estava falando da oração que Otávio havia feito por toda a criação de Deus.\n\n– Não precisam ficar com medo, crianças! Podem se aproximar de mim – disse a velha árvore.\n\n– Como é possível uma árvore falar? – indagou Leandro.\n\n– E como é possível um menino voar sem ser anjo? – retrucou a árvore.\n\n– Ah! Não sei, só sei que a gente veio parar nesse lugar atravessando uma Bíblia grandona e aqui essas asinhas do figurino começaram a se mexer sozinhas e eu consegui voar.\n\n– Pois, então, muitas coisas acontecem sem que a gente consiga entender. E que bom seria se todas as crianças tivessem o coração tão cheio de agradecimento pelas coisas que Deus fez. Vocês serão aqueles que vão tomar conta do mundo no futuro. Todas as crianças precisam reconhecer as maravilhas que Deus fez para a humanidade e preservá-las.\n\nNessa hora, vários animais apareceram ali saindo de trás das árvores, das plantas, dos morros e ficaram observando as crianças que ficaram a princípio com medo, mas depois muito alegres de poderem ver tantos bichos ali.\n\n– Nossa catequista, que é a mãe da Isabel, sempre fala que a gente tem que reconhecer Deus não só nas pessoas, que também foram criadas por Deus, mas na natureza, nos bichos... – explicou Leandro.\n\n– Ah, eu tinha certeza de que vocês estão sendo bem-instruídos pelos adultos que estão cuidando de vocês – disse a árvore.\n\n– Você tem um nome? – quis saber Isabel.\n\n– Sim, tenho. Meu nome é Centrilha. Sou uma das árvores mais velhas desse lugar.\n\n– Muito prazer, dona Centrilha. Eu sou a Isabel e eles são os gêmeos Otávio e Leandro.\n\n– O prazer é todo meu de poder estar diante de crianças tão especiais.\n\n– Há muito tempo minhas irmãs árvores, todos esses bichos e eu não víamos humanos por aqui. E olha que sou bem velha, já que fui uma das primeiras árvores criadas pelo nosso Deus. E me lembro de como Deus criou cada coisa com um amor imenso.\n\n– Como assim? – indagou Otávio.\n\n– Vocês estão no jardim do Éden.\n\n*[continuação da história \"O jardim da criação\"]*\n\nAs crianças ficaram boquiabertas. Elas se encontravam no paraíso.\n\n– A gente tá muito feliz de tá aqui dona Centrilha, mas pra que lado fica a saída? A gente tem que voltar porque vamos participar de um Auto de Natal no final da missa.\n\n– Infelizmente, Isabel, eu não sei indicar o caminho para vocês voltarem para casa. Mas não tenham medo, vocês vão voltar. Basta seguir o coração de vocês.\n\n– E será que vai demorar pra achar a saída? – quis saber Leandro.\n\n– Não sei, Leandro. A única coisa que tenho certeza é que vocês foram escolhidos para estarem aqui.\n\n– E o que a gente faz agora?\n\n– É, Otávio, o que a gente faz? Fica aqui ou continua andando sem saber pra onde?\n\n– Eu acho, Isabel, que a gente tem que continuar. Uma hora a gente vai encontrar alguém, ou a saída, ou até mesmo a Bíblia grandona.\n\nEntão, eles se despediram da dona Centrilha e continuaram a sua jornada. Eles preferiram caminhar pelas margens do riacho e ficaram surpresos quando viram que alguns peixinhos os acompanhavam.\n\nApós a história, se o tempo e o ambiente tiverem sido favoráveis, e, se os catequizandos tiverem feito a dinâmica de observação e cada um ter pego uma folha de árvore, solicitar que coloquem sobre a mesa. Se não fizeram a dinâmica, o catequista poderá distribuir: uma folha de árvore, uma folha de papel sulfite e giz de cera ou lápis de cor para cada catequizando. O catequista orienta para cada catequizando colocar a folha de sulfite sobre o verso da folha da árvore, e com o giz de cera ou lápis de cor passa por cima da sulfite, deixando estampada nela a folha de árvore. Depois pedir para recortarem a folha que ficou impressa na folha de sulfite. Na folha que cada um recortou, escrever de um lado o seu nome e do outro um compromisso para preservar a criação de Deus. Depois, o catequista apresenta o cartaz com o desenho do tronco de uma árvore e pede para que cada catequizando leia e cole na \"copa\" da árvore a sua folha com o seu propósito. Enquanto isso, poderá ser colocada uma música instrumental.\n\nConclusão: A cada manhã, ao acordarmos, devemos agradecer a Deus por mais um dia e por toda obra da sua criação. Sempre que possível, parar e observar a natureza e contemplar a maravilha das coisas criadas por Deus. Além disso, incorporar na rotina do nosso dia a dia o costume de preservar e cuidar do meio ambiente.\n\nAtividade para o próximo encontro: O catequista fará a proposta para que os catequizandos visitem, durante a semana, algumas quadras próximas ao local onde é realizado os encontros de catequese. A intenção é mapear essas quadras, descrevendo o que consta nelas: lixo a céu aberto, vazamento de água, jardins, árvores... Os catequizandos deverão mapear a quadra (rua) onde visitarem, anotando essas informações em uma folha de papel e posteriormente copiá-las no Diário Catequético e Espiritual do Catequizando e trazer no próximo encontro.\n\nExemplo: Na Rua 7 de setembro com a Avenida Dom Pedro II tem uma árvore. Na Rua 13 de maio com a Avenida Getúlio Vargas tem um vazamento de água e um depósito de lixo a céu aberto.\n\nOração final e bênção: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra. Juntos rezam, pedindo por toda a humanidade, para que tenham consciência da necessidade de preservar a natureza. Rezar também por todos aqueles que se dedicam em projetos sustentáveis de preservação. O catequista conclui com a oração:\n\nÓ Pai, nós queremos agradecer por toda a sua obra, pelo amor que nos devota. Comprometemo-nos em proteger e conservar toda a sua obra. Ajude-nos nessa missão. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... vai em paz, e que o Senhor te acompanhe! Amém\".\n\nObservação\n\nNa semana do Natal e do Ano-Novo não haverá encontros de catequese, porém os catequizandos devem ser incentivados a participar das celebrações da comunidade (Missa da Vigília e do dia do Natal, Sagrada Família e Santa Mãe de Deus, Maria). Os encontros de catequese retornam na semana após a celebração da Epifania do Senhor.", "prep": "Ambão com toalha roxa, vela e flores. Para a dinâmica: uma folha de sulfite para cada catequizando, giz de cera ou lápis de cor, tesouras sem ponta e o desenho do tronco de uma árvore que poderá estar desenhada em uma cartolina. Caso não tenha árvore próxima ao local da catequese, levar uma folha de árvore para cada catequizando. Se preferir e o tempo estiver bom, o catequista poderá propor que o encontro aconteça a céu aberto, numa praça ou jardim."}, {"id": "e5", "num": 5, "kind": "encontro", "title": "Preservar a criação", "when": "Tempo do Natal", "biblia": "Gn 2,15", "body": "Palavra inicial: Neste encontro queremos conscientizar os catequizandos da responsabilidade e do compromisso de preservar a criação de Deus, começando por observar o bairro e o ambiente em que vivem.\n\nPreparar o ambiente: Ambão com toalha branca, vela, recipiente com água-benta, cartaz com a frase: \"Ninguém é tão bom sozinho quanto todos nós juntos\". Cartolina ou papel-cartão para desenhar o mapa das imediações da comunidade.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., é preciso cuidar da criação. Seja bem-vindo!\"\n\nRecordação da vida: Quando todos estiverem na sala de encontro, ao redor da Mesa da Partilha ou da Mesa da Palavra, em clima de oração motivar os catequizandos a recordar fatos e acontecimentos que marcaram a semana. O catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração inicial. Poderá passar um pequeno recipiente com água-benta, para que todos possam molhar as pontas dos dedos e traçar o sinal da cruz sobre o seu corpo, recordando o nosso batismo. Poderá concluir com a oração:\n\nSenhor Nosso Pai, agradecemos por estarmos mais uma vez reunidos e sermos parte da sua obra de criação. Diante de tanto descaso pelas suas obras, nos prontificamos a zelar e proteger, conservando todas as coisas que nos deste.\n\nO catequizando, escalado como leitor do encontro, dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Gn 2,15. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar. *\"...para que o cultivasse e o guardasse.\"* Todos se dirigem para a mesa da partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir junto aos catequizandos o texto bíblico, enfatizando que tudo o que Deus criou, deixou para que o ser humano tomasse conta. Depois pedir aos catequizandos para abrir suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nApós a reconstrução do texto bíblico, contar a história \"Ninguém para ajudar\".\n\nNinguém para ajudar\n\nIsabel e os gêmeos Otávio e Leandro, e o cãozinho Totó, já tinham caminhado bastante e ainda não haviam encontrado ninguém.\n\n– Tô com fome! – exclamou Otávio. Totó deu um latido parecendo concordar com ele. E de repente um vento muito forte começou a soprar. Eles tiveram de se segurar um ao outro porque estavam com medo de serem levados pela ventania.\n\n*[continuação da história]*\n\nPassado o vendaval eles andaram mais um pouco e logo à frente viram três crianças: duas meninas e um menino que estavam vestidos com roupas de nossa época. As meninas estavam observando o menino, com um estilingue, mirando para derrubar um passarinho que alimentava seu filhote no ninho. Otávio, que sempre protegia os animais, gritou um \"não\" tão alto que o menino errou a mira e a pedra não acertou o pássaro.\n\n– Por que você quer derrubar o passarinho? Não tá vendo que ele estava alimentando o filhotinho? E se você tivesse acertado o passarinho no ninho também ia morrer... ia morrer de fome.\n\n– Ah seu moleque bobo! Tem tantos pássaros por aqui que dois mortos não iam fazer falta – respondeu o menino do estilingue.\n\n– Mas por que você quis matar o passarinho? – perguntou Isabel.\n\n– Porque eu acho legal!\n\nE o menino não se importou mais com eles e correu para a beira do riacho. As meninas o seguiram. Isabel e os gêmeos que não tinham para onde ir, foram atrás. E eles viram que estavam comendo uns bolinhos que estavam enrolados em plásticos. Uma das meninas viu que eles observavam e os chamou para dar a eles um bolinho de chuva.\n\n– Eu adoro bolinho de chuva! – disse Isabel.\n\n– Por que você tá dando nossos bolinhos pra eles? – quis saber o menino do estilingue.\n\n– Deixa disso, Alex! Você tem três na mão! – falou a menina mais velha.\n\n– Eu sou a Patrícia, e vocês?\n\nEles se apresentaram e a menina quis saber por que eles estavam vestidos com aquelas roupas. Explicaram sobre o Auto de Natal e que haviam encontrado uma Bíblia e que vieram parar ali porque a atravessaram. Mas Patrícia disse que eles moravam bem longe da cidade e que não conheciam a cidade que eles disseram morar. Os nossos amiguinhos ficaram tristes e sem saber, mais uma vez, o que fazer. Leandro disse que o pai ou a mãe deles poderia pelo menos ligar no celular de seu pai e dizer onde estavam. Porém, Cleidinha, a outra menina, disse que o pai era muito bravo e ia achar ruim deles aparecerem por lá.\n\n– É, meu pai é bravo! É melhor vocês irem embora.\n\n– Mas a gente não sabe pra onde ir! – respondeu Isabel, vendo o menino jogar o plástico que envolvia os bolinhos no riacho. – E não joga o plástico no riacho, seu moleque porco! Você pode matar os peixinhos!\n\n– Ah menina, é melhor vocês irem embora logo daqui senão vão levar umas pedradas – ameaçou Alex.\n\nE para não entrarem em maiores confusões, Otávio, Isabel e Leandro agradeceram pelo bolinho e continuaram a caminhar pela beira do riacho.\n\n– Que moleque mais sem noção, jogando o plástico no riacho. E ainda é mal-educado!\n\n– Deixa pra lá, Isabel. A gente ainda vai encontrar alguém legal que vai ajudar a gente – disse Otávio.\n\nApós a história, perguntar sobre a atitude do menino que queria derrubar o passarinho e da atitude de Otávio ao protegê-lo. Questionar se os catequizandos já presenciaram alguma pessoa ou colega destruindo a natureza e quais foram suas atitudes. Deixar que falem. Dar sequência ao encontro com a dinâmica de observação.\n\nDinâmica: Pedir para que os catequizandos socializem as observações feitas durante a semana nas ruas e quadras que ficaram responsáveis. Depois o catequista explica que todas as constatações serão colocadas em um mapa, com desenhos indicando cada situação. Com isso a turma e toda a comunidade terá uma visão geral de como está o cuidado com o meio ambiente nas suas imediações da comunidade. O catequista então coloca o desenho do mapa com as ruas observadas, e disponibiliza os ícones do \"Mapa Verde\" (ver material de apoio). À medida que os catequizandos vão conhecendo os ícones eles veem se alguém observou aquilo na comunidade. Se sim, cola o ícone no mapa, na rua observada. Dessa forma, terão visualmente um mapa que representa a quadra (coisas boas e ruins de parte do bairro).\n\n*[continuação]*\n\nEsse mapa criado pelos catequizandos poderá ser exposto na celebração ecológica, e apresentado por eles mesmos para os presentes na celebração. Propondo, se possível, uma ação concreta para a comunidade (reciclar o lixo, plantar árvores na frente das casas que não as têm, economizar água, não jogar lixo e entulho em terrenos baldios etc.)\n\nConclusão: Devemos nos comprometer com os problemas existentes em nossa comunidade, quer sejam sociais, ambientais e/ou econômicos. O primeiro passo é termos a consciência deles para, posteriormente, criarmos junto à comunidade projetos que venham a ajudar a construir um local mais harmônico e bonito, tornando-nos sujeitos protagonistas e ativos de uma comunidade mais justa e fraterna em harmonia com o meio ambiente.\n\nImportante: Recordar que o próximo encontro será uma celebração. Pedir para os catequizandos convidarem toda a comunidade, seus pais e padrinhos de Batismo. A celebração poderá acontecer no dia e horário em que a comunidade costuma se reunir para rezar, facilitando assim a sua participação. Nesse sentido, destacar os dados indicados no cronograma sobre o dia, horário e local da celebração, lembrando que não haverá o encontro nessa semana, apesar da celebração ecológica.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra. Unindo-se com os catequizandos a frase do cartaz que está no ambão, e conclui que o que fizeram no encontro de hoje foi justamente o que o cartaz diz: Se cada pessoa fizer a sua parte, com certeza faremos muito mais. De mãos dadas, em sinal de unidade, rezam a oração do Pai-nosso e o catequista conclui com a oração:\n\nSenhor, assim como confiou a Adão o paraíso criado por ti, hoje também nos confia o mundo que habitamos. Com teu auxílio Senhor, nos comprometemos a preservar junto com nossa comunidade esse local na confiança de podermos ter um lugar harmônico de convivência e fraternidade. Ajuda-nos nessa tão importante missão. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... vai em paz, e que o Senhor te acompanhe! Amém\".", "prep": "Ambão com toalha branca, vela, recipiente com água-benta, cartaz com a frase: \"Ninguém é tão bom sozinho quanto todos nós juntos\". Cartolina ou papel-cartão para desenhar o mapa das imediações da comunidade."}, {"id": "e6", "num": 6, "kind": "celebracao", "title": "Celebração ecológica", "when": "Celebração — com a comunidade", "biblia": "", "body": "*(Para a celebração é importante convidar toda a comunidade, os pais e padrinhos de Batismo de cada catequizando).*\n\nPalavra inicial: Esta celebração tem como objetivo refletir sobre a grande importância de se preservar a criação e reconhecer que Deus nos deixou a natureza para que dela cuidássemos. Ainda, deseja-se promover uma integração entre catequese e comunidade, bem como inserir os pais e padrinhos de Batismo na vida da comunidade.\n\nPreparando o ambiente: No centro do espaço celebrativo, uma grande colcha de retalhos ou uma toalha estendida no chão com recipientes com terra, frutas, verduras e legumes, bacia com água, flores, e baldes de materiais recicláveis para ornamentar o espaço e criar um clima alegre e festivo. Saquinhos com água-benta, botões de rosas, mudas de árvores ou sementes para serem distribuídas no final.\n\nDistribuindo funções: Seria importante também distribuir algumas funções com antecedência:\n\n* Animador: para orientar as pessoas durante a celebração.\n* Presidente: de preferência o próprio catequista.\n* Pessoa para proclamar a leitura bíblica.\n* Pessoa para cantar o salmo.\n* Pessoa para fazer a oração da assembleia.\n* Cantores (deverão escolher com antecedência os cantos).\n* Ministros para acolhida (os próprios catequistas ou membros da comunidade).\n\nConforme os fiéis vão chegando e adentram o local da celebração, pode-se cantar um refrão meditativo. Quando todos já se encontrarem acomodados, o animador acolhe calorosamente a todos e os convida a ficar de pé para iniciar a celebração com um canto. Poderá ser o Hino da Campanha da Fraternidade de 2011.\n\nCanto Inicial.\n\nSaudação inicial: Que a graça e a paz de nosso Deus Criador, de Jesus Cristo nosso Senhor e do Espírito Santo nosso santificador, esteja convosco.\n\nR: Bendito seja Deus que nos reuniu no amor de Cristo.\n\nPresidente: Com esta celebração ecológica queremos refletir que Deus nosso Pai criou o céu e a terra e a deu ao homem para que dela cuidasse. Somos responsáveis em cuidar da criação, da mãe terra, casa comum de todos nós, homens e mulheres.\n\nMomento penitencial: Humildemente peçamos perdão a Deus por todas as vezes que não cuidamos da criação:\n\n* Muitas vezes deixamos de te louvar e agradecer pelo presente precioso da mãe natureza. Ref.: Perdão, Senhor! Perdão! Perdão!\n* Muitas vezes, desperdiçamos a água, fonte da vida.\n* Muitas vezes, contribuímos para a poluição da terra, jogando lixo nas vias públicas.\n* Pelas vezes que deixamos de reciclar.\n* Pelas vezes que não testemunhamos Jesus Cristo e não fomos exemplo de cristão.\n\nPresidente: Deus todo-poderoso tenha compaixão de nós, perdoe os nossos pecados e nos conduza à vida eterna. Amém.\n\nAnimador: Podemos nos assentar para ouvir o que Deus tem a nos falar.\n\n1ª Leitura: Gn 2,4b-9.15.\n\nCântico de Daniel: Louvor das criaturas ao Senhor (Dn 3,57-88.56)\n\nRef. Louvai-o e exaltai-o pelos séculos sem fim! ou A Ele glória e louvor eternamente!\n\nObras do Senhor, bendizei o Senhor, louvai-o e exaltai-o pelos séculos sem fim!\nCéus do Senhor, bendizei o Senhor! Anjos do Senhor, bendizei o Senhor! R.\nÁguas do alto céu, bendizei o Senhor! Potências do Senhor, bendizei o Senhor!\nLua e sol, bendizei o Senhor! Astros e estrelas, bendizei o Senhor! R.\nChuvas e orvalhos, bendizei o Senhor! Brisas e ventos, bendizei o Senhor!\nFogo e calor, bendizei o Senhor! Frio e ardor, bendizei o Senhor! R.\nOrvalhos e garoas, bendizei o Senhor! Geada e frio, bendizei o Senhor!\nGelos e neves, bendizei o Senhor! Noites e dias, bendizei o Senhor! R.\nLuzes e trevas, bendizei o Senhor! Raios e nuvens, bendizei o Senhor!\nIlhas e terra, bendizei o Senhor! Louvai-o e exaltai-o pelos séculos sem fim! R.\nMontes e colinas, bendizei o Senhor! Plantas da terra, bendizei o Senhor!\nMares e rios, bendizei o Senhor! Fontes e nascentes, bendizei o Senhor! R.\nBaleias e peixes, bendizei o Senhor! Pássaros do céu, bendizei o Senhor!\nFeras e rebanhos, bendizei o Senhor! Filhos dos homens, bendizei o Senhor! R.\nFilhos de Israel, bendizei o Senhor! Louvai-o e exaltai-o pelos séculos sem fim!\nSacerdotes do Senhor, bendizei o Senhor! Servos do Senhor, bendizei o Senhor! R.\nSantos e humildes, bendizei o Senhor! Jovens Misael, Ananias e Azarias. R.\nLouvemos e exaltemos pelos séculos sem fim!\nBendito sois, Senhor, no firmamento dos céus! Sois digno de louvor e de glória eternamente!\n\n(CNBB, Oração das Horas. Petrópolis: Vozes, 2004).\n\nCanto de Aclamação ao Evangelho.\n\nEvangelho: Mt 6,25-34.\n\nReflexão: Em poucas palavras, mostrar a necessidade de como bons cristãos devem cuidar da criação, como dom precioso de Deus, que merece ser cuidado com responsabilidade e senso fraterno. Destacar a beleza da criação e o ser humano como defensor da vida e das coisas criadas. Tudo existe para trazer alegria ao ser humano, criatura privilegiada e amada por Deus.\n\nApresentação: Neste momento também, ou no final da celebração os catequizandos podem apresentar aos pais e à comunidade o trabalho de campo que fizeram, mostrando o \"mapa verde\" que confeccionaram, identificando pontos de poluição e desperdício, bem como pontos de preservação. Poderá ser sugerido um gesto conc
