reto a todos. Logo após, o presidente convida a todos a ficarem de pé e elevar a Deus preces e louvores.\n\nPreces\n\nPresidente: Elevemos a Deus nossos louvores e pedidos comunitários:\n\nR: Louvado seja nosso Deus, por toda criação!\n\n* Senhor, nós te louvamos pela mãe natureza, e por toda obra da criação.\n* Senhor, dá-nos a coragem de não cruzar os braços diante da destruição de nosso planeta.\n* Senhor, nós te louvamos pela vida e porque nos dás forças para levarmos a alegria a tantos amigos e irmãos nossos.\n* Senhor, nós te louvamos por cuidares de nós com tanto carinho, como cuidas das aves do céu e das flores do campo.", "prep": "No centro do espaço celebrativo, uma grande colcha de retalhos ou uma toalha estendida no chão com recipientes com terra, frutas, verduras e legumes, bacia com água, flores, e baldes de materiais recicláveis para ornamentar o espaço e criar um clima alegre e festivo. Saquinhos com água-benta, botões de rosas, mudas de árvores ou sementes para serem distribuídas no final."}, {"id": "e7", "num": 7, "kind": "encontro", "title": "E em Jesus Cristo, seu único Filho", "when": "Tempo do Natal", "biblia": "Mt 16,13-17", "body": "Palavra inicial: Neste encontro queremos refletir com os catequizandos que Jesus é o Filho de Deus, em sentido único e perfeito, bem como a importância de nosso papel enquanto filhos e filhas adotivos de Deus.\n\nPreparando o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores, cartaz grande com a frase: \"Tu és Messias, o Cristo, o Filho do Deus vivo\".\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., vamos juntos proclamar a nossa fé!\", ou outra semelhante. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas e os convida a se dirigirem até a Mesa da Palavra.\n\nRecordação da vida: Após serem acolhidos, farão uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista inicia a oração valorizando todas as coisas ditas na recordação da vida. Convida-os a juntos rezar a oração do Creio. No final pode rezar a oração:\n\nSenhor, quero com a tua graça poder olhar para mim mesmo. Saber do que sou capaz. Conhecer minhas fraquezas, minhas limitações, mas quero também ser impulsionado por esta força que vem de ti e poder sem medo algum dizer com toda a minha força e a minha vontade: \"Tu és o Messias, o Cristo, Filho do Deus vivo em quem eu acredito\".\n\nO catequista convida a todos a aclamarem o Evangelho com um canto e em seguida convida o catequizando (escalado como leitor do encontro) para se dirigir até o ambão e proclamar o texto indicado.\n\nLeitura do texto bíblico: Mt 16,13-17. Após uns minutos de silêncio, o catequista lê-o novamente, desta vez pausadamente, destacando alguns pontos do texto. *\"[...] Quem as pessoas dizem que é o Filho do Homem? [...]. E vós, quem dizeis que eu sou? [...] Tu és o Cristo, o Filho do Deus vivo...\"*\n\nApós a leitura, todos dirigem-se para a mesa da partilha.\n\nNA MESA DA PARTILHA\n\nPedir aos catequizandos para que reconstruam o texto lido. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após contar a história \"João Batista, o primo de Jesus\", refletindo sobre Jesus, filho único de Deus.\n\nJoão Batista, o primo de Jesus\n\nOs gêmeos Leandro e Otávio, junto a Isabel e Totó, continuavam caminhando na beira do riacho sem encontrar alguém que os ajudasse. Leandro teve a ideia de tentar voar segurando o irmão e a amiga.\n\n– Você não vai dar conta, Leandro!\n\n– Ah, não custa tentar, Otávio. Dá o Totó pra Isabel segurar. Sobe nas minhas costas, Isabel, e segura no meu ombro bem forte e não deixa o Totó cair.\n\nIsabel fez o que ele pediu e ele começou a bater as suas asinhas. Depois agarrou o irmão por debaixo dos braços e saiu voando. Leandro não sabia de onde vinha aquela força, mas estava conseguindo voar levando os dois, mais o cãozinho pelos ares. De novo uma forte ventania começou a soprar e Leandro procurava um lugar seguro para se esconderem. Mas logo o vendaval dissipou e lá do alto eles viram um homem dormindo embaixo de uma árvore. Ele vestia roupas de pele de carneiro, tinha os cabelos e a barba grandes. O homem se assustou quando os viu bem a sua frente. Eles se apresentaram e disseram como haviam ido parar ali e que precisavam de ajuda para voltar pra casa. O homem se apresentou como João Batista e disse não saber como eles podiam voltar pra casa, apesar de achar aquela história bem esquisita, pois ele não sabia o que era uma Bíblia. Entretanto, João Batista disse que era melhor que ficassem ali com ele, pois logo ia escurecer e que era perigoso andarem sozinhos por ali. João Batista teve a ajuda dos meninos na pesca para o jantar. Comeram peixe assado no jantar. E ali, em volta da fogueira, antes de dormir, eles tentaram explicar para João Batista o que era uma Bíblia. E não tinham como deixar de falar que nesse livro sagrado conta-se até a vida dele. Contaram também sobre Jesus, e João Batista começou a achar que eram doidos. Apesar de conversarem sobre a Bíblia, as crianças não contaram toda a história de Jesus, muito menos de João Batista, pois perceberam que ele estava achando que eram malucos. Mas João Batista teve de concordar quando os três falaram que Jesus era o filho de Deus que veio ao mundo para nos perdoar os pecados.\n\n– Sim, isso mesmo. E as gerações futuras haverão de crer, como vocês, que Deus, nosso Pai, é o todo-poderoso e está presente em seu Filho, Jesus Cristo, o nosso Senhor. O que acho estranho é que crianças tão pequenas como vocês já sejam discípulas de Jesus. Quando estiveram com Ele? Tem um longo tempo que não vejo o meu primo.\n\n– A gente nunca esteve com Ele, assim como você. A gente logo logo vai poder estar junto de Jesus quando comungarmos dele na Eucaristia.\n\n– Ixi, Otávio! – disse João, coçando a cabeça. – Eu já não tô entendendo mais nada. É melhor a gente dormir.\n\nE assim, com o silêncio imposto por João, os três trataram de se acomodar por ali em volta da fogueira a fim de dormirem.\n\nApós a história, tentar fazer uma reflexão com os catequizandos que possa levá-los a se questionar quem é Jesus para cada um deles? Qual o conceito que cada catequizando traz consigo sobre a pessoa de Jesus. Seguindo esta linha de raciocínio, esclarecer que Jesus fez esta pergunta a cada um dos seus discípulos e somente Simão Pedro teve a coragem de se atirar à frente e responder. E imediatamente após a resposta de Pedro: “Tu és o Cristo, o Filho de Deus vivo”, Jesus o elogiou pela resposta obtida, mas não deixou de ressaltar que foi pela graça de Deus, pelo dom do Pai que está no céu, que ele fez essa declaração de fé. Comentar que nós também podemos pensar assim. Que a grande graça que temos em nós é a fé. E é essa fé, como presente de Deus que nos impulsiona a declarar sem medo que cremos em Deus, que\n\no amamos. E às vezes até mesmo em momentos de dores e desesperos não temos força para tal declaração, mas quando menos esperamos ela brota em nosso coração, pois, é graça de Deus em nós.\n\nExplicar que o nome “Jesus” foi dado pelo anjo no momento da Anunciação e significa “Deus salva”, exprimindo a identidade e a missão de Jesus de salvar toda a humanidade da morte do pecado. Jesus também é chamado de “Cristo” em grego e “Messias” em hebraico, que significa “ungido”. Jesus é o Cristo porque está consagrado por Deus, ungido pelo Espírito Santo para a missão redentora. Do nome “Cristo” é que nos veio o nome de “cristãos”. Esclarecer que Jesus é o Filho de Deus, em sentido único e perfeito (*1Jo 4,9*). É o “Filho bem-amado” (*Mc 1,11*), segunda pessoa da Santíssima Trindade. Ajudá-los a refletir que às vezes somos fracos, mas Deus nos fortifica. E assim, fortalecidos por Ele, somos capazes de respondermos ao chamado de Deus em nossa vida: Que é ser santo tal como Ele é santo.\n\nConclusão: Precisamos a cada dia reconhecer que Jesus é o nosso único mestre e Senhor. Este nosso encontro nos faz questionar quem é Jesus para cada um de nós e que lugar Ele ocupa em nossa vida. Que possamos pedir a cada dia a graça e o Espírito de Deus, para que tenhamos a coragem de reconhecer Jesus como o Filho de Deus, enviado para salvar a cada um de nós.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e encerra com uma oração final. Não se esquecer de incentivar os catequizandos a formularem orações e preces. Conclui com a oração:\n\nQuerido Pai do céu, hoje nos ensinastes que a força que nos impulsiona vem de ti. Conceda-nos a graça de nunca te abandonar e que a cada dia proclamemos os ensinamentos que teu Filho nos deixou. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: “...N... proclamai com vossa vida que Jesus é o Filho de Deus vivo, vai em paz, e que o Senhor te acompanhe!”\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 422 a 455 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: “...Creio em um só Senhor, Jesus Cristo, Filho Unigênito de Deus, nascido do Pai antes de todos os séculos: Deus de Deus, Luz da Luz, Deus verdadeiro de Deus verdadeiro; gerado e não criado, consubstancial ao Pai. Por Ele todas as coisas foram feitas. E por nós, homens, e para nossa salvação, desceu dos céus...”.\n\nLembrete\n\nPropomos que os encontros de catequese tenham um período de RECESSO nas próximas semanas. O tempo variará de acordo com o Calendário Litúrgico. Para programar-se pegue o calendário do ano em decurso e veja o dia em que será celebrada a Quarta-feira de Cinzas. Na semana que antecede a Quarta-feira de Cinzas deverá ser realizado o 8º Encontro. O período entre o 7º e o 8º encontros, será o período de recesso da catequese. Porém, o catequista poderá usar outro critério que for mais conveniente à realidade pastoral da comunidade.", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores, cartaz grande com a frase: \"Tu és Messias, o Cristo, o Filho do Deus vivo\"."}, {"id": "e8", "num": 8, "kind": "encontro", "title": "Nosso Senhor", "when": "Tempo do Natal", "biblia": "Mt 28,16-20", "body": "Palavra inicial: Nesse encontro vamos refletir com nossos catequizandos que professar que Jesus é nosso Senhor, é crer em sua divindade. É acreditar que Jesus é Deus, segunda pessoa da Santíssima Trindade. Queremos ainda falar da Santíssima Trindade e as três pessoas que a compõem.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e cartaz contendo ícone da Santíssima Trindade. Disponibilizar também papel, lápis e borracha para a dinâmica.\n\nImportante: Deverá ser utilizado um ícone da Trindade, onde as três pessoas da imagem são iguais. Não colocar a imagem de Deus Pai como um velho ou imagem do “Divino Pai Eterno”. O ícone é somente para ilustrar que as três pessoas da Trindade é um único Deus em três pessoas.\n\nAcolhida: O catequista acolhe os catequizandos, saudando a cada um com a frase: “Seja bem-vindo... N..., templo vivo do Senhor”. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Após serem acolhidos, ao redor da Mesa da Partilha ou da Mesa da Palavra, fazer uma retrospectiva da semana, pedindo para que partilhem o que cada um experienciou nesse período. Poderão destacar, ainda, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista motiva a oração inicial pedindo o Espírito Santo. Depois pode rezar o Credo e conclui com a oração:\n\nSenhor nosso Deus, estamos aqui reunidos para te louvar e agradecer. Queremos estar com nossos corações abertos para acolher não três deuses, mas um só Deus em três pessoas: O Pai, o Filho e o Espírito Santo. Derrama sobre nós o teu Espírito para podermos compreender tão rico mistério.\n\nO catequizando escalado como leitor do encontro aproxima-se do ambão e proclama o texto indicado. Antes, porém, todos poderão cantar aclamando o santo Evangelho.\n\nLeitura do texto bíblico: *Mt 28,16-20*. Depois de um período de silêncio o catequista lê o texto novamente, desta vez pausadamente, e destacando alguns pontos.\n\n“[...] Toda a autoridade foi dada no céu e na terra. Ide, pois, fazei discípulos meus todos os povos, batizando-os em nome do Pai, e do Filho, e do Espírito Santo...”\n\nApós a leitura todos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir com os catequizandos o texto bíblico proclamado. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nDepois contar a história “Em nome do Pai, e do Filho, e do Espírito Santo”, refletindo sobre a Santíssima Trindade.\n\nEm nome do Pai, e do Filho, e do Espírito Santo\n\nNo outro dia, Leandro, Otávio e Isabel acompanharam João Batista até o Rio Jordão. Lá ouviram João falar sobre Jesus e o Reino de Deus a algumas pessoas. E ele não deixava de dizer que deveriam se arrepender dos pecados e serem batizadas. Umas cinco pessoas quiseram receber o batismo de João ali naquelas águas. Um casal que havia sido batizado convidou João Batista para almoçar, e esse pediu que as três crianças o acompanhassem. E ele as apresentou como pequenos discípulos de Jesus, que eles conheciam muito mais o nosso Senhor do que muitos adultos, e que o casal se espelhasse neles e buscasse conhecer e seguir os seus ensinamentos.\n\nDepois do almoço João escutou as crianças conversarem sobre batizado, sobre padrinhos e madrinhas. Ele ouviu os gêmeos dizerem que os seus padrinhos e madrinhas de Batismo não eram os mesmos, e aí ele saiu de trás da árvore e entrou na conversa.\n\n– Vocês receberam o Batismo?\n\n– Sim, a gente é batizado, João – respondeu Leandro.\n\n– Só que o nosso batismo foi bem diferente desses que você realizou – falou Isabel.\n\n– Diferente em quê?\n\n– Você não acredita que a gente é do futuro. Mas, no futuro, as crianças são batizadas só que na igreja ou numa capela. Não é num rio. E o padre joga água na cabeça das crianças, dizendo: eu te batizo em nome do Pai, e do Filho, e do Espírito Santo.\n\n– Não entendi – disse João, coçando a cabeça.\n\nE Otávio tentou explicar que essa frase dita durante o batismo são palavras que Jesus disse antes de subir ao céu, antes de Ele voltar pra casa do seu Pai. João não entendia por que para ele, que vivia na época de Jesus, o Cristo ainda nem tinha morrido, muito menos ressuscitado, sendo difícil para ele compreender. Entretanto, João Batista entendeu que o Pai, o Filho e o Espírito Santo formavam a Santíssima Trindade, e que mesmo sendo três, eram um só Deus, porque o Filho é o Deus que se fez homem, e que o Espírito Santo é a força e a bênção de Deus que permanece com todos aqueles que acreditam e aceitam recebê-la.\n\nAo final da história questionar os catequizandos se eles já ouviram falar da “Santíssima Trindade” e se eles saberiam explicar. Dizer que ao professar a fé, e proclamar que Jesus é “Nosso Senhor”, é confessar ou invocar Jesus como Senhor, é crer em sua divindade, na sua soberania enquanto Deus. “Ninguém pode dizer Jesus é o Senhor a não ser no Espírito Santo.” Jesus, sendo filho de Deus, é a segunda pessoa da Santíssima Trindade.\n\nMostrar o cartaz com o ícone da Santíssima Trindade aos catequizandos, interrogando-os quais dos personagens do cartaz eles acham que é o Pai, o Filho e o Espírito Santo. Por que acham que são essas imagens que representam essas pessoas (Qual o critério utilizado para chegar a essa conclusão?). Será que existe alguma hierarquia? (Algum deles é mais importante? Se sim, como se dá essa ordem?). Nesse momento, o catequista os interroga, para ter uma ideia do que os catequizandos já sabem sobre esse mistério da Trindade, deixando-os falarem.\n\nDinâmica: Dividir a turma em três grupos. Esses grupos deverão ficar em locais afastados um do outro, de forma que não se comuniquem. É entregue uma folha de sulfite para cada grupo, juntamente com lápis e borracha. O catequista vai a cada grupo e orienta-o um por vez. Detalhe: Nenhum grupo deve saber o que o outro grupo fará. Ao primeiro grupo é solicitado desenhar uma cabeça. Nessa cabeça terá o rosto composto por olhos, nariz, boca, orelha e cabelo. No segundo grupo orientar para desenhar o tronco e membros superiores do corpo humano (composto por peito, barriga, braços e mãos). Ao terceiro grupo para desenhar os membros inferiores (pernas e pés) do corpo humano. Dá-se um tempo para que o desenho seja feito. Cada grupo no seu canto, sem se comunicar com os demais.\n\nDepois disso, deverá ser montado o corpo humano com suas três partes: cabeça, tronco e pernas. Como não houve comunicação, as partes do corpo que foram desenhadas serão desproporcionais: Talvez uma cabeça grande para uma perna pequena, ou os braços e mãos grandes para uma cabeça pequena. O catequista verifica com a turma que o corpo é constituído por essas três partes e que todas são importantes, pois formam o corpo humano. Explorar que dessa forma podemos nos orientar para entendermos um pouco sobre esse grande mistério da Santíssima Trindade. A Santíssima Trindade é constituída de três pessoas (Pai, Filho e Espírito Santo), assim como o corpo (cabeça, tronco e membros), porém essas três pessoas, que são juntas e unidas, formam uma só Trindade, não três deuses diferentes. No nosso desenho essas partes ficaram desproporcionais, porém isso não acontece com a Trindade. A Trindade é Una. O Pai é aquilo que é o Filho, o Filho aquilo que é o Pai, o Espírito Santo aquilo que são o Pai e o Filho, isto é, um só Deus por natureza. Não há quem seja maior ou menor, todos iguais. Neles não há divergência de pensamento.\n\nConclusão: O catequista orienta os catequizandos a estarem em comunhão uns com os outros. Esse é o exemplo que aprendemos junto à Trindade Santa. Conservamos nossa individualidade para servir e não para nos distanciar das pessoas. Procuremos nos conhecer melhor e pensar durante essa semana: Sendo como sou, como posso contribuir para com as pessoas?\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra. Incentiva-os a fazer preces e orações de louvor. Poderá encerrar com a Profissão de Fé e com a oração:\n\nSenhor, Deus único, mas não solitário. Pois tudo é uno (único) neles. Não se encontra a oposição de relação. Por causa desta Unidade, o Pai está todo inteiro no Filho, todo inteiro no Espírito Santo. O Filho está todo inteiro no Pai, todo inteiro no Espírito Santo. O Espírito Santo todo inteiro no Pai, todo inteiro no Filho. E nós, enquanto parte dessa comunidade que vive sob a orientação da Trindade, ajudai-nos a estar sempre unidos: Entre nós e junto a ti. Por Cristo nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: “...N... vai em paz, e que o Senhor te acompanhe! Amém”.", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e cartaz contendo ícone da Santíssima Trindade. Disponibilizar também papel, lápis e borracha para a dinâmica."}, {"id": "e9", "num": 9, "kind": "encontro", "title": "Que foi concebido pelo poder do Espírito Santo", "when": "Tempo do Natal", "biblia": "Lc 1,30-35", "body": "Palavra inicial: Queremos neste encontro refletir sobre o mistério da encarnação. Por ação do Espírito Santo o Filho de Deus se fez homem.\n\nPreparando o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores, cartaz grande com a frase: “Que foi concebido pelo poder do Espírito Santo”. Também poderá ter uma imagem do Menino Jesus.\n\nAcolhida: O catequista acolhe os catequizandos, dizendo-lhes: “Deus se fez homem ...N..., seja bem-vindo!” Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas e os convida a se dirigirem até a Mesa da Palavra.\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra, fazer uma breve recordação dos fatos ocorridos durante a semana.\n\nNA MESA DA PALAVRA\n\nOração inicial: Ao redor da Mesa da Palavra, o catequista inicia a oração valorizando todas as coisas ditas na recordação da vida. No final pode rezar a oração:\n\nPai bondoso, queremos te agradecer porque, quando chegou a hora certa, Tu enviastes o teu Filho Jesus a esta terra para fazer morada no meio de nós. Por isso, convidaste a Maria de Nazaré para ser Mãe, e a José para ser o seu Pai adotivo. Jesus, ensina-nos a dizer sim para ti, como fez Nossa Senhora. Amém.\n\nTodos poderão aclamar o Evangelho com um canto, e em seguida o catequista convida o catequizando (escalado como leitor do encontro) para se dirigir até o ambão e proclamar o texto indicado.\n\nLeitura do texto bíblico: *Lc 1,30-35*. Após uns minutos de silêncio, o catequista lê-o novamente, desta vez pausadamente, destacando alguns pontos do texto.\n\n“[...] Eis que conceberás e darás à luz um filho e lhe porás o nome de Jesus. [...] O Espírito Santo virá sobre ti, e o poder do Altíssimo te cobrirá com sua sombra [...]”\n\nApós a leitura, todos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nPedir aos catequizandos para que reconstruam o texto lido. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nLogo após contar a história “Deus é demais”, refletindo sobre a escolha de Maria e a ação do Espírito Santo. Refletindo que Jesus é humano e divino.\n\nDeus é demais\n\nCerta tarde os nossos amiguinhos Isabel, Leandro e Otávio brincavam com Totó embaixo de uma árvore. Estava um dia bem quente, mas, como estavam próximos de um rio, ventava bastante, e ali embaixo, na sombra da árvore, estava bem fresquinho. Leandro, vendo que não havia ninguém por perto, balançava as suas asinhas para fazer mais vento na cara do cãozinho.\n\n– Para com isso, Leandro! O Totó não gosta! Olha como ele fica nervoso! – disse o irmão gêmeo.\n\nMas Leandro nem se importou, apenas dava gargalhadas enquanto o cachorro latia. Até que Otávio pegou Totó, acabando com aquilo. E aí Leandro se sentou e aquietou-se. Porém, refletiu e comentou:\n\n– Eu queria ser anjo pro resto da vida. Será que, quando a gente voltar pra casa, vou continuar podendo voar?\n\n– Eu acho que não! – respondeu Isabel.\n\n– Também acho que não. Você não é anjo de verdade. Como que ia continuar sendo anjo? Só aqui mesmo!\n\n– Ah, mas eu gostaria de ser anjo... Ou melhor, ser arcanjo, que nem Gabriel, Rafael e Miguel. Imagina que emoção que o Arcanjo Gabriel sentiu ao dizer pra Maria que ela tinha sido a escolhida para ser a mãe do Messias?\n\n– Hum... deve ter sido demais presenciar aquele momento! – exclamou Isabel – E como Maria deve ter se sentido, né? Deve ter ficado muito feliz! E ainda mais porque ela ficou cheia do Espírito Santo de Deus.\n\n– Imagina se fosse você heim, Isabel. Eu chegava e dizia: Ave Isabel, cheia de graça! Você foi a escolhida para ser a mãe do salvador! E não precisa ficar com medo, pois o Espírito Santo vai cuidar de você e dessa gravidez!\n\nE Isabel, vendo que ele falava como se fosse o Arcanjo Gabriel, entrou na brincadeira e também encenou:\n\n– Que seja feita a vontade de Deus! – e ajoelhou-se.\n\nE Otávio falou:\n\n– O que é mais “dá hora” é que Jesus é humano e divino! Que coisa mais incrível isso! Ele é divino porque é filho de Deus e é humano porque nasceu de uma mulher. Deus é demais!\n\n– Ei, meninos! Ou! – chamava João Batista ao longe.\n\n– É o João Batista! Ele tem alguma coisa na mão – disse Isabel.\n\n– Tomara que seja comida! – disse Otávio.\n\nE Totó latiu como se tivesse concordado. E os três foram ao encontro de João Batista. E para a alegria deles, de fato, João estava com comida.\n\nO catequista pode fazer uma reflexão tendo como pano de fundo que Deus não desiste de agir para que o mundo encontre a paz. Para isso pediu a uma jovem simples de uma pequena cidade, que se chamava Maria, para que fosse a mãe do filho de Deus. E esta se abriu à ação do Espírito Santo e a fez gerar um Filho, o prometido pelo Pai. Comentar que o mundo no qual vivia Maria era cercado de sofrimento e maldade, e esperavam o messias, o salvador do mundo para mudar toda situação de injustiça e desigualdade. Maria sempre ouvira dizer que um dia Deus enviaria o Salvador, mas não sabia que ela seria a escolhida. E um belo dia recebe a notícia que ela seria a colaboradora deste plano de salvação.\n\nExplicar que, por ação do Espírito Santo, a terceira pessoa da Santíssima Trindade, Maria fica grávida. Maria concebe o Filho de Deus. Esse mistério é chamado de “encarnação”: Admirável união da natureza divina e da natureza humana na única Pessoa divina do Verbo. Para realizar a nossa salvação, o Filho de Deus se fez “carne”, se fez homem. Maria não compreendeu como poderia ser mãe, pois não era casada, era apenas noiva de José. O anjo explica que seria pela força do Espírito Santo que ela teria um filho e lhe daria o nome de Jesus. Não podendo deixar de lembrar também o grande papel de José em aceitar Maria como sua esposa, mesmo não sendo casados. Mas o texto relata a sua justiça, e diz que ele não quis difamar a jovem, e a aceita como obra de Deus.\n\nConclusão: Devemos pensar que nem sempre estamos preparados para desempenhar tal missão no Reino de Deus. Mas, assim como Deus escolheu uma jovem simples, humilde e a capacitou pela força do Espírito Santo para gerar o seu Filho, Deus também pode nos escolher para sermos anunciadores deste grande mistério da encarnação, e fazer com que todos os homens cheguem ao conhecimento da verdade: Cristo viveu, morreu e ressuscitou por todos os povos. Nossa missão deve ser incansável. E se porventura nos cansarmos, devemos clamar o Espírito Santo para que gere Jesus em nós, em nossos lábios, em nosso coração, em nossa mente, e assim consigamos com alegria dizer a todos que Jesus vive e é o Senhor.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e os incentiva a formularem orações e preces. Depois, conclui com a oração:\n\nPai de Jesus e nosso Pai, ao escolher Maria para ser a Mãe de Cristo, Tu pensaste em todos nós. Por isso queremos te pedir a graça de sermos fiéis anunciadores desta Boa Notícia. Conceda-nos a força incansável do teu Espírito Santo a cada um de nós. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: “...N..., tu és colaborador da graça de Deus, vai em paz, que o Senhor te acompanhe!”\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 456 a 570 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: “...e se encarnou pelo Espírito Santo, no seio da Virgem Maria e se fez homem...”.", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores, cartaz grande com a frase: “Que foi concebido pelo poder do Espírito Santo”. Também poderá ter uma imagem do Menino Jesus."}, {"id": "e10", "num": 10, "kind": "encontro", "title": "Nasceu da Virgem Maria", "when": "Tempo do Natal", "biblia": "Mt 1,18-23", "body": "Palavra inicial: Neste encontro valorizaremos a pessoa de Maria. Sua história e importância na vida da Igreja, como mãe do Salvador.\n\nPreparando o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, imagem ou cartaz com a foto de Maria e cópias da oração da Ave-Maria. Para a dinâmica: folhas de sulfite e canetas.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os: “Salve Maria ...N..., seja bem-vindo!” e conduzindo-os para dentro da sala. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Após serem acolhidos, o catequista os convida a ficar ao redor da Mesa da Partilha ou da mesa da Palavra onde farão uma retrospectiva da semana. O catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista motiva a oração inicial, invocando o Espírito Santo. Se oportuno, reze o Credo, e encerra com a oração:\n\nSenhor Jesus, estamos aqui reunidos novamente para podermos conhecer mais da sua vida e procurar imitá-la. Mesmo sendo filho de Deus, também quis ser semelhante a nós, tendo uma família. Agradecemos a Deus por escolher Maria, mulher tão pura e cheia de graça, que também nos acolhe como filhos.\n\nO catequizando (escalado como leitor do encontro) aproxima-se do ambão e proclama o texto indicado. Antes da proclamação, todos poderão aclamar o Evangelho com um canto.\n\nLeitura do texto bíblico: *Mt 1,18-23*. Depois de um período de silêncio, o catequista lê o texto novamente, desta vez pausadamente, e destacando alguns pontos.\n\n“[...] Maria, sua mãe [...] ficou grávida do Espírito Santo. [...] Eis que a Virgem conceberá e dará à luz um filho, e o chamarão com o nome de Emanuel, que significa: Deus conosco.”\n\nApós a leitura todos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nNa Mesa da Partilha, reconstruir junto aos catequizandos o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Contar a história “O nascimento de Jesus”, frisando a história de Maria, seus pais e por que foi escolhida.\n\nO nascimento de Jesus\n\nOs nossos amiguinhos continuavam na companhia de João Batista. Não entendiam como haviam ido parar ali, em sua companhia, muito menos como é que iam conseguir voltar para casa, pois ninguém acreditava que eram crianças que viajaram no tempo. E os gêmeos e Isabel acharam estranho porque o tempo se misturava. Sempre depois de um vendaval encontravam pessoas, e há alguns dias nenhuma nova ventania tinha os pegado. Numa noite fria, escondidos numa caverna e em volta de uma fogueira, João Batista disse que Isabel tinha o mesmo nome de sua mãe. E ela disse que sua avó tinha o nome da mãe de Jesus, Maria. E João disse que Maria também é um nome muito bonito. Disse ainda que a Maria, mãe de Jesus, era uma mulher que todo mundo tinha que respeitar, pois tinha sido a escolhida para ser a mãe do Filho de Deus. As crianças disseram que, antes de encontrarem a grande Bíblia nos fundos da igreja, eles se preparavam para encenar justamente as cenas em que Maria era a escolhida por Deus, e que ficava sabendo por meio do Arcanjo Gabriel, e que depois iam encenar o nascimento de Jesus.\n\n– Por isso que nós estamos com essas roupas, João. Eu ia ser o Arcanjo Gabriel, e o meu irmão seria o José e a Isabel seria a Maria – explicou Leandro.\n\n– Só que, quando a gente atravessou a Bíblia, as coisas ficaram esquisitas. A gente tá viajando no tempo e as minhas asas se mexem, posso até voar.\n\n– Ah, sobre encenarem a história do nascimento de Jesus e a escolha de Maria, tudo bem, mas as suas asas mexerem? Eu e todo mundo temos achado estranho mesmo você viver fantasiado de anjo.\n\n– Elas se mexem, sim, veja! – disse Leandro, mexendo as asinhas e se levantando do chão.\n\n– Meu Deus do céu! – exclamou João, levando a mão à boca, surpreso.\n\n– João, deixa a gente encenar pra você o teatrinho que a gente ia apresentar?\n\nJoão apenas consentiu com a cabeça para Isabel. E os três encenaram de forma simples, mas com muita emoção, o momento em que Maria recebia a visita do arcanjo que lhe anunciou que havia sido a escolhida entre todas as mulheres do mundo para dar à luz ao Deus que se queria fazer homem e viver entre nós falando e ensinando sobre o Amor, porque só quem ama de verdade poderia retornar à casa de Deus.\n\n– Você é a preferida de Deus, Maria! O céu tá esperando você dizer sim para se fazer festa! – dizia Leandro, batendo as asinhas e quase tocando o teto da caverna.\n\nDepois, Otávio e Isabel encenaram José e Maria procurando um lugar para Maria dar a luz, até que encontraram uma gruta e lá, por meio do Espírito Santo, Maria trouxe ao mundo Jesus Cristo, o salvador. João se emocionou ao ver crianças tão devotas. E Totó parecia entender a grandeza daquela encenação e daquele momento, pois também assistiu atento à encenação das crianças.\n\nApós a história conversar com os catequizandos sobre a vida de Maria, falando de seus pais e avós de Jesus. Refletir a importância de Maria para a Igreja e para a nossa fé, relembrando alguns momentos em que consta na Bíblia a sua participação.\n\nO nascimento da Mãe de Deus\n\nHá poucos registros sobre a história e vida de Maria, mas algumas tradições e costumes, além de alguns relatos bíblicos, nos dizem que:\n\n* Joaquim e Ana são os pais de Maria (avós de Jesus).\n* A Igreja celebra o nascimento de Maria no dia 8 de setembro, comemoração que remonta o século V.\n* Maria nasceu de um milagre, já que seus pais tinham idade avançada.\n* Aos 3 anos, Maria é apresentada no Templo, foi escolhida.\n\nonde permaneceu até os 12 anos, quando faleceu seu pai Joaquim. Esse fato não é comprovado canonicamente, somente é narrado em alguns escritos apócrifos. Porém, a Igreja inseriu no Missal Romano este dia litúrgico (21 de novembro) para recordarmos que antes mesmo do Mestre vir ao ventre de Maria, Ela já o tinha em sua mente, em seu coração, em sua espiritualidade como discípula e depois como mãe de Deus. A Igreja ainda celebra a \"Anunciação\" feita pelo anjo (25 de março). Maria confia cegamente e diz \"sim\", sem se importar com noivado; rigidez da época. Ainda noiva, Maria confia o segredo da sua gravidez a José; São José, como era justo, prepara-se para abandonar Maria em silêncio – não deseja denunciá-la. Em sonho José descobre que Maria seria mãe do Messias. Em algumas passagens bíblicas, o Evangelho cita Maria: Anunciação (Lc 1); Nascimento de Jesus, adoração dos pastores e magos (Lc 2,1-2); Apresentação do Menino Jesus no Templo (Lc 2,22-38); A perda e o encontro de Jesus no Templo (Lc 2,4); Meditando silêncio (Lc 2,51); Nas Bodas de Caná na Galileia (Jo 2,1-11); Ao pé da cruz, quando Cristo presenteia Maria como mãe da humanidade e a humanidade à sua filiação (Jo 19,26-27); Pentecostes: A vinda do Espírito Santo e a fundação da Igreja cristã (At 1,14). Cada catequizando poderá procurar uma dessas passagens em sua Bíblia e ler em silêncio ou em voz alta, e depois comentar a passagem com a turma. Não é necessário ler todas, pois o tempo não permitiria; somente algumas para fundamentar o encontro. Não há registros históricos do momento da morte de Maria. Diz a tradição que ela teria morrido (Dormição da Virgem Maria) no ano 42 d.C. A Igreja comemora no dia 15 de agosto o dogma da assunção de Maria, Maria que é elevada ao céu. Hoje Maria é conhecida no mundo todo e invocada com diversos títulos: N. Sra. Aparecida, N. Sra. do Rosário, N. Sra. de Fátima, N. Sra. de Guadalupe etc. Os catequizandos poderão ser incentivados a citar outros títulos da devoção mariana, porém deve-se deixar claro que, apesar de ser conhecida por diversos nomes, é a mesma mulher: Maria, mãe de Deus. Dinâmica: O catequista deverá pegar a imagem ou cartaz de Maria que está no ambão e apresentar aos catequizandos. Comentar que Maria era uma mulher comum, simples, mas que, com sua vida e testemunho de pureza e vida de oração, encontrou a graça do Senhor e foi escolhida por Deus. Em seguida o catequista convida os catequizandos a fazerem um acróstico com o nome de Maria. Para isso distribuir folhas sulfite para cada catequizando e orientar para escrever o nome de Maria na vertical e em seguida, para cada letra do seu nome, escrever, ao lado, palavras ou frases que retratem características de Maria, suas virtudes, seu modo de agir, entre outros. Exemplo: M - Mãe; A - Amável; R - Religiosa; I - Incomparável; A - Abnegada. Poderá ter várias palavras através da mesma letra. Enquanto a atividade é realizada, pode-se colocar um canto de Nossa Senhora de fundo. Quando todos terminarem, poderão partilhar o que cada um escreveu.\n\nConclusão: Os catequizandos deverão ter o conhecimento da vida de Maria e ciência da sua importância para a missão de Jesus e para a nossa fé. Deverá ser reforçado que Maria também é nossa Mãe e roga/intercede por nós junto ao seu Filho. Como gesto concreto poderá ser distribuída uma passagem bíblica que fala de Maria a cada catequizando e pedir que eles leiam e reflitam em casa. Poderá também convidar aos catequizandos que rezem essa semana pelos seus avós, pedindo a intercessão de Joaquim e Ana.\n\nOração final: Poderá ser rezada a oração da Ave-Maria, sendo repetida por todos os catequizandos. Poderá ainda ser entregue cópia dessa oração a cada catequizando. Rezar em especial por todas as famílias e concluir com a oração:\n\nDeus Pai de bondade, te louvamos e agradecemos por nos dar Maria como nossa mãe. Pedimos que, por intercessão de nossa mãe santíssima, e por Joaquim e Ana, possas abençoar nossas famílias, protegendo-as de todo o mal, e que saibamos receber Maria como nossa mãe e intercessora. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... vai em paz, e que o Senhor te acompanhe! Amém\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, imagem ou cartaz com a foto de Maria e cópias da oração da Ave-Maria. Para a dinâmica: folhas de sulfite e canetas."}, {"id": "e11", "num": 11, "kind": "encontro", "title": "Padeceu sob Pôncio Pilatos", "when": "Quaresma", "biblia": "Mc 15,1-15", "body": "Palavra inicial: Neste encontro queremos refletir com nossos catequizandos que Jesus foi julgado e condenado à morte inocentemente, bem como fazê-los refletir que ainda hoje podemos julgar e fazer mal juízo das pessoas pelo simples fato de não as conhecermos.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e flores.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e desejando-lhes boas-vindas: \"Seja bem-vindo ...N..., filho amado do Pai\".\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra, já em clima de oração, fazer uma retrospectiva da semana. Poderão destacar os acontecimentos importantes que possam ter ocorrido na comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração de uma maneira bem espontânea onde depois poderá cantar ou rezar, invocando o Espírito Santo: \"Vinde, Espírito Santo, enchei...\" Todos poderão aclamar o Evangelho com um canto. Em seguida o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Mc 15,1-15. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] levaram Jesus amarrado e o entregaram a Pilatos. [...] Os sumos sacerdotes o acusavam de muitas coisas. [...] Pilatos, querendo agradar o povo, soltou-lhes Barrabás. Quanto a Jesus, depois de tê-lo mandado açoitar, entregou-o para ser crucificado.\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir o texto bíblico junto aos catequizandos. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Após reconstruírem o texto bíblico o catequista conta a história \"Jesus é condenado por dizer a verdade\", enfatizando o julgamento e a mentira por causa da inveja.\n\nJesus é condenado por dizer a verdade\n\nDepois da encenação do nascimento de Jesus a João Batista, nossos amiguinhos Otávio, Leandro e Isabel dormiram. O cãozinho Totó preferiu dormir junto a João Batista, já que estaria mais quentinho durante a noite em razão da roupa dele ser feita de couro de animais.\n\nNo dia seguinte, eles acordaram e levaram um susto. Na caverna havia uma neblina muito densa e não conseguiam enxergar nada. Totó começou a latir.\n\n– Vem aqui, Totó! – chamava Otávio.\n\nMas o cãozinho não parava de latir. Por fim, a neblina foi sumindo e eles notaram que João Batista não estava ali.\n\n– Aonde será que o João foi? – perguntou Isabel.\n\n– Talvez foi cuidar de preparar o nosso café da manhã – respondeu Leandro.\n\nEles saíram da caverna e não viram sinal de João Batista. Parecia que ele havia sumido com aquela neblina. Logo abaixo da montanha, eles encontraram algumas mulheres que andavam depressa pela estrada. Eles perguntaram se conheciam João Batista e elas se assustaram.\n\n– Queridos, João Batista, infelizmente, morreu há algum tempo. Injustamente, mas morreu.\n\n– Como assim? A gente tava com ele até ontem à noite! – respondeu Otávio, com Totó no colo.\n\n– Essas crianças – cochichou uma das mulheres – devem estar delirando de tanta fome. Dá a eles um pedaço de pão.\n\nEntregaram, então, pão às crianças, que comeram e agradeceram. Em seguida, duas outras mulheres acompanhadas de um jovem vinham pela estrada apressados e chorando. As mulheres que já estavam ali reconheceram ser Maria, a mãe de Jesus, Maria Madalena e João, um dos apóstolos do Cristo.\n\n– Maria! – chamou uma das mulheres – Estamos indo para Jerusalém também. Ficamos sabendo há pouco que prenderam Jesus injustamente.\n\nAs crianças se olharam surpresas por estarem diante da mãe de Jesus. E resolveram segui-las até Jerusalém. No caminho os três concordaram que as coisas ali estavam muito estranhas, e que o tempo corria como o vento. Num dia estavam com João Batista, e no outro já estavam junto da mãe do Senhor indo a Jerusalém, cidade em que ele estava preso.\n\nEles chegaram num grande pátio repleto de pessoas, e no alto de uma escada viram Jesus ser julgado por Pôncio Pilatos. Jesus estava amarrado e machucado. Pilatos lhe fizera muitas perguntas por causa das acusações falsas que alguns dos sacerdotes fizeram contra Ele. E querendo agradar a multidão, perguntou se queriam que soltassem Jesus ou o violento ladrão Barrabás. As mulheres, João e as crianças gritavam o nome de Jesus, mas a maioria gritava pedindo que Barrabás fosse liberto. E assim Pilatos consentiu e Barrabás foi solto. Depois, mandou açoitar Jesus e depois o crucificarem.\n\nMaria, a mãe de Jesus, chorava muito. Era difícil para ela ver seu filho ser julgado por tanta mentira e ainda saber que Ele morreria pregado numa cruz. As crianças não viram Jesus apanhar, mas escutavam os gritos da multidão que assistia e os gritos de indignação de algumas mulheres. E Jesus tinha sido preso porque alguns dos sacerdotes do Templo estavam com inveja e medo de perderem o seu poder, já que Jesus dizia ser o Filho de Deus, o Messias esperado. E morrer numa cruz era um grande castigo naquela época.\n\n– Não dá para acreditar que essa multidão, que ouvia e seguia o Mestre, hoje é a mesma multidão que se alegra com essa injustiça contra Ele – disse João às crianças, quando se reencontraram.\n\n– E agora, João, o que vão fazer com Jesus?\n\n– Ai Isabel, até parece que você não conhece a história – cochichou Otávio no ouvido dela.\n\n– Vão crucificar o Mestre! E crianças, não acompanhem essa multidão. É perigoso, vocês podem ser pisoteadas. Venham, vou levar vocês para um local seguro, depois vou me encontrar com Maria e Maria Madalena.\n\nE Isabel, Leandro, Otávio e Totó seguiram João.\n\nO catequista esclarece os catequizandos sobre quem foi Pôncio Pilatos e o que ele representava naquela época (autoridade suprema, o poder romano). Esclarece que Jesus passou por um julgamento e, considerado culpado, teve por penitência a morte de cruz (tirania sobre os judeus).\n\nQuestionar junto aos catequizandos se o julgamento de Jesus foi justo. Ele realmente era culpado? Qual crime que cometeu? Por que então foi condenado? Levar à reflexão que muitas vezes também podemos cometer um julgamento errado diante das coisas e pessoas.\n\nDinâmica: Apresentar a imagem (velha/moça) indicada onde se pode encontrá-la no material de apoio e perguntar aos catequizandos o que eles enxergam. Algumas dirão que é uma moça, outros verão a imagem de uma velha. O que ocorre é que, dependendo da forma e ângulo que se enxerga a imagem oferecida, ela realmente tem essas duas faces. Ora se apresenta em forma de moça, ora de velha. Isso nos leva a crer que nem sempre temos uma percepção clara e certa de uma situação. A mesma situação pode ser analisada de forma diferente pelas pessoas. Daí termos a humildade de reconhecer que o nosso ponto de vista, nosso julgamento nem sempre estará correto. Existe a interpretação do \"outro\" e que também deve ser levada em consideração. O catequista poderá interrogar os catequizandos se eles já tiveram alguma experiência de interpretar algo ou imaginar algo de alguém e depois descobrirem que estavam errados. Compartilhar essas experiências.\n\nConclusão: Vimos no encontro de hoje que Jesus não julgava. Ele amava e acolhia as pessoas que encontrava em seu caminho. Muitas vezes podemos ter a tendência de um olhar de discriminação e julgamento errôneo das pessoas e de algumas situações. Peçamos a orientação do Pai Celeste para sermos justos e termos um olhar de acolhimento e compreensão diante dos acontecimentos.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra, onde motiva-os a formularem orações e preces pedindo pelos injustiçados e discriminados de nossa sociedade. No final de cada invocação todos respondem: \"Senhor, escutai a nossa prece\". O catequista convida a todos a rezarem o Credo e conclui com a oração:\n\nSenhor, somos frágeis e pecadores. Muitas vezes nos deixamos guiar pelo nosso olhar de discriminação e julgamos pessoas e acontecimentos. Nós vos pedimos um coração semelhante ao vosso que acolhia e amava, sem julgar e recriminar a nada e ninguém. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... vai em paz, que o Senhor te acompanhe! Amém\".\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 571 a 630 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: \"...Também por nós foi crucificado sob Pôncio Pilatos, padeceu e foi sepultado...\";\n* Imagem da moça/velha: Procurar em sites de ilusão de ótica ou em sites de buscas, imagens, digitar: moça/velha – ilusão de ótica.", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e flores."}, {"id": "e12", "num": 12, "kind": "encontro", "title": "Foi crucificado, morto e sepultado", "when": "Quaresma", "biblia": "Mc 15,42-47", "body": "Palavra inicial: No encontro de hoje queremos refletir sobre a decepção de ser traído por alguém, principalmente se este for do nosso convívio. Meditar ainda que a CRUZ não é causa de escândalo, mas instrumento de salvação. Cristo morreu para salvar a todos nós por amor. Jesus assume o pecado dos homens e nos santifica.\n\nPreparando o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e um crucifixo.\n\nAcolhida: O catequista acolhe os catequizandos, podendo dizer-lhes: \"...N... para ser fiel, é preciso perseverar, seja bem-vindo!\" Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas, e os convida a se dirigirem até a Mesa da Palavra.\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra, fazer uma breve reflexão dos fatos ocorridos durante a semana. Pensar em algum fato que nos lembre das injustiças da sociedade, alguma notícia que possa recordar-nos que muitas vezes o homem se vende por qualquer preço, que mata sem motivo, que destrói e não constrói.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista inicia a oração valorizando todas as coisas ditas na recordação da vida. No final pode rezar a oração:\n\nSenhor Jesus, que neste encontro de hoje tuas palavras nos fortaleça para não tropeçarmos diante das dificuldades e das falsas propostas que o mundo nos apresenta. Que tua palavra nos ajude a vencer a tentação de sermos coniventes com a injustiça.\n\nO catequista convida a todos a cantarem aclamando o Evangelho, e em seguida o catequizando (escalado como leitor do encontro) dirige-se até o ambão e proclama o texto indicado.\n\nLeitura do texto bíblico: Mc 15,42-47. Em seguida, após uns minutos de silêncio, o catequista lê-o novamente, desta vez pausadamente, destacando alguns pontos do texto.\n\n\"[...] Depois de ter comprado um lençol de linho, José retirou o corpo da cruz, envolveu-o no lençol e o depositou num túmulo escavado na rocha...\"\n\nApós a leitura, todos dirigem-se para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nPedir aos catequizandos para que reconstruam o texto lido. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após contar a história \"Jesus morre na cruz\", refletir que a morte de Jesus foi um ato de amor de Deus para que a humanidade fosse salva, porém a morte não foi o fim.\n\nJesus morre na cruz\n\nO Padre Pedro que havia batido a cabeça depois do susto do relâmpago lá na igreja acordou com dor de cabeça. Olhou para os lados e não viu as crianças. Ainda relampejava. De repente, ele viu a grande Bíblia, a mesma que ele havia visto anos atrás.\n\n– Ah não, a história não pode ter se repetido. Essas crianças não podem ter entrado nessa Bíblia.\n\nE com muita dor de cabeça ele se levantou e foi até a Bíblia com a mão na testa. E ficou em dúvida. Não sabia se ia atrás das crianças ou se ia dizer aos pais delas, Amanda e Fernando, o que tinha acontecido. Por fim, decidiu entrar na Bíblia. Ele estava vestido de calça social preta e camisa também preta de clégima, aquelas camisas de padre. Para que do outro lado não fosse visto como alguém de outro mundo, pois na época de Jesus só vestiam túnicas, ele pegou uma túnica marrom que estava pendurada por ali e vestiu. Dessa vez, a figura que aparecia era de uma estrada, e ao fundo uma cidade. E o padre seguiu a estrada. Logo a Bíblia desapareceu como na outra vez. Conforme ia se aproximando, ele lembrou-se daquela cidade. Era Jerusalém.\n\n– Essa cidade é tão grande, meu Deus, como vou encontrar as crianças?\n\nE por coincidência, assim que ele olhou para seu lado direito, ao longe, viu Isabel, Otávio e Leandro sentados debaixo de uma árvore bem próximos à entrada da cidade. Ele correu até elas e as abraçou. As crianças contaram o que tinha acontecido até chegarem ali e o padre disse que também, na companhia de seus pais, quando crianças, também tinham estado ali.\n\n– O senhor atravessou a grande Bíblia duas vezes, padre? – indagou Isabel.\n\n– Pois é. Foi. É incrível como isso tudo esteja acontecendo de novo. E vocês se encontraram com Jesus?\n\n– Não, padre. A gente só viu Ele sendo julgado. O João não deixou a gente ver Ele sendo castigado e nem carregando a cruz até o lugar que Ele vai ser crucificado – respondeu Leandro.\n\n– Quando estivemos aqui também não nos deixaram ver Jesus ser pregado na cruz. Mas a gente viu de longe. E a sua mãe Isabel até lembrou-se de uma canção que a gente canta nas procissões até hoje.\n\n– Qual é, padre?\n\nE ele cantou: \"Prova de amor não há, que doar a vida pelo irmão...\"\n\nDepois, olhando para o alto da cidade de Jerusalém, eles viram Jesus sendo erguido pregado na cruz. As crianças, tristes, abraçaram o padre. Por volta das três horas da tarde o céu escureceu. Ventou muito e as crianças ficaram com medo.\n\n– Não tenham medo. É a graça de Deus vindo sobre a Terra. Vocês vão presenciar o amor de Deus por cada uma de suas criaturas vencendo o pecado.\n\nE Jesus deu um forte grito de dor e entregou sua vida nas mãos de seu Pai. Nesse instante trovejou e a terra tremeu. Padre Pedro ficou emocionado por poder participar desse momento pela segunda vez. Depois, chamou as crianças para que o seguissem.\n\n– Pra onde a gente vai, padre?\n\n– Não sei, Otávio. Mas Deus sabe aonde é que quer nos levar. Vamos!\n\nE eles entraram na cidade de Jerusalém sem saber o que iria acontecer.\n\nComentar junto aos catequizandos: Jesus vive em comunhão com o Pai. É na oração que Ele encontra força para suportar todas as suas provações. Desde a tentação no deserto até mesmo a sua crucifixão.\n\nJesus, sabendo que fora escolhido pelo Pai para cumprir a missão, permanece firme mesmo diante da dor, da decepção e da traição. Se pensarmos humanamente, sermos traídos por alguém que não conhecemos talvez até suportaríamos, ou até seria indiferente. Mas ser traído por alguém que amamos, dificilmente suportaríamos. Mas o que podemos perceber é que Jesus vence pela força do Pai, e dá o ensinamento de que só seremos capazes de suportar tal situação com o ensinamento do novo mandamento. Amar-vos uns aos outros. E foi por amor à humanidade que Cristo se entregou na cruz, livremente como sacrifício expiatório, ou seja, reparou as nossas culpas com a obediência plena do seu amor até a morte. Reconciliou com o Pai toda a humanidade. Jesus é o cumprimento do amor maior. É o presente do Pai para todos. Nele, nós renovamos nossas forças, nossas esperanças e nossa capacidade de suportarmos as adversidades da vida. Ele nos chama a tomarmos a cruz também e segui-lo. Diante disso, após realizar os comentários e refletir com os catequizandos, o catequista poderá questioná-los perguntando: Quais são as nossas cruzes? Após, dialogar a partir das respostas pontuando: Sem a força e a graça de Deus não somos capazes de suportar as nossas cruzes, não somos capazes de suportar nenhum desprezo, quanto mais suportarmos a dor da traição. Para sermos fiéis precisamos lutar. Precisamos ser perseverantes, custe o que custar, e lembrarmos que sempre podemos contar com a força que vem de Deus. Diante disso, aquilo que era causa de escândalo e vergonha, ser crucificado, torna-se instrumento de salvação a toda a humanidade. Do alto da cruz Jesus derrama o seu sangue, e com isso redime toda a humanidade, dando oportunidade para que todos se salvem.\n\nConclusão: Será que somos capazes de suportar alguma traição. Se pensamos com nossa razão podemos dizer imediatamente que não. Mas, por isso mesmo, somos convidados a olharmos para nosso interior e refletirmos que a graça do perdão é dom de Deus. E que muitas vezes somos convidados a pagar um preço alto, como Jesus o fez ao ser crucificado, em nome deste perdão que vem de Deus e não de nossa capacidade. Que, ao olharmos a cruz e o sofrimento e a morte de Jesus, saibamos reconhecer que Ele o fez por amor a cada um de nós.\n\nOração final: O catequista convida os catequizandos a ficar em pé ao redor da Mesa da Palavra e os incentiva a formularem orações e preces. Conclui com a oração:\n\nDeus Pai de bondade, pela dolorosa paixão de seu Filho no alto da cruz santificastes a todos nós. Dai-nos a graça de sermos fortalecidos em nossa caminhada sendo fiéis e perseverantes. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N..., Cristo morreu por amor a ti, vai em paz, que Ele sempre te acompanhe!\"", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e um crucifixo."}, {"id": "e13", "num": 13, "kind": "encontro", "title": "A morte", "when": "Quaresma", "biblia": "Rm 6,20-23", "body": "Palavra inicial: Prezados catequistas, no encontro de hoje, queremos refletir com os catequizandos o conceito cristão da \"morte\", tema tão difícil e incompreensível para uma sociedade que busca a \"eterna juventude\".\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico e vela. Cartaz com fotos e imagens de pessoas grávidas e borboletas. Para a dinâmica, papel e lápis de cor.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., seja bem-vindo para o encontro com o Cristo vivo\".\n\nRecordação da vida: Quando todos estiverem na sala do encontro, o catequista convida-os para se colocarem ao redor da Mesa da Partilha ou da Mesa da Palavra, onde trarão presente fatos e acontecimentos que marcaram a semana e a vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração inicial de maneira bem espontânea, podendo invocar o Espírito Santo com um canto e rezar o Credo no final. O catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Rm 6,20-23. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] Mas agora, livres do pecado e feitos servos de Deus, colheis como fruto a santidade e, como fim, tendes a vida eterna...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir junto aos catequizandos o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após o catequista conta a história \"Borboletas no jardim do paraíso\" enfocando que a morte não é o fim, mas o início de uma vida eterna sem dor e sem sofrimento junto de Cristo.\n\nBorboletas no jardim do paraíso\n\nNossos amiguinhos, Totó e o Padre Pedro caminhavam pelas ruas de Jerusalém. A cidade estava muito agitada com a morte de Jesus. De repente uma senhora veio correndo na direção deles e parou em frente ao padre, com lágrimas nos olhos. O Padre Pedro não sabia o que fazer. A mulher apenas o olhava e chorava. Ela levou as mãos à boca e chorou com dor de saudade. O padre quis saber o motivo do choro e a mulher disse que assim que o viu se recordou do filho que havia morrido há uma semana com uma doença incurável.\n\n— Me desculpe, rapaz. Mas você se parece tanto com meu filho... Ainda sinto muitas saudades dele. E ele não merecia ter morrido... Era tão jovem, tão bonito, tão cheio de saúde e vontade de trabalhar. E ele queria ter filhos, estava quase se casando...\n\n– Sinto muito, senhora! Sei que a dor da saudade é muito forte. Mas não se desespere.\n\n– Como não? Não é fácil ver ser enterrado o filho que você carregou no ventre por meses, que você vê crescer... vocês homens não conhecem e nem conhecerão essa dor. Sorte de vocês!\n\n– Eu sei disso. E a senhora tem que acreditar que a morte não é o fim. A morte é o início da vida eterna sem dor e sem sofrimento junto do Cristo que acabou de morrer para que isso acontecesse com todos os filhos de Deus.\n\n– O Cristo... você está falando de Jesus. Ele foi outro que não merecia a morte tão cedo. Só falava do amor. Como a sua mãe deve estar sofrendo também. E eu creio nisso que você disse. Eu creio na vida eterna.\n\n– A minha mãe, que também já faleceu, dizia que quando morremos é como se virássemos borboletas a enfeitar o jardim do paraíso. É como se durante toda nossa vida a gente fosse crescendo dentro de um casulo, pra na hora da morte renascer com belas asas pra voar na eternidade junto de Deus.\n\n– Vejo que você é um homem bom... Que Deus abençoe você e seus filhos - disse, olhando para Isabel, Otávio e Leandro.\n\nNenhum deles disse que não era filho do padre; aliás, nem deu tempo, a senhora logo se virou e saiu. E eles seguiram adiante sem saber para onde ir.\n\nConversar com os catequizandos, questionando-os o que sabem sobre a \"morte\", o que acontece quando morremos, e se os mesmos têm medo de morrer. Deixar que falem. Depois conversar com eles sobre o que nós cristãos pensamos sobre a morte. Mostrando que a morte na verdade é um novo nascimento, agora não mais para uma vida passageira, mas uma vida eterna junto de Deus. Poderá ser utilizada a analogia do nascimento de um bebê e da lagarta como no artigo do material de apoio, dizendo que assim como a criança passa um tempo no ventre materno sendo gerada, assim acontece conosco. Somos gerados nesse grande útero que é a mãe natureza, a mãe terra, e depois de um tempo precisamos partir, para se encontrar com nosso criador, para vivermos junto de Deus. Já a lagarta, um bichinho feio muitas vezes, representa a nossa caminhada neste mundo, cheia de dores e pecados, porém, depois de um tempo, a lagarta para e se transforma num casulo, de onde sai uma linda borboleta. Essa transformação simboliza a nossa morte. O casulo que fica representa nosso corpo sem vida, e a borboleta nosso corpo glorioso, como dizia São Paulo, corpo belo, sem pecado. Ao final todos os catequizandos poderão desenhar e pintar várias borboletas, dizendo que um dia seremos estes belos bichinhos a enfeitar os jardins do paraíso, onde Deus reservou sua morada para cada um de nós.\n\nConclusão: Quando alguém de nossa família morre, principalmente quando é uma pessoa muito próxima de nós, acabamos ficando muito tristes. Choramos muitas vezes e não compreendemos por que essas pessoas foram tiradas do nosso convívio. Porém, como cristãos, devemos ter a certeza de que elas estão junto de Deus, rezando e intercedendo por nós. A saudade sempre deverá existir em nós, porém não deixemos a tristeza tomar conta de nosso coração. Durante a semana vamos lembrar das pessoas que já fizeram a sua Páscoa (passagem) e vamos rezar por elas em nossas orações pessoais.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e a formularem orações pelas pessoas que já partiram para junto de Deus, bem como por pessoas que estejam muito doentes. A cada oração todos respondem: \"Senhor, ouvi-nos\". Poderá rezar o Pai-nosso e conclui com a oração:\n\nSenhor Deus da vida, ajudai-nos a compreender o mistério da morte. Que saibamos confiar em sua divina misericórdia sem medo e sem temor. Que saibamos consolar aqueles que perderam seus entes queridos. Por Cristo Nosso Senhor. Amém.", "prep": "Ambão com toalha da cor do Tempo Litúrgico e vela. Cartaz com fotos e imagens de pessoas grávidas e borboletas. Para a dinâmica, papel e lápis de cor."}, {"id": "e14", "num": 14, "kind": "encontro", "title": "Desceu à mansão dos mortos", "when": "Semana Santa / Páscoa", "biblia": "1Cor 15,19-22", "body": "Palavra inicial: No encontro de hoje queremos refletir com nossos catequizandos que Jesus é o nosso salvador, Ele vai ao encontro de cada um de nós e nos chama pelo nome. Que Jesus Cristo é o Senhor dos vivos e dos mortos. Na ressurreição, Jesus resgatou todos que haviam morrido pelo pecado.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e círio pascal. Cartaz com ícone da \"Anástasis\" (que pode ser facilmente encontrada na internet e impressa).\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os com a frase: \"...N..., Cristo te chama. Seja bem-vindo!\"\n\nRecordação da vida: Quando todos estiverem na sala de encontro, colocam-se ao redor da Mesa da Palavra ou da Mesa da Partilha, e em clima de oração o catequista os motiva a recordar fatos e acontecimentos que marcaram a semana. O catequista poderá perguntar sobre o encontro anterior, relembrando-o.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista conduz a oração inicial. E enquanto entoa-se um refrão meditativo, um catequizando poderá acender no círio pascal uma pequena vela palito e acender a vela ao lado da Mesa da Palavra, enfatizando que Cristo (representado pelo círio pascal), dissipa toda a treva. Poderá ainda rezar o Credo e concluir com a oração:\n\nSenhor Nosso Deus, Tu que enviastes teu filho Jesus à mansão dos mortos para resgatar nossos primeiros pais, derrame sobre nós teu Santo Espírito para que possamos nos aproximar cada vez mais de ti, em santidade e verdade. Amém.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: 1Cor 15,19-22. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"Se temos esperança em Cristo só para esta vida, somos as pessoas mais infelizes [...] em Cristo todos reviverão.\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nReconstruir junto aos catequizandos o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nApós a reconstrução do texto bíblico, contar a história \"A mansão dos mortos\", enfatizando que Cristo é nossa Luz e salvação, toda nossa vida só tem sentido nele. Ele é nossa esperança.\n\nA mansão dos mortos\n\nPadre Pedro e nossos amiguinhos, mais o cãozinho Totó, andavam pela cidade sem saber o que fazer. E anoitecia. De repente um vento forte começou a soprar e uma neblina apareceu de novo. As crianças seguraram a mão do padre e Totó começou a latir. Quando a neblina desapareceu, eles olharam ao redor e só havia escuridão. Não imaginavam que estavam na mansão dos mortos.\n\n– Que lugar é esse, padre?\n\n– Não tenho ideia, Leandro.\n\n– Eu não gosto de lugares escuros – disse Isabel.\n\nDe repente, ao longe, eles viram uma luz. E essa luz foi aumentando e iluminando o lugar e aquela treva foi desaparecendo e foram vendo que ao redor deles havia muitas outras pessoas.\n\n– Eu sou o Cristo. Vim resgatar vocês da morte. Não há mais razões para continuarem nas trevas. Eu sou a Luz do mundo e vou levá-los para a casa do meu Pai. Eu venci o pecado pela morte na cruz!\n\n– Estamos na mansão dos mortos! – cochichou o padre para as crianças. – Jesus veio buscar os nossos antepassados para viverem na glória de Deus.\n\nCristo pegou os punhos de um homem e uma mulher que estavam próximos dele e lhes dá as boas-vindas para viverem uma nova vida, a vida eterna. Depois disso todo o lugar ficou iluminado por uma forte luz que eles tiveram de fechar os olhos. Quando voltaram a ver, não estavam mais na mansão dos mortos, mas novamente na cidade de Jerusalém.\n\nMostrar aos catequizandos o ícone da \"Anástasis\". A palavra \"anástasis\" vem do grego e literalmente quer dizer: \"ficar de pé novamente\" ou \"erguer-se\". É a ressurreição para nós cristãos. Cristo que desce à mansão dos mortos e vai primeiro buscar Adão e Eva (que simbolizam toda a humanidade), ou seja Cristo que vai ao encontro do homem para resgatá-lo da morte. Pedir para que os catequizandos observem a imagem e socializem as observações. O que viram? Quais os sentimentos? Após conversarem o catequista lê o texto \"A descida do Senhor à mansão dos mortos\", que é uma antiga homilia lida no Sábado Santo, retirada do ofício das leituras da Liturgia das Horas. O texto deverá ser proclamado com ênfase, como um poema. Após a leitura conversar com os catequizandos sobre o texto, identificando-o com o ícone.\n\nRefletir: Quem é Cristo para nós? Por que Ele pega Adão e Eva pelo punho? Como a morte é representada no ícone? Fomos criados para quê? É bom lembrar também que Adão e Eva representam toda a humanidade, não só uma pessoa. Cristo é a Luz que dissipa todas as trevas. A escuridão, a morte é ausência de Luz, ausência de Deus. Cristo é aquele que nos resgata da morte e nos dá vida em plenitude. Cristo pega Adão e Eva pelo punho, simbolizando que Cristo não é igual ao homem, nele não há pecado. O pegar pela mão simboliza que somos iguais, pegando Adão e Eva pelo punho, Jesus diz ser superior, pois foi obediente até o fim. Cristo, o Novo Homem, resgata toda a humanidade pela morte de cruz. A cruz é o sinal de sua vitória. A morte é representada pelas tábuas quebradas debaixo de seus pés (portas).\n\nA descida do Senhor à mansão dos mortos\n\nQue está acontecendo hoje? Um grande silêncio reina sobre a terra. Um grande silêncio e uma grande solidão. Um grande silêncio, porque o Rei está dormindo; a terra estremeceu e ficou silenciosa, porque o Deus feito homem adormeceu e acordou os que dormiam há séculos. Deus morreu na carne e despertou a mansão dos mortos. Ele vai antes de tudo à procura de Adão, nosso primeiro pai, a ovelha perdida. Faz questão de visitar os que estão mergulhados nas trevas e na sombra da morte. Deus e seu Filho vão ao encontro de Adão e Eva cativos, agora libertos dos sofrimentos. O Senhor entrou onde eles estavam, levando em suas mãos a arma da cruz vitoriosa. Quando Adão, nosso primeiro pai, o viu, exclamou para todos os demais, batendo no peito e cheio de admiração: \"O meu Senhor está no meio de nós\". E Cristo respondeu a Adão: \"E com teu espírito\". E, tomando-o pela mão, disse: \"Acorda, tu que dormes, levanta-te dentre os mortos, e Cristo te iluminará. Eu sou o teu Deus, que por tua causa me tornei teu filho; por ti e por aqueles que nascerem de ti, agora digo, que com todo o meu poder, ordeno aos que estavam na prisão: 'Sai!'; e aos que jaziam nas trevas: 'Vinde para a luz!'; E aos entorpecidos: 'Levantai-vos!' Eu te ordeno: Acorda, tu que dormes, porque não te criei para permaneceres na mansão dos mortos. Levanta-te, obra das minhas mãos; levanta-te, ó minha imagem, tu que foste criado à minha semelhança. Levanta-te, saímos daqui; tu em mim e eu em ti, somos uma só e indivisível pessoa. Por ti, eu, o teu Deus, me tornei teu Filho; por ti, eu, o Senhor, tomei tua condição de escravo por ti, eu, que habito no mais alto dos céus, desci a terra e fui até mesmo sepultado debaixo da terra; simboliza a ausência de vida, a ausência de Deus (o pecado). Cristo vai ao encontro da humanidade, pois fomos criados para viver junto de Deus.", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e círio pascal. Cartaz com ícone da \"Anástasis\" (que pode ser facilmente encontrada na internet e impressa)."}, {"id": "e15", "num": 15, "kind": "encontro", "title": "Ressuscitou ao terceiro dia", "when": "Páscoa", "biblia": "1Cor 15,1-6", "body": "Palavra inicial: Prezados catequistas, queremos refletir neste encontro sobre a ressurreição de Jesus, tema central de nossa fé, bem como toda a simbologia bíblica expressa pelo número três.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, círio pascal e vasilha com água. Para dinâmica, velas e todo material necessário para confecção de pequenos círios pascais (vela sete dias, grãos de incenso, pregos, adesivos com os numerais do ano corrente, cruz e as letras gregas Alfa e Ômega).\n\nAcolhida: À medida que os catequizandos vão chegando à sala do encontro o catequista os acolhe, saudando-os com a frase: \"Seja luz para o mundo ...N... Seja bem-vindo!\"\n\nRecordação da vida: Quando todos estiverem na sala, o catequista os convida a se colocarem ao redor da Mesa da Partilha ou da Mesa da Palavra e os motiva a recordar fatos e acontecimentos que marcaram a semana e a vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: De pé, ao redor da Mesa da Palavra, o catequista convida a todos a ficarem alguns segundos em silêncio. Em seguida o catequista poderá convidar os catequizandos a cantar um refrão meditativo que fale da Luz de Cristo (o refrão poderá ser repetido várias vezes, e no final terminar apenas com murmúrios). Enquanto entoa-se o refrão meditativo, um catequizando poderá acender no círio pascal uma pequena vela palito e acender a vela ao lado da Mesa da Palavra. Em seguida o catequista conduz a oração inicial, podendo rezar o Credo. Depois, o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: 1Cor 15,1-6. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] Cristo morreu por nossos pecados [...] que foi sepultado; que ressuscitou ao terceiro dia [...]\".\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nNa Mesa da Partilha, o catequista convida os catequizandos a reconstruírem o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar.\n\nApós a reconstrução do texto bíblico, contar a história \"Cristo vive!\" enfatizando que Cristo é a nossa esperança. Que sempre depois de um momento de escuridão, de trevas, de sofrimento, vem a ressurreição, a luz.\n\nCristo vive!\n\nParados de frente a uma porta, o Padre Pedro e as crianças não sabiam o que fazer. As crianças disseram que estavam com fome, e Totó latiu como se quisesse dizer que também estava faminto. Uma mulher abriu a porta e os convidou a entrar. E as crianças a reconheceram.\n\n– Padre, é a Maria, a mãe de Jesus! E eles correram para abraçá-la.\n\nAssim que entraram, ela fechou a porta e eles viram dez, dos onze apóstolos ali, tristes, desanimados e com medo. Vale lembrar que Judas Iscariotes não estava ali porque havia morrido. E Maria explicou que estavam ali escondidos, pois estavam sendo perseguidos pelos romanos.\n\n– Não queremos ser presos e condenados a morrer também na cruz como Jesus! – falou Simão.\n\n– Eu jamais aceitaria morrer do mesmo jeito que o meu mestre. Ia pedir que me crucificassem de ponta-cabeça – disse Pedro, o líder dos apóstolos.\n\n– Vocês estão com fome? Sentem-se e comam.\n\nAs crianças e o padre agradeceram e sentaram para comer. Do nada a porta se abriu e Maria Madalena entrou correndo, chorando e muito feliz.\n\n– Jesus vive! Ressuscitou como havia prometido! Não está mais na sepultura! Ele vive! Ele vive, Maria! Seu filho está vivo!\n\nAs crianças olharam para o padre, que deu um sorriso. Os apóstolos e Maria se abraçaram felizes com a notícia. Depois, João e Pedro, o apóstolo, saíram correndo em direção ao sepulcro de Jesus para confirmar o acontecido. Mas antes Maria Madalena disse a todos que um anjo havia dito que Jesus queria estar com todos antes de subir aos céus na Galileia.\n\nApós a história o catequista reflete com os catequizandos o que eles entendem por ressurreição. Deixar que falem. O catequista poderá verificar qual a concepção de ressurreição dos catequizandos. A partir daí, apresentar a nossa fé na ressurreição, dizendo aos catequizandos que também iremos ressuscitar quando chegar a hora de partir deste mundo. A ressurreição é um novo nascimento, não mais pra uma vida passageira, mas para a eternidade junto de Deus.\n\nDepois trabalhar a simbologia do número três, dizendo que para o povo hebreu os números tinham significados diferentes e que o número três na Bíblia significa plenitude, ou seja, não sabemos quanto tempo Cristo ficou na mansão dos mortos, pois para Deus não existe tempo nem espaço. Quando o autor escreve três dias, quer dizer que Cristo ficou o tempo que foi necessário para resgatar toda a humanidade da morte do pecado. Outro exemplo é o texto bíblico que fala da conversão de Jonas (Jn 2,1), que ficou três dias na barriga da baleia, simbolizando que ficou o tempo necessário para sua conversão.\n\nAtividade: Na vigília pascal, no Sábado Santo, o círio pascal é o grande símbolo do Ressuscitado. Propomos que neste encontro o catequista explore toda a simbologia deste símbolo. A ideia é que cada catequizando confeccione um minicírio, para que possam na prática aprender o significado e a simbologia do mesmo. O catequista disponibiliza todo material necessário, e chama atenção dos catequizandos para o círio pascal que se encontra ao lado da Mesa da Palavra. Pergunta aos catequizandos se eles sabem o que simboliza aquela grande vela, o significado dos números e letras nela impressos.\n\nApós ouvir os catequizandos, valorizando na medida do possível a contribuição de cada um, o catequista explica-lhes que essa grande vela simboliza o Cristo ressuscitado e é confeccionada a cada ano e acesa na solene vigília pascal. E que os símbolos impressos nela representam todo o mistério da Paixão, Morte e Ressurreição de Cristo. E propõe que cada catequizando confeccione um minicírio, onde, à medida que ele for produzido, iremos compreender todo simbolismo nele expresso. O catequista, podendo recorrer às rubricas do Missal Romano (Cf. Missal Romano, \"Domingo da Páscoa na Ressurreição do Senhor\" – Missa da vigília), orienta os catequizandos na confecção dos mini círios, sempre tendo como modelo o círio da Mesa da Palavra. Enquanto a atividade é realizada, propõe-se colocar um CD com uma música pascal, para ser ouvida pelos catequizandos.\n\nConclusão: O catequista conclui que Cristo ressuscitado é nossa Luz e que somos convidados a ser essas pequenas chamas (pequenas velas) a iluminar toda a humanidade que vive na escuridão (drogas, violência...). Orienta-os que não teremos encontro de catequese na próxima semana, e que o mesmo será uma CELEBRAÇÃO. O catequista então comunicará o local, a data e o horário aos catequizandos, pedindo para que observem o cronograma e, como gesto concreto, para que convidem seus pais, padrinhos e amigos para participar.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra. Incentiva-os a formularem orações de preces e agradecimento. Rezam a oração do Pai-nosso e conclui com a oração:\n\nSenhor nosso Deus, que ressuscitastes Jesus Cristo, ajudai-nos a ser luz e a iluminar aqueles que nos foram confiados. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... Seja luz para o mundo, e vai em paz, que Ele te acompanhe! Amém\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, círio pascal e vasilha com água. Para dinâmica, velas e todo material necessário para confecção de pequenos círios pascais (vela sete dias, grãos de incenso, pregos, adesivos com os numerais do ano corrente, cruz e as letras gregas Alfa e Ômega)."}, {"id": "e16", "num": 16, "kind": "celebracao", "title": "Celebração da Luz", "when": "Celebração — tempo pascal", "biblia": "Jo 3,1-5.16-21", "body": "*(Para a celebração é importante convidar toda a comunidade, os pais e padrinhos de Batismo de cada catequizando).*\n\nPalavra inicial: Com a presente celebração queremos valorizar o símbolo da luz, pois Cristo mesmo disse: \"Eu sou a luz do mundo. Quem me segue não andarás nas trevas, mas terá a luz da vida\" (Jo 8,12). Queremos refletir que Cristo é nossa Luz, é o nosso farol, que nos orienta enquanto caminhamos neste mundo. Além disso, essa celebração é uma oportunidade para inserir os catequizandos e seus familiares na vida da comunidade. Portanto, toda a comunidade deve estar presente para acolher e conviver com os pais e padrinhos dos catequizandos.\n\nPreparando o ambiente: Círio pascal, velas para todos os participantes, Bíblia. Sugerimos que esta celebração aconteça em um ambiente onde é possível caminhar (sair de uma capela e ir até a matriz, ou da sala de catequese até a capela ou igreja, ou ainda sair do estacionamento ou de um jardim ou praça). No percurso preparar dois ambientes onde serão realizadas reflexões.\n\n1ª parada: Tecido no chão ou em um biombo com crucifixo, cartazes com os dizeres: guerra, fome, droga, egoísmo, injustiça, ódio, mentira, poluição...\n\n2ª parada: Tecid
