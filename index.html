o no chão ou mesa com várias velas, flores e cartazes com os dizeres: paz, união, amor, comunidade, esperança, caridade, perdão...\n\nOs cantos estão no livro: KOLLING, I. M. T. *Cantos e orações. Para a liturgia da missa, celebrações e encontros*. 4. ed. Petrópolis: Vozes, 2004.\n\nDistribuindo funções: Seria importante também distribuir algumas funções com antecedência:\n\n* Animador: para orientar as pessoas durante a celebração;\n* Presidente: de preferência o próprio catequista;\n* Pessoa para proclamar a leitura bíblica;\n* Pessoa para cantar o salmo;\n* Pessoa para fazer a oração da assembleia;\n* Cantores (deverão escolher com antecedência os cantos);\n* Ministros para acolhida (os próprios catequistas ou membros da comunidade).\n\nConforme os fiéis vão chegando no local da celebração, canta-se o refrão para criar um clima de oração: (\"Ó luz do Senhor\" – Comunidade G. Champs. In: KOLLING, 2004, n. 104, p. 37).\n\nÓ luz do Senhor que vem sobre a terra inunda meu ser, permanece em nós.\n\nO animador acolhe calorosamente e os introduz no espírito da celebração, explicando-lhes sua dinâmica, em seguida o presidente convida-os para iniciá-la.\n\nPresidente: Amados irmãos e irmãs, sejam todos bem-vindos a nossa celebração da Luz. Na noite de hoje, somos convidados a fazer uma experiência mística com Cristo nossa Luz, e refletirmos sobre o que causa as trevas em nossa sociedade e o que as ilumina. Somos convidados a caminhar e ter como nosso guia, Cristo. Por isso, iremos fazer uma pequena caminhada, com o círio pascal a nossa frente, recordando a coluna luminosa que caminhava à frente dos hebreus no deserto, sendo libertados da escravidão do Egito. Confiantes no Cristo, nossa Luz, iniciemos nossa celebração cantando o refrão meditativo: (\"Confiemos no Senhor\" – Taizé. In: KOLLING, 2004, n. 1459c, p. 317).\n\nTodos: Confiemos no Senhor, Ele é justo e tão bondoso.\n\nDas trevas para a luz\n\nConfiemo-nos no Senhor, aleluia.\n\nLeitor 1: Estamos aqui reunidos porque acreditamos em Cristo que cura as nossas feridas e temos esperança numa vida nova.\n\nLeitor 2: Estamos aqui reunidos porque acreditamos no amor entre as pessoas, na igualdade de todos os homens, na possibilidade de vivermos como irmãos e de construirmos um mundo melhor. Por isso cantemos: (\"Onde reina amor\" – Taizé. In: KOLLING, 2004, n. 1459, p. 318).\n\nTodos: Onde reina o amor, fraterno amor. Onde reina o amor Deus ali está.\n\nPresidente: É na Palavra de Deus que encontramos a vida nova. Jesus Cristo é o caminho único para chegarmos à vida nova da festa pascal. Vamos criar dentro de nós um sentimento de paz e de acolhimento, para ouvirmos a sua Palavra e a transformarmos depois em vida.\n\nLeitura bíblica: Jo 3,1-5.16-21. Tempo de silêncio.\n\nPresidente: Oremos:\n\nSenhor Jesus, aquece o nosso coração, ilumina nossa inteligência, fortalece a nossa vontade, para te acolhermos com amor, compreendermos o teu exemplo de vida e termos a coragem de te imitar na nossa vida. Tu que te fizeste nosso irmão e és Deus verdadeiro com o Pai e o Espírito Santo. Amém.\n\nPresidente: Iniciemos nossa caminhada meditando o texto proclamado e cantando o refrão meditativo, \"Ó luz do Senhor\". (\"Ó luz do Senhor\" – Comunidade G. Champs. In: KOLLING, 2004, n. 104, p. 37).\n\nÓ luz do Senhor que vem sobre a terra, inunda meu ser, permanece em nós.\n\n*(Inicia-se a caminhada com o círio pascal à frente. Todos caminham e cantam até chegar ao ambiente preparado para a primeira reflexão).*\n\nLeitor 1: O mundo jazia nas trevas, / Uma luz brilhou na escuridão. / Cristo é a Luz do mundo.\n\nPresidente: Continuemos nossa caminhada cantando o refrão: \"Ó luz do Senhor\" e meditando sobre nossos atos, nossas ações.\n\nBatalha do homem contra si mesmo\n\nBatalha do homem contra Deus, batalha do homem contra o homem, desde então a história do mundo foi uma batalha sem tréguas: criado em paz para viver feliz, o homem lançou o primeiro grito de guerra quebrando a Aliança com seu Deus.\n\nLeitor 1: Somos solidários no mal. Defendemos o direito de viver, falamos contra a pena de morte, e matamos a vida (fome, droga, prostituição, aborto). Exigimos liberdade e abrimos novas prisões e inventamos novas formas de torturas e opressão.\n\nLeitor 2: Somos solidários no mal. Pregamos a Verdade e espalhamos a mentira. Proclamamos o Amor e alimentamos o ódio. Apregoamos o Perdão e praticamos a vingança.\n\nLeitor 1: Somos solidários no mal. Falamos de PAZ e fazemos a guerra, gritamos por justiça e somos injustos. Propomos a igualdade e Unidade, mas somos egoístas e vivemos divididos.\n\nLeitor 2: Olhemos para nossa vida. Que temos feito? Somos solidários no mal!\n\nLeitor 1: E nós, será que não pecamos? Infelizmente também em nós existem muitas trevas. Nós muitas vezes fazemos o mal. E contra quem? Nós próprios, os outros, a natureza, a Deus.\n\nLeitor 2: Também o mundo em que vivemos, apesar de tantas luzes, teima em continuar mergulhado nas trevas da morte.\n\nPresidente: *(Neste momento ler em voz alta os cartazes no chão aos pés do crucifixo: guerra, fome, droga, egoísmo, injustiça, ódio, mentira etc.)*\n\nLeitor 2: A luz veio ao mundo, e os homens amaram mais as trevas do que a luz, pois as obras deles eram más.\n\n...ditando sobre nossos atos, nossas ações. (\"Ó luz do Senhor\" – Comunidade G. Champs. In: KOLLING, 2004, n. 104, p. 37).\n\nÓ luz do Senhor que vem sobre a terra, inunda meu ser, permanece em nós.\n\n*(Continua-se a caminhada até o segundo ponto preparado para a reflexão, na frente vai o círio pascal).*\n\nLeitor 2: Cristo único Salvador, convida-nos a mudar de vida. Ele vem para nos libertar. Cristo é a promessa e o dom pacífico do PAI à humanidade.\n\nPresidente: *(Neste momento ler em voz alta as palavras dos cartazes: Paz, União, Igreja, Unidade, Fé, Caridade, Esperança etc.)*\n\nLeitor 1: Jesus Cristo é a boa-nova da salvação. Acreditamos que Cristo é o único capaz de nos entusiasmar e levar a construir um mundo melhor onde a luz da paz e da alegria brilhará para todos os homens, sem mais pecado nem opressão. Cristo é o nosso libertador!\n\nAnimador: Cristo é a Luz do mundo! De todos os homens! De cada um de nós! Como o acolhemos? Paramos para escutar e lhe falar? Estamos disponíveis para os outros? Deixemos que esta Luz nos ilumine interiormente; diante do CRISTO VIVO, acolhamos o amor de Deus que nos cura e salva.\n\n*(O presidente convida a todos a pegarem suas velas e acender no círio pascal).*\n\nPresidente: Continuemos nossa caminhada, iluminados por Cristo, até a capela (igreja etc.), tendo Cristo a nossa frente e em nossa vida. Caminhemos e cantemos: (\"Ó luz do Senhor\" – Comunidade G. Champs. In: KOLLING, 2004, n. 104, p. 37).\n\nÓ luz do Senhor que vem sobre a terra, inunda meu ser, permanece em nós.\n\nTodos continuam caminhando com suas velas acesas e tendo o círio pascal à frente e cantando o refrão meditativo até a capela ou a igreja escolhida. O local deverá estar com as luzes apagadas e, à medida que os participantes vão adentrando o local, vão se acendendo aos poucos as luzes. Quando todos tiverem entrado o presidente recita em voz alta a oração:\n\nPresidente: Bendita seja a luz do dia, bendito seja quem tudo cria, bendito seja o fruto sagrado da sempre puríssima Virgem Maria. Amém!\n\nLeitor 1: O batismo nos lava de todo pecado, nos incorpora a Cristo e na comunidade. Como filhos da Luz, banhados na água da vida, cantemos, enquanto seremos aspergidos pela água, lembrando e recordando o dia do nosso batismo. (\"Banhados em Cristo\" – Adaptação de Ione Buyst. In: KOLLING, 2004, n. 1459f, p. 318).\n\nBanhados em Cristo somos uma nova criatura, as coisas antigas já se passaram, somos nascidos de novo. Aleluia, aleluia, aleluia.\n\nPresidente: Como família, povo escolhido por Deus, rezemos com amor e confiança a oração que o Senhor nos ensinou: Pai nosso...\n\nPresidente: Oremos: Ó Deus, autor de toda criação, ilumina nossa humanidade com tua Luz, purifica-nos de toda maldade e nos conduza à vida eterna. Amém.\n\nLeitor 2: Queremos agradecer a presença e a participação de todos, que a luz do Senhor esteja com cada um de vós.\n\nPresidente: O Senhor nos abençoe, nos livre de todo mal e nos conduza à vida eterna. Amém.\n\nSaudemo-nos uns aos outros, nos abraçando e desejando a paz de Cristo. Canto final à escolha.", "prep": "Círio pascal, velas para todos os participantes, Bíblia. Sugerimos que esta celebração aconteça em um ambiente onde é possível caminhar (sair de uma capela e ir até a matriz, ou da sala de catequese até a capela ou igreja, ou ainda sair do estacionamento ou de um jardim ou praça). No percurso preparar dois ambientes onde serão realizadas reflexões. 1ª parada: Tecido no chão ou em um biombo com crucifixo, cartazes com os dizeres: guerra, fome, droga, egoísmo, injustiça, ódio, mentira, poluição... 2ª parada: Tecido no chão ou mesa com várias velas, flores e cartazes com os dizeres: paz, união, amor, comunidade, esperança, caridade, perdão..."}, {"id": "e17", "num": 17, "kind": "encontro", "title": "Subiu aos céus", "when": "Páscoa / Ascensão", "biblia": "Lc 24,44-53", "body": "Palavra inicial: Prezado catequista, no encontro de hoje queremos refletir sobre a Ascensão do Senhor. Cristo que sobe aos céus e marca a entrada definitiva de sua humanidade no Reino de Deus.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, cartaz com a imagem da Ascensão do Senhor.\n\nAcolhida: O catequista acolhe os catequizandos saudando-os carinhosamente: \"...N..., somos cidadãos do céu!\".\n\nRecordação da vida: Quando já estiverem na sala do encontro, convida-os a se colocarem ao redor da Mesa da Partilha ou da Mesa da Palavra em clima de oração. Neste momento recordar fatos e acontecimentos que marcaram a vida da comunidade, da Igreja e do mundo.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista, reunindo todos os acontecimentos da recordação da vida, inicia a oração inicial invocando o Espírito Santo. Poderá ser concluída com a Profissão de Fé. O catequista convida a todos a aclamarem o Evangelho com um canto. Em seguida, o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Lc 24,44-53. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] levantou as mãos e os abençoou. Enquanto os abençoava, separou-se deles, e foi levado para o céu...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista estimula os catequizandos a falarem o que entenderam do texto: quem eram os personagens, em que ambiente estavam, o que aconteceu... Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Depois conta a história \"Jesus volta para a Casa do Pai\" frisando a subida do Senhor e a alegria dos discípulos.\n\nJesus volta para a Casa do Pai\n\nNuma tarde fresca, porém de sol, os apóstolos, Maria, Maria Madalena, o Padre Pedro, Isabel, Otávio, Leandro, Totó e outros discípulos chegaram ao local em que Jesus havia pedido para estarem na Galileia para se despedir e regressar à casa do Pai. E Jesus apareceu. Todos puderam ver as marcas dos pregos em seus pulsos, nos pés e o furo no lado em que o soldado havia passado uma lança. E Ele disse:\n\n— Meus queridos, quero que vocês vão por todo o mundo e proclamem a Boa Notícia, que falem sobre o verdadeiro sentido do amor a todas as pessoas. Estava escrito que o Messias tinha que morrer e ressuscitar.\n\nE em seu nome se pregaria penitência e perdão dos pecados a todos os lugares, começando por Jerusalém. E todos vocês são testemunhas disso. Depois de falar outras coisas, principalmente aos apóstolos, Jesus ergueu as mãos e os abençoou. Ele sorriu, olhou para o alto e nuvens o envolveu. Depois, todos puderam ver anjos ao redor de Jesus que era levado ao céu e lá se sentou à direita de Deus. Todos voltaram para Jerusalém contentes até mesmo Maria, que tinha a certeza de que um dia reencontraria seu filho para junto dele viver por toda a eternidade.\n\nApós a história o catequista poderá pedir aos catequizandos que observem a imagem com a cena da ascensão. Pedir que comentem o que chamou atenção na imagem. Depois o catequista reflete com os catequizandos a passagem bíblica, explicando que a subida do Senhor aos céus, após quarenta dias da sua ressurreição, é conhecida pela Igreja através do termo \"Ascensão\". Cristo, sendo filho de Deus, sobe por si só ao céu. A sua ascensão assinala a entrada definitiva da humanidade de Jesus no Reino de Deus.\n\n\"Jesus Cristo, Cabeça da Igreja, nos precede no Reino glorioso do Pai para que nós, membros de seu Corpo, vivamos na esperança de estarmos um dia eternamente com Ele. Tendo entrado uma vez por todas no santuário do céu, Jesus Cristo intercede sem sessar por nós como mediador que nos garante permanentemente a efusão do Espírito Santo\" (CIC 665-667).\n\nO catequista poderá aproveitar a oportunidade e explicar aos catequizandos a diferença entre \"ascensão\" e \"assunção\". Aprofundar o estudo do dogma mariano da assunção definido pelo Papa Pio XII, em 1º de novembro de 1951, poderá ajudar o catequista nesta reflexão.\n\nConclusão: A subida do Senhor ao céu indica que nós também, filhos e filhas de Deus, somos convidados a subir também com Cristo. Somos cidadãos do céu. A nossa vida nesse mundo é passageira, aqui ficamos um tempo oportuno para nossa geração, para o nosso amadurecimento, e depois de um tempo precisaremos partir, onde nos encontraremos com Cristo e com todos que nele ressuscitaram. Nós, enquanto cristãos, deveremos a cada dia aspirar às coisas do alto. Como gesto concreto pedir aos catequizandos para que pesquisem no Calendário Litúrgico as datas em que a Igreja celebra a \"ascensão do Senhor\" e a \"assunção de Maria\" e registrem em seu diário catequético e espiritual.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e os convida a formularem orações e preces. Reza-se o Pai-nosso e conclui com a oração:\n\nÓ Deus, fonte de toda a vida, queremos, a exemplo do teu Filho Jesus e de sua mãe Maria Santíssima, sermos elevados ao céu no último dia. Queremos verdadeiramente ser cidadãos do céu. Ajudai-nos nesse mundo a buscar as coisas do Alto. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N..., desejai as coisas do Alto, vai em paz, e que o Senhor te acompanhe!\"\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 659 a 667 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: \"[...] e subiu aos céus, onde está sentado à direita do Pai...\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, cartaz com a imagem da Ascensão do Senhor."}, {"id": "e18", "num": 18, "kind": "encontro", "title": "Como fazer esse céu na terra", "when": "Pentecostes", "biblia": "At 2,1-11", "body": "Palavra inicial: Neste encontro procuraremos refletir com nossos catequizandos que o céu pode ser iniciado aqui na Terra através das nossas ações e de como reagimos diante de tudo que este mundo nos oferece. Deus conta conosco, por isso nos envia o Espírito Santo para nos auxiliar nessa missão.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, dois cartazes: Um representando um ambiente hostil (guerra, fome, morte, tristeza, desmatamento etc.), outro cartaz representando um ambiente harmonioso (sorriso, abraço, fraternidade, natureza bem-cuidada etc.), música e/ou oração de São Francisco de Assis.\n\nAcolhida: O catequista acolhe os catequizandos saudando-os: \"...N..., o céu começa aqui. Seja bem-vindo!\", e conduzindo-os para dentro da sala. Quando já estiverem na sala, saúda a todos mais uma vez, convidando-os para se colocarem ao redor da Mesa da Partilha ou de pé ao redor da Mesa da Palavra.\n\nRecordação da vida: Após serem acolhidos, farão uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, pedindo para que partilhem o que cada um experienciou. Poderão destacar ainda os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista motiva a oração inicial, podendo invocar o Espírito Santo rezando ou cantando. Depois o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura texto bíblico: At 2,1-11.\n\n\"Chegando o dia de Pentecostes [...] De repente veio do céu um ruído, como o de um vento impetuoso [...] Viram aparecer, então, uma espécie de línguas de fogo, que se repartiram e foram pousar sobre cada um deles. Todos ficaram cheios do Espírito Santo e começaram a falar em outras línguas, conforme o Espírito Santo lhes concedia que falassem [...] todos os ouvimos falar as grandezas de Deus em nossas próprias línguas.\"\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos. Todos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista reconstrói o texto bíblico com os catequizandos. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. O catequista poderá contextualizar a passagem, retratando o momento que estavam vivendo os discípulos (ansiedade, medo, desconfiança...) até que surge nesse mesmo ambiente de angústia, o Espírito Santo. Ele vem para cumprir a promessa do Filho. É o Espírito Santo de Deus que fortalece e revigora o ânimo dos discípulos, para que seja anunciado ao mundo a Boa-Nova do Reino que começa a ser construído aqui na terra.\n\nO catequista, após esta introdução, poderá contar a história \"A Torre de Babel\".\n\nA Torre de Babel\n\nDepois que Jesus voltou para a casa do Pai, os apóstolos, que estavam tristes, desanimados e com medo, ficaram fortalecidos com a força do Espírito Santo que Jesus mandou sobre eles com a bênção. Mas eles acabaram ficando desanimados novamente, com medo de não darem conta de seguir em frente com a missão que o Cristo lhes confiou. Então, no dia de Pentecostes, estavam todos reunidos no cenáculo, quando, de repente, veio do céu um barulho como o sopro de um vendaval. Todos se assustaram e começaram a olhar para o teto, achando que ele fosse cair. Mas, para surpresa deles, apareceram como que línguas de fogo, que se espalharam e foram pousar sobre cada um dos apóstolos e Nossa Senhora. O padre e as crianças ficaram maravilhados em presenciar aquele momento. Todos ficaram repletos do Espírito Santo, e começaram a falar em outras línguas, conforme o Espírito lhes concedia que falassem. E depois desse dia saíram pelo mundo anunciando as maravilhas de Deus e fazendo muitos outros discípulos. Nossos amigos seguiram alguns deles por algumas missões, aprendendo que até mesmo as crianças são chamadas a serem pequenos discípulos missionários de Jesus. As crianças também podem anunciar a outras crianças, e também aos adultos, as mensagens de amor do Cristo.\n\nNuma tarde, durante uma das missões, Otávio disse ao Padre Pedro, ao seu irmão e Isabel que achava engraçado ouvir os estrangeiros falarem. E que o mais legal era que eles conseguiam entender o que os apóstolos falavam de Jesus. E o padre recordou que isso se deve à ação do Espírito Santo. E que houve uma época em que todos falavam a mesma língua, na época em que era construída a Torre de Babel.\n\n– Torre de Babel? O que era isso, padre?\n\n– A Torre de Babel, depois podem ler na Bíblia, no Livro de Gênesis, foi uma torre construída por um povo que queria que ela chegasse ao céu, para chegarem a Deus e estarem mais perto dele.\n\n– Nossa, padre, mas isso não foi uma afronta para Deus? Como que alguém pode achar que construindo uma torre se pode chegar até Ele?\n\n– Pirou, Leandro, bem pior! Eles queriam se igualar a Ele.\n\n– E Deus não fez nada? – perguntou Isabel.\n\n– Fez sim. Deus, então, parou a construção e fez com que a torre ruísse, e não sobrou nada.\n\n– E depois, o que Ele fez, padre? – indagou Otávio.\n\n– Depois castigou os homens de maneira que estes falassem várias línguas para que os homens não se entendessem e não pudessem voltar a construir uma torre com esse propósito. E os três ficaram boquiabertos.\n\n– E vejam como é a maravilha de Deus. Aqueles que construíam Babel queriam ser poderosos e famosos, e com o Pentecostes Deus mostra que, quando nos colocamos no seguimento de Cristo, mesmo que falando línguas diferentes, Deus nos une e age na vida de cada um. Por isso é que esses estrangeiros conseguem entender o que os apóstolos falam.\n\n– Olha o que o Totó tá fazendo! – gritou Isabel. O cachorrinho corria atrás de uma borboleta e eles acharam engraçado e caíram na risada.\n\nApós a história o catequista questiona os catequizandos se em algum momento eles se recordam de terem passado por momentos de medo, ansiedade (deixar os catequizandos falarem). Fazer uma comparação com esses momentos vivenciados por eles e com o momento vivenciado pelos discípulos.\n\nAcrescentar que os discípulos conseguiram superar esse momento graças ao Espírito Santo, que lhes forneceu coragem, ânimo, sabedoria. Jesus quer que seus discípulos continuem sua missão pelo mundo, mas sabe das suas limitações, por isso envia o Espírito Santo. Nós todos temos uma missão, que é sermos anunciadores (através de nossos exemplos) de um novo mundo. Um reino de amor e paz que deve se estabelecer na Terra, mesmo diante de nossas diferenças. Deus confia a nós essa missão. Mas conhece nossas limitações, e por isso o Espírito Santo continua em nosso meio, para nos auxiliar.\n\nDinâmica: O catequista apresenta os cartazes do ambão aos catequizandos. Estamos em um mesmo planeta, porém muitas vezes temos situações diferentes. Mostrar um cartaz de cada vez e pedir para os catequizandos falarem sobre o que estão vendo.\n\nAnalisar junto a eles: Qual dessas imagens deve agradar mais a Deus, estar mais próxima ao Reino que Ele quer para nós? Mostrar o cartaz com ambiente desarmonioso e questionar junto aos catequizandos: Diante dessa imagem o que poderia acontecer para ser diferente? (deixar que falem). Encerrar pedindo para que cada catequizando faça um propósito de durante a semana trabalhar com uma ação para transformar o mundo em que vive em um lugar melhor. (A proposta é livre e deverá ser feita na 1ª pessoa do presente: Ex.: Eu não brigarei. Eu cuidarei dos animais e das flores. Eu aconselharei as pessoas a serem mais educadas, assim como eu serei.) É importante esse compromisso ser formulado na 1ª pessoa, pois reforça que para termos um mundo melhor, depende de MIM e não somente dos OUTROS.\n\nConclusão: Deus conta com cada um de nós para transformar esse mundo no seu Reino. Não devemos esperar sempre que outra pessoa o faça. Cada um de nós pode começar hoje mesmo a melhorar o mundo em que vive com gestos simples. Se cada um fizer a sua parte, com certeza o mundo será transformado e começaremos a viver aqui o Reino de paz e amor anunciado por Jesus. Pedir para que durante a semana os catequizandos possam viver o compromisso que assumiram de proposta para um mundo melhor. Essa proposta será vivenciada durante a semana e no próximo encontro cada um falará sobre a sua experiência. O Reino de Deus não foi uma promessa feita somente há tempos atrás. Para que essa promessa de um mundo de paz e harmonia (verdadeira Jerusalém Celeste) se concretize, dependerá de cada um de nós.\n\nOração final: O catequista convida os catequizandos a ficarem em pé ao redor da Mesa da Palavra e a rezarem juntos a oração de São Francisco de Assis (pode ser através da música ou oração rezada onde catequista fala e os catequizandos repetem), e conclui com a oração:\n\nÓ Pai bondoso, mais uma vez aqui nos reunimos para falarmos de suas maravilhas. Ajudai-nos a sermos discípulos missionários fiéis para testemunhar seu amor e sua grandeza a todos os homens. Ajudai-nos a viver o céu aqui na terra. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N..., vai em paz e ajudai a construir o Reino de Deus aqui na terra!\"", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, dois cartazes: Um representando um ambiente hostil (guerra, fome, morte, tristeza, desmatamento etc.), outro cartaz representando um ambiente harmonioso (sorriso, abraço, fraternidade, natureza bem-cuidada etc.), música e/ou oração de São Francisco de Assis."}, {"id": "e19", "num": 19, "kind": "encontro", "title": "Está sentado à direita de Deus Pai todo-poderoso", "when": "Tempo comum", "biblia": "Mc 16,19-20", "body": "Palavra inicial: Neste encontro, tendo como base a relação da Santíssima Trindade, desenvolveremos o conceito de família, resgatando essa instituição dentro das suas novas modalidades. Reavaliaremos alguns valores de respeito, obediência e comunhão entre os membros que compõem a Família.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e flores. Para a dinâmica: lápis de cor e papel sulfite para todos os catequizandos.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os carinhosamente: \"Cristo é AMOR ...N..., seja bem-vindo!\" Quando todos estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Após serem acolhidos, convida-os a se colocarem ao redor da Mesa da Partilha ou da Mesa da Palavra, onde farão uma retrospectiva da semana, e o catequista poderá recordar o encontro anterior, pedindo para que partilhem o que cada um experienciou. Poderão destacar, ainda, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista motiva um momento de oração, criando um clima de interiorização para o início do encontro e para a proclamação da Palavra. O catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico. Antes, porém, todos poderão aclamar o Santo Evangelho.\n\nLeitura do texto bíblico: Mc 16,19-20. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] o Senhor Jesus foi elevado ao céu e sentou-se à direita de Deus...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista pede para os catequizandos falarem sobre o que entenderam da passagem bíblica deste encontro. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Contar a história \"Fim da missão\", frisando a relação de obediência de Jesus com o Pai, bem como com José e Maria.\n\nFim da missão\n\nNossos amigos, o Padre Pedro, Otávio, Leandro e Totó, já tinham percorrido vários lugares acompanhando os apóstolos em missões. Nessas missões os apóstolos proclamavam as maravilhas que o Senhor Deus podia realizar em suas vidas; batizavam e curavam pessoas de doenças. Leandro, de volta a Jerusalém com seus companheiros, perguntou ao padre:\n\n— Padre, eu tava aqui pensando... Jesus podia ter dito não pro seu Pai e não ter pregado pras pessoas que era o seu Filho, que era o Messias?\n\n— Podia sim, Leandro. Jesus era homem e era Deus. O seu lado de humano tinha o livre-arbítrio e podia ter recusado.\n\n— O que é livre-arbítrio, padre?\n\n— Livre-arbítrio, é o direito que Deus nos deu de escolher as coisas. Nós podemos escolher fazer o bem ou o mal, por exemplo. Só que toda escolha tem uma consequência. Se escolhemos fazer o mal, por exemplo, podemos ser presos, as pessoas não vão querer ficar perto de nós, seremos deixados de lado.\n\n— Mas se Jesus não quisesse, ter passado por tudo o que passou, como que ia ser? – quis saber Isabel.\n\n— Nós não estaríamos aqui... não teríamos o direito do perdão de Deus, não poderíamos viver a vida eterna depois que morrêssemos. Eu com certeza nem seria padre, porque não teria sentido.\n\n— Por que não? – indagou Otávio.\n\n— Porque o padre tem de anunciar o Reino de Deus para todas as pessoas. E se Jesus não tivesse falado dele, não saberíamos que Deus estava disposto a nos receber nele.\n\n— Nossa, mas então, se Maria não tivesse aceitado também ser a mãe do Filho de Deus, vixe, Jesus nem teria nascido! – exclamou Isabel.\n\n— Pois é! Viu só como as nossas escolhas sempre têm consequências? Maria, Jesus, e até mesmo José – que podia ter dito a todos que o filho que ela carregava no ventre não era seu, fazendo com que ela fosse apedrejada – aceitaram aquilo que Deus tinha como plano. Eles foram obedientes ao pedido dele e toda a humanidade ganhou bênçãos a partir disso.\n\n— Muito legal. E que Deus seja louvado por isso, por esse amor que Ele tem com a gente.\n\n— Isso mesmo, Isabel. Temos sempre de louvar, de agradecer a Deus – falou o padre.\n\n— E a gente tem que louvar e agradecer a Ele por termos tido a oportunidade de podermos viajar no tempo e vivenciar todas essas coisas. E eu ainda pude viajar duas vezes! – falou o padre. E uma suave brisa os envolveu. A sala que estavam ficou escura e, num canto, perto de uma janela, a grande Bíblia reapareceu.\n\n— É a grande Bíblia! Já podemos voltar pra casa!\n\n— Sim, podemos. E vamos voltar tendo no coração essa missão de anunciar pra todo mundo as maravilhas do Senhor, mesmo que ninguém acredite que Deus pode e quer abençoá-las. Vamos voltar e vocês vão encenar o Auto de Natal, sabendo da missão que José e Maria tinham e que aceitaram realizar com amor e respeito a Deus.\n\nAs crianças assentiram. Mas, e Totó? Ele poderia voltar para o futuro com eles?\n\n— Crianças, é melhor não levarmos. Ele pertence a essa época.\n\n— Mas quem vai cuidar dele, padre?\n\n— Nenhum dos apóstolos vai deixar Totó sozinho. Alguém vai cuidar dele. Não podemos levá-lo, Otávio.\n\nE chorando as crianças se despediram de Totó. O cãozinho parecia saber que não os veria mais e também tinha os olhos cheios de lágrimas.\n\n— Vou sentir saudades de você, Totó! – exclamou Otávio, o que mais tinha se apegado ao cão. Ele deu um forte abraço e deu a mão para o padre, que estendeu a sua para irem. Totó ficou ali observando os quatro atravessarem a grande Bíblia. Ele não latiu, apenas olhava seus amigos partirem.\n\nApós a história, indagá-los: Quem era a Família de Jesus? Explicar a grande sintonia que existia entre o Pai e o Filho (quem vê o Filho vê o Pai, e quem vê o Pai, também está junto do Filho). Falar também da família terrestre que Jesus teve e da grande comunhão que existia entre eles:\n\n\"em seguida desceu com eles a Nazaré e lhes era submisso\" (Lc 2,51).\n\nDinâmica: Pedir para que cada catequizando faça o desenho da sua família. Como ela é composta (pai, mãe, avô, tia, irmãos). Quando terminarem, cada um deverá apresentar o desenho à turma, dizendo quem são as pessoas que desenhou e como elas são. (Ex.: Essa é a minha avó, ela mora lá em casa e é muito brava).\n\nObs.: Esse será um bom momento para o catequista conhecer melhor a constituição da família de seu catequizando e qual a imagem que ele tem sobre os membros da sua família. Em seguida, todos colocarão o desenho que fizeram próximo ao ambão. No final o catequista poderá fazer uma oração por todas essas famílias.\n\nApós a atividade, o catequista reflete com os catequizandos, que, assim como eles, tem uma família, assim também Jesus nasceu em uma família e compromete-se com o projeto do Pai. Jesus cumpre o plano do Deus Pai: vive em uma família, sendo filho, e livremente (seu lado humano), é obediente a Deus até o final. Depois de cumprir a vontade do Pai aqui na terra, Ele voltou para junto de Deus Pai. Assim nós também passaremos um tempo aqui, e no tempo oportuno retornaremos para junto de Deus, nosso Pai e Criador.\n\nConclusão: O catequista poderá reforçar o sentimento de amor, obediência e respeito que devemos ter diante de todos os membros da nossa família. Lembrá-los que, através de Deus, também formamos uma grande e única família. Que Jesus foi obediente até nas coisas que lhe eram difíceis, como deixar ser humilhado e morrer na cruz, mas Ele confiou no Pai do céu, pois sabia que aquilo era para o bem da humanidade. Nossos pais, também, às vezes nos pede algo, para o nosso bem e para o bem de todos da família.\n\nOração final: O catequista convida a todos a se colocarem ao redor da Mesa da Palavra, onde estimula os catequizandos a formularem preces e louvores por suas famílias. Conclui com o Pai-nosso e com a oração:\n\nDeus nosso Pai, Tu valorizas tanto a família que fez com que teu filho nascesse em uma. Em tudo Jesus foi obediente ao Pai. Que nós possamos ter esse mesmo sentimento, e que o Senhor nos ajude a acolher e sermos agradecidos pela família que temos. Por Cristo Nosso Senhor. Amém.\n\nDiante dos desenhos que cada catequizando fez da sua família, poderão cantar uma música relacionada à família. No final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... seja obediente a Deus, vai em paz, que o Senhor te acompanhe!\"\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 659 a 667 do Catecismo da Igreja Católica (CIC).", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e flores. Para a dinâmica: lápis de cor e papel sulfite para todos os catequizandos."}, {"id": "e20", "num": 20, "kind": "encontro", "title": "Donde há de vir a julgar os vivos e os mortos", "when": "Tempo comum", "biblia": "Jo 5,21-24", "body": "Palavra inicial: Amados catequistas, neste encontro queremos refletir com os catequizandos que Jesus Cristo voltará e há de julgar a todos nós, porém o seu julgamento é amor e misericórdia. Além disso, queremos discutir sobre os nossos julgamentos, muitas vezes injustos e preconceituosos, contra nosso irmão.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e flores.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os para dentro da sala: \"Seja bem-vindo... N..., venha sentar-se junto de Deus\". Pede para que se assentem nas cadeiras ao redor da mesa. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra, o catequista motiva os catequizandos a fazerem um momento de recordação da vida, destacando fatos e acontecimentos que marcaram a semana.\n\nNA MESA DA PALAVRA\n\nOração inicial: Após a recordação da vida o catequista inicia a oração, de maneira bem espontânea, invocando o Espírito Santo, onde também poderá ser rezado o Credo. Em clima de oração ainda todos aclamam o Evangelho com um canto e o catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Jo 5,21-24. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] O Pai não julga ninguém, mas entregou ao Filho todo o poder de julgar, para que todos honrem o Filho como honram o Pai...\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nOs catequizandos reconstroem o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após o catequista conta a história \"Ajudando o próximo\".\n\nAjudando o próximo\n\nAs crianças abriram os olhos e estavam caídas na sala escura. O Padre Pedro também estava caído e desacordado. Havia parado de chover, mas ainda relampejava e trovejava. Assim como seus pais, eles pensaram ter sonhado. Um olhou para o outro sem dizer nada. Leandro, que estava com o figurino de anjo, tentou mexer as asas e nada aconteceu. Eles sentiram um alívio.\n\n– Vamos acordar o padre! – disse Otávio.\n\nOs três cutucaram o padre, que acordou reclamando de dor de cabeça. Viu que eles estavam bem e disse que era melhor que não comentassem nada com ninguém, pois não iriam acreditar e que só contassem aos pais depois da missa.\n\nAmanda, a mãe de Isabel, estava preocupada com a demora deles. E ainda cochichou com o Padre Pedro de que até havia pensado que eles tinham encontrado a grande Bíblia. O padre respondeu dizendo que depois da missa eles conversavam sobre isso e ela teve a certeza de que sua filha e os filhos gêmeos de Fernando haviam estado na época de Jesus, mas agora, na companhia do padre.\n\nOtávio comentou com seu irmão e Isabel que estava preocupado com Totó.\n\n– Será que ele tá bem lá?\n\n– Vamos acreditar que sim, né!? – respondeu o irmão.\n\nDepois chegou Wilson, o garoto da sala de catequese deles que interpretaria um dos reis magos reclamando de Zezinho, que seria outro rei mago.\n\n– Ah, o Zezinho nunca fez certo a marcação. Todas as vezes ele me derrubou. Tô morrendo de medo dele me fazer cair na hora.\n\n– Tenta ajudar ele, Wilson. Você sabe que ele nasceu com problema na perna e tem dificuldade pra ajoelhar. Na hora que forem entregar os presentes, pega na mão dele – disse Isabel.\n\n– E assim você ajuda ele e nenhum dos dois caem – completou Otávio.\n\n– Ah, eu já acho que ele não deveria participar. Mas a mãe da Isabel falou que ele podia.\n\n– A gente tem que respeitar as dificuldades de todo mundo, Wilson. Você, com certeza, vai mostrar ter dificuldade em alguma coisa – ressaltou Leandro.\n\n– Ah, ele tem! Não sabe a tabuada do sete, do oito e nem do nove! – falou Isabel, debochando.\n\n– Ah... é difícil, não dou conta de decorar. E eu não gosto de Matemática. Prefiro Língua Portuguesa!\n\n– Então, já que você tem que ter ajuda pra aprender Matemática, ajude o nosso amigo Zezinho a se ajoelhar. Ele não é assim porque quer, mas porque tem problema no joelho, de nascença.\n\n– Tá bom, Isabel! Você me convenceu.\n\n– Venham pra cá, crianças, vamos nos preparar que a missa está quase terminando. Já vai começar a distribuição da Comunhão – disse Amanda, levando as crianças para os seus lugares para o início do Auto de Natal.\n\nAo término da história o catequista fala um pouco aos catequizandos sobre a parusia, sobre a volta de Jesus no juízo final. A Igreja acredita e nos ensina que Cristo voltará um dia, não sabemos quando, por isso vivemos na vigilância, orando e clamando sempre: \"Vem, Senhor, Jesus\" (Ap 22,20). Na sua vinda será instaurado definitivamente seu Reino. Nesse dia, os segredos dos corações dos homens e mulheres serão revelados, bem como a conduta de cada um em relação a Deus e ao próximo. Todo homem será repleto de vida ou condenado pela eternidade, de acordo com suas obras (CIC 678-682). Nesse dia, \"Deus será tudo em todos\" (1Cor 15,28).\n\nPortanto, acreditamos no juízo particular, logo após a morte de cada um de nós e no juízo universal, coletivo, no final dos tempos (mundo), onde o julgamento será definitivo. Porém, é preciso deixar claro aos catequizandos que o julgamento de Cristo é o Amor e a Misericórdia. Que não devemos ficar fantasiando o final dos tempos como vemos em filmes e em algumas histórias, cheio de fogo e de ira. A Igreja em nenhum momento afirma que alguém tenha sido condenado, pois a misericórdia de Deus é muito maior que nossos pecados. \"Onde foi grande o pecado, foi bem maior...\n\na graça\" (Rm 5,20). Porém, é bom lembrar que a graça do perdão pressupõe o querer do homem. É preciso arrepender-se para colocar-se diante de Deus. O catequista também poderá trabalhar com os catequizandos que o único que pode julgar a alguém é Jesus, pois Ele é o único que conhece a história e o coração de cada um. Nós, enquanto seres humanos, mortais, sujeitos a erro, não devemos apontar o dedo a ninguém, pois não nos cabe julgar. Devemos amar o nosso próximo, procurando conhecê-lo e ajudá-lo a crescer. Nossa atitude deve ser de compaixão com os que erram e sempre lhes indicando o caminho do Senhor.\n\nQuestionar os catequizandos sobre o que é o juízo para eles, e se já fizeram algum juízo ou acusaram alguém, e depois descobriram que estavam equivocados. Deixar que falem. Depois, reunindo todas as experiências partilhadas, o catequista os motiva a um momento de perdão, que poderá ser feito com um canto penitencial.\n\nConclusão: Este momento de reflexão poderá fechar-se com a proposta de um gesto concreto, onde os catequizandos serão convidados no decorrer da semana a rezar por todas as pessoas que não creem em Jesus Cristo, como também procurar entender e compreender a limitação de cada um, saber aceitar o diferente em nosso meio, sem preconceito.\n\nOração final: Ao redor da Mesa da Palavra o catequista motiva os catequizandos a formularem orações e preces a Deus Pai. Depois o catequista conclui com o Pai-nosso e com a oração:\n\nDeus de bondade, que conheces o coração de cada um de nós, ajuda-nos a amar o nosso irmão, respeitando e aceitando as suas limitações. Que saibamos conduzi-los até Jesus. Por Cristo Nosso Senhor. Amém.\n\nAo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... filho amado de Deus, vai em paz, e que o Senhor te acompanhe!\"\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 668 a 682 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: \"[...] E de novo há de vir, em sua glória, para julgar os vivos e os mortos; e o seu reino não terá fim [...]\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e flores."}, {"id": "e21", "num": 21, "kind": "encontro", "title": "Um Deus de amor", "when": "Tempo comum", "biblia": "Jo 3,16-21", "body": "Palavra inicial: Neste encontro queremos ressaltar o grande Amor que Deus tem por cada um de nós. É um amor incondicional, capaz de entregar o seu próprio Filho para resgatar-nos do pecado. Queremos refletir, além disso, que é esse amor que devemos anunciar a tantas pessoas que não se sentem amadas e com amor acolhê-las em nosso meio.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Para a dinâmica: Papel pardo ou folha de jornal (01 para cada catequizando), aparelho de som e música alegre/descontraída.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os ao interior da sala: \"...N... nosso Deus é amor. Seja bem-vindo!\"\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra os catequizandos farão uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, pedindo que partilhem o que cada um experimentou. Poderão destacar, além disso, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: Colocando no coração de Deus todos os elementos trazidos durante a recordação da vida, o catequista inicia a oração invocando o Espírito Santo e pedindo que Deus derrame o seu amor no coração de cada catequizando. Todos poderão aclamar o Evangelho e o catequizando (designado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Jo 3,16-21. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"Deus amou tanto o mundo que entregou o seu Filho único, para que todo aquele que nele crer não morra, mas tenha a vida eterna...\"\n\nTodos se dirigem à Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nDeixar que os catequizandos falem do que cada um entendeu sobre o texto. Depois pedir aos catequizandos que abram suas bíblias na passagem proclamada na Mesa da Palavra, e convidá-los a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Depois refletir junto a eles, enfatizando o grande amor que Deus tem por cada um de nós. Logo após, o catequista poderá contar a história \"Feliz Natal\".\n\nFeliz Natal!\n\nE chegou a hora tão esperada pelas crianças: a hora da representação do Auto de Natal. Tudo foi muito bonito e tudo havia dado certo. Zezinho teve a ajuda de Wilson para se ajoelhar na hora de entregar os presentes dos reis magos ao Menino Jesus e não caiu sobre ele. A última frase do teatro era de Leandro, que interpretava o Arcanjo Gabriel. Diante de Isabel e Otávio, que interpretavam Maria e José, disse a toda a assembleia reunida na igreja matriz:\n\n– E Deus veio pisar nesta terra criada por Ele. Fez-se homem para morrer por amor de suas criaturas. E nasceu pobre para que todos aprendessem com Ele que a maior riqueza está no coração, que é o que podemos fazer de bom pelos nossos irmãos sem esperar nada em troca. Feliz Natal!\n\nDepois um coro de anjos cantou a música \"Noite Feliz\", emocionando ainda mais as pessoas.\n\nDinâmica: Depois da história o catequista deverá entregar uma folha (papel pardo ou folha de jornal) a cada catequizando. Deverá explicar que esse papel representa uma ilha. E que cada catequizando deverá manter-se na sua ilha, pois ao redor há muita água com tubarões (imaginários). Os catequizandos recebem o papel e ficam em pé sobre ele. O catequista diz que esses tubarões de vez em quando dormem. E quando isso ocorre os catequizandos poderão passear de uma ilha a outra. O catequista então explica que colocará uma música, e essa música indica que os tubarões estão dormindo. Ao parar a música, todos devem correr para alguma ilha (representada pelo papel), para não serem mordidos por um tubarão.\n\nO catequista inicia a dinâmica, colocando a música. Enquanto a música toca, os catequizandos poderão deslocar-se. O que ocorrerá é que o catequista, antes de desligar a música, sempre recolherá algumas dessas folhas. Dessa forma, o catequizando que ficar sem a sua ilha deverá procurar refúgio em outra ilha, junto com outro catequizando. Isto ocorrerá várias vezes, até que sobre apenas uma folha, obrigando todos os catequizandos a estarem unidos nessa mesma folha (ilha). Os catequizandos deverão acolher os seus companheiros e não os deixar à mercê do tubarão.\n\nDepois da dinâmica refletir sobre a unidade e solidariedade que o cristão necessita exercitar com todos, sem excluir as pessoas. O catequista poderá fazer uma analogia desta dinâmica com o amor de Deus por todos nós. Ele nos quer sempre unidos. Nos ama tanto que não quer que ninguém se perca. A água do mar representa o mundo, os tubarões nossas dificuldades, tentações, erros (que querem nos engolir). A ilha é o próprio Deus, que é fonte segura que nos quer sempre unidos, acolhendo a todos e não querendo que ninguém se perca.\n\nMuitas vezes nos distanciamos dessa ilha (Deus) por causa do pecado, das coisas que desagradam a Deus. Mas Ele sempre está presente. O seu amor é tão grande que abriga a todos os que o buscam. Deus, para não deixar que ninguém se perdesse, que ninguém morresse, entregou à morte o seu próprio Filho por amor a nós, para nos salvar. Será que nós teríamos essa disposição de dar o nosso lugar na...\n\n...ilha e morrer para salvar o nosso irmão? Deus morreu por nós e a seu exemplo temos que doar a nossa vida por nosso próximo. Só o amor mudará as situações de injustiça e os ambientes sem esperança.\n\nConclusão: O catequista poderá além disso citar vários exemplos do Amor de Deus para conosco: a criação do mundo, a vinda do seu Filho, os seus \"sinais\" (milagres) e a esperança que está conosco até o fim dos tempos (os catequizandos poderão ser motivados a citar alguns exemplos do amor de Deus para conosco). O que ocorre é que muitas vezes não entendemos esse amor, pois não estamos acostumados a um amor incondicional (sem troca). Mas esse Amor (muitas vezes já provado) existe e vem de Deus. O compromisso da semana será falar desse amor de Deus a alguém. Pode ser alguém da nossa família, ou um coleguinha. Não basta apenas ter ciência do Amor de Deus, é preciso senti-lo e transmiti-lo a outras pessoas.\n\nOração final: O catequista convida a todos a se colocarem ao redor da Mesa da Palavra de onde estimula os catequizandos a louvarem a Deus por suas obras de amor, citando fatos, coisas e acontecimentos do nosso dia a dia. Ao final reza o Pai-nosso e conclui com a oração:\n\nSenhor, em um mundo que muitas vezes desconhece o teu amor, ajuda-nos no compromisso de transmiti-lo a outras pessoas, de proclamá-lo a todos os que nos rodeiam, e dessa forma aumentar ainda mais o número de pessoas que possam provar e sentir todas as tuas promessas de Boa Nova. Ajuda-nos! Por Cristo Nosso Senhor. Amém!\n\nAo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... nasceste para o amor. Vai em paz, e que o Senhor te acompanhe! Amém\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores. Para a dinâmica: Papel pardo ou folha de jornal (01 para cada catequizando), aparelho de som e música alegre/descontraída."}, {"id": "e22", "num": 22, "kind": "encontro", "title": "Creio no Espírito Santo", "when": "Tempo comum", "biblia": "Jo 14,25-27", "body": "Palavra inicial: Com este encontro queremos refletir com os catequizandos que o Espírito Santo, terceira pessoa da Santíssima Trindade, é aquele que nos auxilia, que nos santifica, que nos dá a coragem e o impulso de servir a Deus e testemunhar a Verdade de Cristo.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, flores e símbolos que representam o Espírito Santo: água, fogo, óleo do crisma, pomba. Para a dinâmica, espalhar velas pela sala de encontro e providenciar pedaços de pano ou TNT para que os catequizandos se deitem no chão, aparelho de som e música de relaxamento ou instrumental.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os carinhosamente: \"Seja bem-vindo... N..., templo vivo do Espírito Santo!\" Quando todos estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Depois de serem acolhidos, convida-os a colocarem-se ao redor da Mesa da Partilha ou da Mesa da Palavra, onde farão uma retrospectiva da semana, e o catequista poderá recordar o encontro anterior, pedindo que partilhem o que cada um experimentou. Poderão destacar, além disso, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista motiva um momento de oração, criando um clima de interiorização para o início do encontro e para a proclamação da Palavra. Antes, porém, todos poderão aclamar o Evangelho com um canto. O catequizando (designado como leitor do encontro) se dirige até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Jo 14,25-27. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] o Espírito Santo que o Pai enviará em meu nome, Ele vos ensinará tudo e vos recordará tudo o que vos disse. Deixo-vos a paz...\"\n\nTodos se dirigem à Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista pede aos catequizandos que falem sobre o que entenderam da passagem bíblica deste encontro. Deixar que falem. Depois pedir aos catequizandos que abram suas bíblias na passagem proclamada na Mesa da Palavra, e convidá-los a uma leitura silenciosa observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Depois o catequista pergunta aos catequizandos se já sentiram a presença do Espírito Santo. Se em algum momento de medo, de dificuldade, sentiram uma calma e uma paz, uma força que os ajudava. Deixar que falem.\n\nO catequista poderá depois, na medida do possível, valorizar o que cada catequizando disse e pedir que se imaginem no topo de uma montanha, onde sentem uma brisa leve e o vento bater no seu rosto. Depois diz que esse vento não pode ser visto pelos nossos olhos, mas pode ser sentido. E completa dizendo que assim é o Espírito Santo, não podemos vê-lo, mas o sentimos a todo instante na nossa vida. O catequista além disso poderá convidá-los a fazer essa experiência de sentir e clamar ao Espírito Santo nas suas vidas como na dinâmica seguinte.\n\nDinâmica: Pedir que cada catequizando pegue um pedaço de tecido ou TNT e se deite no chão, espalhando-se pela sala de encontro. Depois o catequista acende as velas espalhadas pela sala e, se possível, diminui a claridade da mesma, fechando as cortinas ou apagando as luzes. Convida-os por um momento a clamar ao Espírito Santo, rezando e cantando uma música de invocação do Espírito Santo. Depois coloca de fundo uma música instrumental ou de relaxamento e com um tom de voz baixo, o catequista pede aos catequizandos que sintam a paz que só Deus pode dar. O catequista poderá conduzir um momento de oração, pedindo que se concentrem e deixem de lado todas as distrações, e vai pedindo que Deus possa enviar o Santo Espírito sobre eles, para curá-los, santificá-los e fortalecê-los na fé. Ficar um período em silêncio, deixando apenas a música de fundo.\n\nConclusão: O catequista, após um tempo oportuno, pede que todos se assentem onde estão e partilhem o que cada um sentiu.\n\nOração final: O catequista convida a todos a se colocarem ao redor da Mesa da Palavra onde estimula os catequizandos a louvarem e agradecerem por todas as experiências e sentimentos vivenciados. Podem formular preces pelas suas vidas e pelas suas famílias. Conclui com o Pai-nosso e com a oração:\n\nDeus nosso Pai, que enviastes o Espírito Santo santificador sobre cada um de nós. Fortalecei-nos na missão e no seguimento de vossa Palavra, fazendo-nos templos vivos de amor para todos os que nos forem confiados. Por Cristo Nosso Senhor. Amém.\n\nAo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo: \"...N... o Senhor está contigo, vai em paz!\"\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 683 a 747 do Catecismo da Igreja Católica (CIC);\n* No Símbolo niceno-constantinopolitano: \"[...] Creio no Espírito Santo, Senhor que dá a vida e procede do Pai e do Filho; e com o Pai e o Filho é adorado e glorificado: Ele que falou pelos profetas...\".", "prep": "Ambão com toalha da cor do Tempo Litúrgico, flores e símbolos que representam o Espírito Santo: água, fogo, óleo do crisma, pomba. Para a dinâmica, espalhar velas pela sala de encontro e providenciar pedaços de pano ou TNT para que os catequizandos se deitem no chão, aparelho de som e música de relaxamento ou instrumental."}, {"id": "e23", "num": 23, "kind": "encontro", "title": "Creio \"na Santa Igreja Católica\"", "when": "Tempo comum", "biblia": "Mt 16,13-19", "body": "Palavra inicial: Querido catequista, hoje refletiremos sobre o 9º artigo da Profissão de Fé. Queremos apresentar a Igreja não como um espaço físico, mas como povo de Deus, grupo de batizados reunidos na mesma fé em Cristo Jesus.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores e imagem ou quadro de São Pedro.\n\nAcolhida: À medida que os catequizandos vão chegando, o catequista os acolhe, saudando-os com a frase: \"Formamos um só corpo... N..., seja bem-vindo!\", e convidando-os a entrar no local do encontro.\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra o catequista motiva os catequizandos a fazerem um momento de recordação da vida, onde recordarão fatos e acontecimentos que marcaram a vida de cada um, de suas famílias, comunidade e da sociedade.\n\nNA MESA DA PALAVRA\n\nOração inicial: Depois do momento de recordação da vida, o catequista inicia um momento de oração pedindo o Espírito Santo sobre todos os catequizandos e sobre toda a Igreja. Poderá rezar o Credo. Em espírito de oração todos aclamam o Evangelho com um canto e o catequizando (designado como leitor do encontro) se dirige até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: Mt 16,13-19. Depois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] E eu te declaro: Tu és Pedro e sobre esta pedra construirei a minha Igreja...\"\n\nTodos se dirigem à Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nO catequista incentiva os catequizandos a reconstruírem o texto bíblico. Depois pedir aos catequizandos que abram suas bíblias na passagem proclamada na Mesa da Palavra, e convidá-los a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após conta a história \"Quem é o Papa mesmo?\", sublinhando que a Igreja é um projeto de Deus e que Pedro foi escolhido para ser o primeiro papa da Igreja.\n\nQuem é o papa mesmo?\n\nMuitos dias haviam se passado. A nossa amiguinha Isabel e os gêmeos Otávio e Leandro participaram da missa em que se celebrou o dia dos apóstolos São Pedro e São Paulo. Depois da missa almoçaram na casa paroquial a convite do Padre Pedro, que comemorava seu aniversário, junto com os pais. E aí Otávio disse que foi muito legal ter conhecido São Pedro durante a viagem no tempo e que teria gostado de ter conhecido também a Paulo. E conversando sobre a Igreja, a religião Católica Apostólica Romana, as três crianças ficaram sabendo que Pedro tinha sido escolhido por Jesus para ser o primeiro papa. E o papa é quem mesmo? Sabe dizer?\n\nAo final da historinha perguntar aos catequizandos o que sabem sobre a \"Igreja\". Deixar que falem livremente. Depois explicar aos catequizandos que a palavra \"igreja\" significa \"convocação\". É todo o povo que Deus convoca e reúne para constituir o seu Corpo. São todos os que, pela fé e pelo Batismo, se tornam filhos e filhas de Deus. A Igreja não é o local, a Igreja somos todos nós, assembleia, fiéis, batizados que se reúnem em torno da mesma fé em Cristo Senhor (Igreja com \"I\" maiúsculo). A igreja templo (pedra) é o lugar do encontro da Igreja povo com o seu Deus (igreja com \"i\" minúsculo; diferença até na escrita). Diante do caos do mundo, da violência, o ser humano necessita de lugares para reunir-se em assembleia. Mas a Igreja é muito mais do que um simples templo, a Igreja somos todos nós batizados, brancos e negros, índios e mestiços. São os que cantam e os que pintam, são os que limpam e os que leem, é a diversidade de dons que cada um coloca a serviço da comunidade.\n\nA Igreja é santa, pois foi o próprio Deus quem a constituiu, a criou e por ela Jesus Cristo se entregou, para santificá-la e torná-la santificante, e o Espírito Santo a vivifica com a caridade. Mas também é pecadora, por ser formada por homens pecadores, frágeis e limitados. É católica, isto é, universal, porque nela está presente Cristo. Ela anuncia a totalidade e a integridade da fé e é enviada em missão a qualquer tempo e a qualquer cultura.\n\n\"Ide por todo o mundo e anunciai o Evangelho a toda a humanidade\" (Mc 16,15).\n\nMostrando a imagem de São Pedro, o catequista explica aos catequizandos que Pedro foi o escolhido para ser o primeiro papa da Igreja, foi o escolhido para ser o primeiro \"chefe\", aquele que seria a pedra, o alicerce do futuro organizacional da Igreja. O catequista poderá apresentar a lista de todos os papas que vieram depois de Pedro, mostrando a sucessão ininterrupta de pastores. O catequista além disso poderá refletir sobre o Sacramento do Batismo, como porta de entrada para ser membro da Igreja. Sendo batizados passamos a pertencer a essa grande família que é a Igreja Católica Apostólica Romana. No batismo recebemos um sobrenome comum: \"cristão\" e por isso somos todos chamados irmãos. Formamos um grande CORPO, cuja cabeça é Cristo. Nesta grande família cada um tem uma função, assim como o nosso corpo. O catequista poderá pedir que os catequizandos observem seu próprio corpo (mãos, olhos, pés...) e o comparem com a Igreja, onde cada pessoa coloca o seu dom a serviço da comunidade. Na Igreja ninguém pode viver isolado, todos dependemos uns dos outros.\n\nConclusão: O catequista poderá perguntar se sabem o dia em que foram batizados. Se não souberem, pedir que durante a semana façam uma pesquisa para descobrir a data. Aos catequizandos que ainda não foram batizados, o catequista poderá sublinhar que receberão o batismo na quarta etapa da catequese, onde será um momento muito especial e importante para toda a Igreja.\n\nOração final: O catequista convida a todos a se colocarem ao redor da Mesa da Palavra, onde estimula os catequizandos a formularem preces e orações pela Igreja do mundo inteiro, principalmente pelos missionários e missionárias que dedicam toda a sua vida ao anúncio do Evangelho. Conclui com o Pai-nosso e com a oração:\n\nDeus nosso Pai, Vós que nos criastes e nos formastes para viver como uma só família em vossa Igreja, pedimos que sejamos fiéis na missão de testemunhar-vos e anunciar-vos a todos os povos. Por Cristo Nosso Senhor. Amém.\n\nNossa família é feita de todas as raças. Nós somos jovens e velhos, ricos e pobres, homens e mulheres, pecadores e santos. Nossa família se difundiu pelos séculos e pelo mundo. Com a graça de Deus, nós abrimos hospitais para cuidar dos doentes, fundamos orfanatos e ajudamos os pobres. Nós somos a maior organização caritativa no planeta, trazemos alívio e conforto àqueles que precisam. Nós educamos mais crianças do que qualquer outra instituição educativa ou religiosa. Nós desenvolvemos o método científico e as leis de evidência. Nós fundamos o sistema universitário. Nós defendemos a dignidade de toda a vida humana e preservamos o casamento e a família. Cidades receberam os nomes de nossos venerados santos, que percorreram o caminho da santidade antes de nós. Guiados pelo Espírito Santo, nós compilamos a Bíblia. Nós somos transformados pela Sagrada Escritura e pela Sagrada Tradição, que nos têm guiado firmemente por dois mil anos. Nós somos a Igreja Católica. Com mais de um bilhão na nossa família compartilhando dos sacramentos e da plenitude da fé cristã. Por séculos, temos rezado por todo o mundo, a cada hora, a cada dia, sempre que celebramos a missa. O próprio Jesus lançou os fundamentos de nossa fé quando disse a Pedro, o primeiro papa: *\"Tu és Pedro, e sobre esta pedra edificarei a minha Igreja\"*. Por mais de dois mil anos tivemos uma linha ininterrupta de pastores guiando a Igreja Católica com amor e verdade, num mundo confuso e doloroso de se viver. E nesse mundo cheio de caos, dificuldades e dor, é reconfortante saber que algumas coisas permanecem coerentes, verdadeiras e fortes: nossa fé católica e o eterno amor que Deus tem por toda a criação.\n\nSugestão\n\nNo site do YouTube na internet, o catequista encontrará o vídeo com o *\"Comercial da Igreja Católica nos EUA\"* (Católicos voltam para casa – Narrado em português) de quase três minutos, o qual poderá passar aos catequizandos para que tenham uma visão mais ampla da Igreja. Segue o texto narrado no comercial:\n\nMATERIAL DE APOIO\n\n* Aprofundar o tema nos parágrafos 748 a 945 do Catecismo da Igreja Católica (CIC).\n* No Símbolo niceno-constantinopolitano: *\"[...] Creio na Igreja, una, santa, católica e apostólica...\"*\n\n*\"...N..., amai a vossa Igreja, ide em paz, e que o Senhor te acompanhe!\"*\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores e imagem ou quadro de São Pedro."}, {"id": "e24", "num": 24, "kind": "encontro", "title": "Uma só família", "when": "Tempo comum", "biblia": "Jo 15,1-6", "body": "Palavra inicial: Amados catequistas, neste encontro queremos refletir sobre a organização e a estrutura da Igreja Católica Apostólica Romana (papa, clero, dioceses, paróquias...).\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e flores, mapa territorial da diocese e foto do bispo diocesano, do pároco e vigários paroquiais, se houver.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os para dentro da sala: *\"Seja bem-vindo ...N..., ramo da grande videira do Senhor\"*. Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: Ao redor da Mesa da Partilha ou da Mesa da Palavra, o catequista motiva os catequizandos a fazerem um momento de recordação da vida, destacando fatos e acontecimentos que marcaram a vida da comunidade. Poderá também recordar o encontro passado, perguntando aos catequizandos se descobriram o dia em que foram batizados.\n\nNA MESA DA PALAVRA\n\nOração inicial: Após a recordação da vida o catequista inicia a oração, de maneira bem espontânea, invocando o Espírito Santo, onde também poderá ser rezado o Credo. O catequista convida a todos a aclamarem o Evangelho com um canto.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico. Antes, porém, todos poderão cantar, aclamando o Santo Evangelho.\n\nLeitura do texto bíblico: *Jo 15,1-6*.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos:\n\n*\"[...] Eu sou a videira, vós os ramos. Quem permanece em mim, e eu nele, dá muito fruto...\"*\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nOs catequizandos reconstroem o texto bíblico. Deixar que falem. Depois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Logo após, o catequista conta a história \"Rezando com Jesus\", frisando que a Igreja é uma grande família onde cada um tem um papel e uma função, ninguém é maior ou melhor que ninguém, somos todos iguais e estamos todos a serviço.\n\nRezando com Jesus\n\nAinda conversando sobre a Igreja Católica e qual é a função do papa, nossos amiguinhos se lembraram dos dias que passaram acompanhando os discípulos em algumas missões, anunciando o Evangelho.\n\n– E mesmo crianças, vocês são chamados a serem pequenos discípulos missionários de Jesus. Com certeza não viajaram no tempo à toa.\n\n– Nós fizemos a mesma viagem e descobrimos que éramos chamados a evangelizar outras crianças, ou seja, falar de Jesus, do Reino de Deus a elas.\n\n– Ah mãe, a gente sabe disso, a gente conversou sobre isso quando estávamos no passado. A gente só não sabe por onde começar.\n\n– Pois comece falando com seus primos, colegas da escola, do inglês, do futebol, os vizinhos. Quando vocês estão com eles, falam de Jesus? Conversam sobre o que deve ser feito para que o nosso mundo seja melhor?\n\n– Nem sempre, pai – respondeu Leandro.\n\n– Todos os católicos devem lembrar que somos Igreja em todos os ambientes que estamos, não só quando estamos na missa ou participando de algum evento ou reunião dela.\n\n– E como que a gente começa um assunto assim? – quis saber Isabel.\n\n– Não precisa ficar ensaiando, Isabel. É só deixar que o Espírito Santo de Deus aja e fale por meio de vocês. Por isso, é importante sempre rezarem, e não rezarem as orações que todo católico decoram, mas conversar mesmo com Jesus, como um amigo – respondeu o padre.\n\n– Vocês podem rezar pedindo que Jesus as ajudem a encontrar esses momentos certos de falar sobre Ele, sobre tudo o que Ele veio ensinar para que o mundo fosse melhor e mais gostoso para viver, como se aqui já fosse o céu – esclareceu Fernando.\n\nAs crianças ficaram pensativas, e com certeza, antes de dormir rezariam não só a oração do Pai-nosso, Ave-Maria ou do Santo Anjo, mas também conversariam com Jesus, agradecendo pelo dia que tiveram, pedindo bênçãos sobre seus pais, amigos e familiares. E você, como tem rezado? Como você conversa com Jesus? O que você vai dizer hoje a Ele antes de dormir?\n\nApós a história o catequista deverá refletir com os catequizandos se eles conhecem a estrutura e organização da Igreja, mostrando a importância da mesma. O símbolo da videira poderá ilustrar a Igreja onde Cristo é tronco e a Igreja seus ramos.\n\nPequeno esquema para nortear a explicação:\n\n* Igreja Universal: Sede em Roma, conduzida pelo Papa ...N...\n* Conferências episcopais: responsáveis por articular as dioceses no país. No Brasil temos a \"Conferência Nacional dos Bispos do Brasil\" (CNBB).\n* Regionais: Divididos por estados, formam os regionais, responsáveis por articular as ações da Igreja em determinada região. No Brasil temos 17 regionais (ver material de apoio).\n* Diocese ou arquidiocese: Também chamado de \"Igreja particular\" a diocese ou arquidiocese é formada por várias paróquias que têm como pastor o bispo ou arcebispo (aqui o catequista poderá apresentar o mapa da sua diocese, bem como a foto do bispo ou arcebispo, explorando, se preferir, um pouco da história da mesma).\n\nLembramos que a diferença de diocese e da arquidiocese é que a arquidiocese é a sede da província, que é formada por várias dioceses. Exemplo: A diocese de Barretos pertence à Província Eclesiástica de Ribeirão Preto, que é formada por oito dioceses (Ribeirão Preto, Jaboticabal, Franca, São João da Boa Vista, Barretos, São José do Rio Preto, Catanduva e Jales), sendo assim, Ribeirão Preto é chamada de arquidiocese por ser a sede da província que congrega as oito dioceses.\n\n* Paróquias: É formado por um determinado território onde existe um padre (pároco) responsável pela comunidade, e que pode ser auxiliado por outros padres (vigários paroquiais). O catequista nesse momento pode interrogar os catequizandos se eles sabem o nome do(s) padre(s) da paróquia. Poderá, se tiver, mostrar-lhes a foto de cada um. Uma visita poderá ser agendada na casa do padre para que os catequizandos criem laços com o sacerdote. As paróquias podem ser divididas em comunidades e setores. Poderá, se for oportuno, apresentar um pouco do histórico e da organização da paróquia, mostrando para ilustrar e melhor visualizar o mapa com o território paroquial e a divisão das comunidades e setores.\n\nObservação: Dependendo da região, essas divisões podem ser diferentes, ou ainda receber outros nomes. Cada catequista adaptará a sua realidade o encontro de hoje. Se preferir, o esquema acima poderá ser invertido, começando das comunidades e setores, até chegar na Igreja Universal (católica).\n\nConclusão: No encontro de hoje fomos convidados a conhecer um pouco melhor a organização e a estrutura da nossa Igreja, e, como gesto concreto, o catequista poderá pedir aos catequizandos que no decorrer da semana façam uma lista de todas as pastorais, movimentos, associações presentes na paróquia, descrevendo qual o papel que cada uma desempenha na comunidade.\n\nOração final: Ao redor da Mesa da Palavra o catequista motiva os catequizandos a formularem orações e preces a Deus pedindo por toda comunidade paroquial. Depois o catequista conclui com o Pai-nosso e com a oração:\n\n*Deus de infinita bondade, que congregastes vossos filhos em comunidades de amor, ajuda-nos a conhecer e a amar cada vez a tua Igreja. Por Cristo Nosso Senhor. Amém.*\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n*\"...N... permanecei unido à videira, vai em paz, e que o Senhor te acompanhe!\"*", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela e flores, mapa territorial da diocese e foto do bispo diocesano, do pároco e vigários paroquiais, se houver."}, {"id": "e25", "num": 25, "kind": "encontro", "title": "Na comunhão dos santos", "when": "Tempo comum", "biblia": "Mt 5,43-48", "body": "Na comunhão dos santos\n\nPalavra inicial: Neste encontro desenvolveremos junto aos catequizandos a concepção do que é ser santo. Deus nos convida a ter uma vida em santidade, e esse chamado é feito para todos. Procuramos conhecer melhor a vida das pessoas que se tornaram santas e tê-las como exemplo no nosso cotidiano.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela, flores e cestinha com várias imagens de santos (uma para cada catequizando) e uma imagem maior do santo padroeiro da paróquia ou da comunidade.\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os para dentro da sala: \"...N... Cristo te chama à santidade, seja bem-vindo!\" Quando já estiverem na sala, saúda a todos mais uma vez, desejando-lhes boas-vindas.\n\nRecordação da vida: De pé, ao redor da Mesa da Partilha ou da Mesa da Palavra, após serem acolhidos, farão uma retrospectiva da semana, e o catequista poderá perguntar sobre o encontro anterior, pedindo para que partilhem o que cada um experienciou. Poderão destacar, ainda, os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista inicia a oração invocando o Espírito Santo, rezando ou cantando. Poderá ser rezada, se oportuno, a Profissão de Fé.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico. Antes, porém, todos poderão aclamar o Evangelho.\n\nLeitura do texto bíblico: *Mt 5,43-48*.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] sede perfeitos como o vosso Pai celeste é perfeito.\"\n\nNA MESA DA PARTILHA\n\nTodos se dirigem para a Mesa da Partilha.\n\nReconstruir o texto bíblico com os catequizandos. Depois pedir para abrirem suas bíblias na passagem proclamada na Mesa da Palavra, e os convida a uma leitura silenciosa, observando algum detalhe não comentado na reconstrução do texto. Se houver algo, todos podem partilhar. Refletir junto aos catequizandos o texto bíblico, enfatizando que Deus nos convida a ser perfeitos. Esse convite é feito a todos. Várias pessoas que se tornaram santas foram pessoas como nós, porém aceitaram esse convite e tiveram suas vidas transformadas na doação. O catequista poderá questionar junto aos catequizandos o que faz com que uma pessoa seja santa (deixar que falem). O catequista poderá dar exemplos de pessoas que viveram na santidade, frisando que os santos não são só aqueles que foram elevados aos altares, mas todos nós somos convidados à santidade. Os santos não foram perfeitos, mas foram aqueles que reconheceram seus erros e limitações e se esforçaram para serem melhores a cada dia, se esforçaram para colocar em prática os mandamentos do Senhor.\n\nO catequista deverá pegar a imagem do santo padroeiro da sua paróquia ou comunidade (que estava no ambão). Apresentar aos catequizandos, perguntando se eles o conhecem, sabe sua história (deixar os catequizandos falarem).\n\nO catequista então conta a vida do santo e explica por que foi escolhido para ser padroeiro da sua paróquia ou comunidade (é importante que os catequizandos também tenham conhecimento da história da sua paróquia ou comunidade, se essa não foi apresentada no encontro passado). O catequista poderá escolher outro santo, que não seja o padroeiro da paróquia ou da comunidade, se achar oportuno.\n\nApós conversarem, deverá espalhar na Mesa da Partilha todas as imagens de santinho que trouxe. Pedir para que cada catequizando escolha uma que mais tenha se identificado (poderá ter imagens repetidas).\n\nDepois que cada catequizando escolheu, deverá ser proposto que cada catequizando durante a semana pesquise sobre a vida daquele santo e registre a sua história no Diário Catequético e Espiritual. Essa pesquisa pode ser feita através de pergunta aos pais, internet, pergunta ao padre, pesquisa em livros, entre outros.\n\nNo próximo encontro, cada catequizando deverá trazer a imagem (foto) e expor para os demais colegas as informações que obteve sobre a vida daquele santo.\n\nConclusão: Cremos na comunhão dos santos, pois Cristo santifica a sua Igreja. Os santos são os que vivem ainda peregrinos aqui na terra, testemunhando o amor de Jesus Cristo e por Ele sofrendo muitas vezes, bem como todos os que já se encontram na glória de Deus, no céu, o qual unimo-nos pela fé na vida eterna.\n\nSe achar oportuno o catequista poderá falar-lhes sobre o purgatório, onde se encontram aqueles que morreram na amizade de Deus, mas, embora certos de sua salvação eterna, têm ainda necessidade de purificação para obter a santidade necessária e entrar definitivamente na alegria de Deus.\n\nO catequista, por fim, deverá incentivar a pesquisa sobre a vida dos santos. Dessa forma conheceremos mais profundamente a vida desses homens e mulheres que intercedem por nós.\n\nOração final: Ao redor da Mesa da Palavra, o catequista motiva os catequizandos a formularem preces e orações pedindo por todos os batizados, para que sejam fiéis ao chamado à santidade. Poderá encerrar com o Pai-nosso e com a oração:\n\nSenhor nosso Deus, que chamastes tantos homens e mulheres à santidade, pedimos humildemente que chame a cada um de nós e nos ajude a viver e a testemunhar teus mandamentos. Por Cristo Nosso Senhor. Amém.\n\nNo final da oração, o catequista impõe as mãos sobre a cabeça de cada catequizando e traça o sinal da cruz em sua fronte, dizendo:\n\n\"...N... buscai a santidade, vai em paz, e que o Senhor te acompanhe! Amém\".\n\nMATERIAL DE APOIO\n\n- Aprofundar o tema nos parágrafos 946 a 962 do Catecismo da Igreja Católica (CIC).", "prep": "Ambão com toalha da cor do Tempo Litúrgico, vela, flores e cestinha com várias imagens de santos (uma para cada catequizando) e uma imagem maior do santo padroeiro da paróquia ou da comunidade."}, {"id": "e26", "num": 26, "kind": "encontro", "title": "Modelos de santidade", "when": "Tempo comum", "biblia": "1Jo 2,3-6", "body": "Modelos de santidade\n\nPalavra inicial: Neste encontro continuaremos a falar sobre a santidade que Deus pede a cada um de nós. Através da pesquisa feita durante a semana pelos nossos catequizandos, conheceremos mais profundamente a vida dessas pessoas que se tornaram santas, sendo veneradas nos altares das igrejas do mundo todo.\n\nPreparar o ambiente: Ambão com toalha da cor do Tempo Litúrgico, vela e flores. Painel onde serão afixadas as fotos de todos os santos pesquisados pelos catequizandos (poderá ser feito com uma placa de isopor ou cartolina).\n\nAcolhida: O catequista acolhe os catequizandos, saudando-os e conduzindo-os para dentro da sala: \"...N... Cristo te chama à santidade, seja bem-vindo!\"\n\nRecordação da vida: Todos se colocam em pé ao redor da Mesa da Partilha ou da Mesa da Palavra onde farão uma retrospectiva da semana, destacando os acontecimentos importantes que possam ter ocorrido na vida da comunidade.\n\nNA MESA DA PALAVRA\n\nOração inicial: O catequista deverá motivar a oração inicial de maneira bem simples e que seja o mais espontânea possível. Poderá invocar o Espírito Santo com um canto ou com a oração \"Vinde Espírito Santo, enchei...\" Poderá ainda rezar a Profissão de Fé.\n\nO catequizando (escalado como leitor do encontro) dirige-se até o ambão, de onde proclama o texto bíblico.\n\nLeitura do texto bíblico: *1Jo 2,3-6*.\n\nDepois de um momento de silêncio o catequista lê o texto novamente bem devagar, destacando alguns pontos.\n\n\"[...] Dessa maneira sabemos que estamos nele. Quem permanece nele deve também viver como Jesus Cristo viveu.\"\n\nTodos se dirigem para a Mesa da Partilha.\n\nNA MESA DA PARTILHA\n\nRefletir junto aos catequizandos o texto bíblico, enfatizando que Jesus nos convida a sermos perfeitos, santos, como santo é o PAI. Que a santidade é uma busca constante em colocar em prática os mandamentos de Deus.\n\nDepois pedir aos catequizandos para abrirem suas bíblias na passagem proclamada na Mesa d
